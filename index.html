honorarios que serán elegidos mediante una amplia consulta pública por el voto de dos terceras partes de los miembros presentes de la Cámara de Senadores o, en sus recesos, de la Comisión Permanente. Los consejeros desempeñarán su encargo en forma escalonada, por lo que anualmente serán sustituidos los dos de mayor antigüedad en el cargo, salvo que fuesen ratificados por el Senado para un segundo periodo.\n\nEl Presidente del organismo público será designado, a propuesta del Ejecutivo Federal, con el voto de dos terceras partes de los miembros presentes de la Cámara de Senadores o, en sus recesos, de la Comisión Permanente; durará en su encargo cinco años, podrá ser designado para un nuevo periodo por una sola vez, y sólo podrá ser removido por el Senado mediante la misma mayoría.\n\nEl Presidente del organismo presentará anualmente a los Poderes Ejecutivo y Legislativo de la Unión un informe de actividades; al efecto comparecerá ante las Cámaras del Congreso en los términos que dispongan las leyes.\n\nVI. La ley establecerá los derechos de los usuarios de telecomunicaciones, de las audiencias, así como los mecanismos para su protección.","vigencia_hasta":null}],"tema":"Libertad de expresión y derecho de acceso a la información","fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":8,"historial_url":"historial/6.json"},"7":{"numero":"7o.","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 11-06-2013)","publicacion":"2013-06-11","vigencia_desde":"2013-06-12","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 7o. Es inviolable la libertad de difundir opiniones, información e ideas, a través de cualquier medio. No se puede restringir este derecho por vías o medios indirectos, tales como el abuso de controles oficiales o particulares, de papel para periódicos, de frecuencias radioeléctricas o de enseres y aparatos usados en la difusión de información o por cualesquiera otros medios y tecnologías de la información y comunicación encaminados a impedir la transmisión y circulación de ideas y opiniones.\n\nNinguna ley ni autoridad puede establecer la previa censura, ni coartar la libertad de difusión, que no tiene más límites que los previstos en el primer párrafo del artículo 6o. de esta Constitución. En ningún caso podrán secuestrarse los bienes utilizados para la difusión de información, opiniones e ideas, como instrumento del delito.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/7.json"},"8":{"numero":"8o.","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 8o. Los funcionarios y empleados públicos respetarán el ejercicio del derecho de petición, siempre que ésta se formule por escrito, de manera pacífica y respetuosa; pero en materia política sólo podrán hacer uso de ese derecho los ciudadanos de la República.\n\nA toda petición deberá recaer un acuerdo escrito de la autoridad a quien se haya dirigido, la cual tiene obligación de hacerlo conocer en breve término al peticionario.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/8.json"},"9":{"numero":"9o.","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 9o. No se podrá coartar el derecho de asociarse o reunirse pacíficamente con cualquier objeto lícito; pero solamente los ciudadanos de la República podrán hacerlo para tomar parte en los asuntos políticos del país. Ninguna reunión armada, tiene derecho de deliberar.\n\nNo se considerará ilegal, y no podrá ser disuelta una asamblea o reunión que tenga por objeto hacer una petición o presentar una protesta por algún acto, a una autoridad, si no se profieren injurias contra ésta, ni se hiciere uso de violencias o amenazas para intimidarla u obligarla a resolver en el sentido que se desee.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/9.json"},"10":{"numero":"10","estado":"historial_parcial","nota":"Historial extraído del PDF de la SCJN, pero su última versión NO coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026): puede haber una reforma posterior al PDF o una diferencia de extracción. Se muestra como vigente el texto del consolidado; el historial queda pendiente de cotejo.","versiones":[{"id":"v3","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2019-03-26","vigencia_desde":"2019-03-27","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Texto del consolidado de la Cámara; no procede del PDF de la SCJN. Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 10. Los habitantes de los Estados Unidos Mexicanos tienen derecho a poseer armas en su domicilio, para su seguridad y legítima defensa, con excepción de las prohibidas por la Ley Federal y de las reservadas para el uso exclusivo de la Fuerza Armada permanente y los cuerpos de reserva. La ley federal determinará los casos, condiciones, requisitos y lugares en que se podrá autorizar a los habitantes la portación de armas.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/10.json"},"11":{"numero":"11","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 15-08-2016)","publicacion":"2016-08-15","vigencia_desde":"2016-08-16","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 11. Toda persona tiene derecho para entrar en la República, salir de ella, viajar por su territorio y mudar de residencia, sin necesidad de carta de seguridad, pasaporte, salvoconducto u otros requisitos semejantes. El ejercicio de este derecho estará subordinado a las facultades de la autoridad judicial, en los casos de responsabilidad criminal o civil, y a las de la autoridad administrativa, por lo que toca a las limitaciones que impongan las leyes sobre emigración, inmigración y salubridad general de la República, o sobre extranjeros perniciosos residentes en el país.\n\nToda persona tiene derecho a buscar y recibir asilo. El reconocimiento de la condición de refugiado y el otorgamiento de asilo político, se realizarán de conformidad con los tratados internacionales. La ley regulará sus procedencias y excepciones.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/11.json"},"12":{"numero":"12","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 12. En los Estados Unidos Mexicanos no se concederán títulos de nobleza, ni prerrogativas y honores hereditarios, ni se dará efecto alguno a los otorgados por cualquier otro país.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/12.json"},"13":{"numero":"13","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 30-09-2024)","publicacion":"2024-09-30","vigencia_desde":"2024-10-01","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 13. Nadie puede ser juzgado por leyes privativas ni por tribunales especiales. Ninguna persona o corporación puede tener fuero, ni gozar más emolumentos que los que sean compensación de servicios públicos y estén fijados por la ley. Subsiste el fuero de guerra para los delitos y faltas contra la disciplina militar; pero los tribunales militares en ningún caso y por ningún motivo podrán extender su jurisdicción sobre personas que no pertenezcan al Ejército, Fuerza Aérea, Armada y Guardia Nacional. Cuando en un delito o falta del orden militar estuviese complicado un paisano, conocerá del caso la autoridad civil que corresponda.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/13.json"},"14":{"numero":"14","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 09-12-2005)","publicacion":"2005-12-09","vigencia_desde":"2005-12-10","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Garantías Individuales","texto":"Artículo 14. A ninguna ley se dará efecto retroactivo en perjuicio de persona alguna.\n\nNadie podrá ser privado de la libertad o de sus propiedades, posesiones o derechos, sino mediante juicio seguido ante los tribunales previamente establecidos, en el que se cumplan las formalidades esenciales del procedimiento y conforme a las Leyes expedidas con anterioridad al hecho.\n\nEn los juicios del orden criminal queda prohibido imponer, por simple analogía, y aún por mayoría de razón, pena alguna que no esté decretada por una ley exactamente aplicable al delito de que se trata.\n\nEn los juicios del orden civil, la sentencia definitiva deberá ser conforme a la letra o a la interpretación jurídica de la ley, y a falta de ésta se fundará en los principios generales del derecho.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/14.json"},"15":{"numero":"15","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 10-06-2011)","publicacion":"2011-06-10","vigencia_desde":"2011-06-11","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 15. No se autoriza la celebración de tratados para la extradición de reos políticos, ni para la de aquellos delincuentes del orden común que hayan tenido en el país donde cometieron el delito, la condición de esclavos; ni de convenios o tratados en virtud de los que se alteren los derechos humanos reconocidos por esta Constitución y en los tratados internacionales de los que el Estado Mexicano sea parte.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/15.json"},"16":{"numero":"16","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v10","tipo":"vigente","etiqueta":"Vigente (post 30-09-2024)","publicacion":"2024-09-30","vigencia_desde":"2024-10-01","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 16. Nadie puede ser molestado en su persona, familia, domicilio, papeles o posesiones, sino en virtud de mandamiento escrito de la autoridad competente, que funde y motive la causa legal del procedimiento. En los juicios y procedimientos seguidos en forma de juicio en los que se establezca como regla la oralidad, bastará con que quede constancia de ellos en cualquier medio que dé certeza de su contenido y del cumplimiento de lo previsto en este párrafo.\n\nToda persona tiene derecho a la protección de sus datos personales, al acceso, rectificación y cancelación de los mismos, así como a manifestar su oposición, en los términos que fije la ley, la cual establecerá los supuestos de excepción a los principios que rijan el tratamiento de datos, por razones de seguridad nacional, disposiciones de orden público, seguridad y salud públicas o para proteger los derechos de terceros.\n\nNo podrá librarse orden de aprehensión sino por la autoridad judicial y sin que preceda denuncia o querella de un hecho que la ley señale como delito, sancionado con pena privativa de libertad y obren datos que establezcan que se ha cometido ese hecho y que exista la probabilidad de que el indiciado lo cometió o participó en su comisión.\n\nLa autoridad que ejecute una orden judicial de aprehensión, deberá poner al inculpado a disposición del juez, sin dilación alguna y bajo su más estricta responsabilidad. La contravención a lo anterior será sancionada por la ley penal.\n\nCualquier persona puede detener al indiciado en el momento en que esté cometiendo un delito o inmediatamente después de haberlo cometido, poniéndolo sin demora a disposición de la autoridad civil más cercana y ésta con la misma prontitud, a la del Ministerio Público. Existirá un registro inmediato de la detención.\n\nSólo en casos urgentes, cuando se trate de delito grave así calificado por la ley y ante el riesgo fundado de que el indiciado pueda sustraerse a la acción de la justicia, siempre y cuando no se pueda ocurrir ante la autoridad judicial por razón de la hora, lugar o circunstancia, el Ministerio Público podrá, bajo su responsabilidad, ordenar su detención, fundando y expresando los indicios que motiven su proceder.\n\nEn casos de urgencia o flagrancia, el juez que reciba la consignación del detenido deberá inmediatamente ratificar la detención o decretar la libertad con las reservas de ley.\n\nLa autoridad judicial, a petición del Ministerio Público y tratándose de delitos de delincuencia organizada, podrá decretar el arraigo de una persona, con las modalidades de lugar y tiempo que la ley señale, sin que pueda exceder de cuarenta días, siempre que sea necesario para el éxito de la investigación, la protección de personas o bienes jurídicos, o cuando exista riesgo fundado de que el inculpado se sustraiga a la acción de la justicia. Este plazo podrá prorrogarse, siempre y cuando el Ministerio Público acredite que subsisten las causas que le dieron origen. En todo caso, la duración total del arraigo no podrá exceder los ochenta días.\n\nPor delincuencia organizada se entiende una organización de hecho de tres o más personas, para cometer delitos en forma permanente o reiterada, en los términos de la ley de la materia.\n\nNingún indiciado podrá ser retenido por el Ministerio Público por más de cuarenta y ocho horas, plazo en que deberá ordenarse su libertad o ponérsele a disposición de la autoridad judicial; este plazo podrá duplicarse en aquellos casos que la ley prevea como delincuencia organizada. Todo abuso a lo anteriormente dispuesto será sancionado por la ley penal.\n\nEn toda orden de cateo, que sólo la autoridad judicial podrá expedir, a solicitud del Ministerio Público, se expresará el lugar que ha de inspeccionarse, la persona o personas que hayan de aprehenderse y los objetos que se buscan, a lo que únicamente debe limitarse la diligencia, levantándose al concluirla, un acta circunstanciada, en presencia de dos testigos propuestos por el ocupante del lugar cateado o en su ausencia o negativa, por la autoridad que practique la diligencia.\n\nLas comunicaciones privadas son inviolables. La ley sancionará penalmente cualquier acto que atente contra la libertad y privacía de las mismas, excepto cuando sean aportadas de forma voluntaria por alguno de los particulares que participen en ellas. El juez valorará el alcance de éstas, siempre y cuando contengan información relacionada con la comisión de un delito. En ningún caso se admitirán comunicaciones que violen el deber de confidencialidad que establezca la ley.\n\nExclusivamente la autoridad judicial federal, a petición de la autoridad federal que faculte la ley o del titular del Ministerio Público de la entidad federativa correspondiente, podrá autorizar la intervención de cualquier comunicación privada. Para ello, la autoridad competente deberá fundar y motivar las causas legales de la solicitud, expresando además, el tipo de intervención, los sujetos de la misma y su duración. La autoridad judicial federal no podrá otorgar estas autorizaciones cuando se trate de materias de carácter electoral, fiscal, mercantil, civil, laboral o administrativo, ni en el caso de las comunicaciones del detenido con su defensor.\n\nLos Poderes Judiciales contarán con jueces de control que resolverán, en forma inmediata, y por cualquier medio, las solicitudes de medidas cautelares, providencias precautorias y técnicas de investigación de la autoridad, que requieran control judicial, garantizando los derechos de los indiciados y de las víctimas u ofendidos. Deberá existir un registro fehaciente de todas las comunicaciones entre jueces y Ministerio Público y demás autoridades competentes.\n\nLas intervenciones autorizadas se ajustarán a los requisitos y límites previstos en las leyes. Los resultados de las intervenciones que no cumplan con éstos, carecerán de todo valor probatorio.\n\nLa autoridad administrativa podrá practicar visitas domiciliarias únicamente para cerciorarse de que se han cumplido los reglamentos sanitarios y de policía; y exigir la exhibición de los libros y papeles indispensables para comprobar que se han acatado las disposiciones fiscales, sujetándose en estos casos, a las leyes respectivas y a las formalidades prescritas para los cateos.\n\nLa correspondencia que bajo cubierta circule por las estafetas estará libre de todo registro, y su violación será penada por la ley.\n\nEn tiempo de paz ningún miembro de la Fuerza Armada permanente -el Ejército, la Fuerza Aérea, la Armada y la Guardia Nacional- podrá alojarse en casa particular contra la voluntad del dueño, ni imponer prestación alguna. En tiempo de guerra los militares podrán exigir alojamiento, bagajes, alimentos y otras prestaciones, en los términos que establezca la ley marcial correspondiente.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":10,"historial_url":"historial/16.json"},"17":{"numero":"17","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 15-09-2024)","publicacion":"2024-09-15","vigencia_desde":"2024-09-16","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 17. Ninguna persona podrá hacerse justicia por sí misma, ni ejercer violencia para reclamar su derecho.\n\nToda persona tiene derecho a que se le administre justicia por tribunales que estarán expeditos para impartirla en los plazos y términos que fijen las leyes, emitiendo sus resoluciones de manera pronta, completa e imparcial. Su servicio será gratuito, quedando, en consecuencia, prohibidas las costas judiciales. Las leyes preverán las cuantías y supuestos en materia tributaria en las cuales tanto los Tribunales Administrativos como las Juezas y Jueces de Distrito y Tribunales de Circuito del Poder Judicial de la Federación o, en su caso, la Suprema Corte de Justicia de la Nación, deberán resolver en un máximo de seis meses, contados a partir del conocimiento del asunto por parte de la autoridad competente. En caso de cumplirse con el plazo señalado y que no se haya dictado sentencia, el órgano jurisdiccional que conozca del asunto deberá dar aviso inmediato al Tribunal de Disciplina Judicial y justificar las razones de dicha demora o, en su caso, dar vista al órgano interno de control tratándose de Tribunales Administrativos.\n\nSiempre que no se afecte la igualdad entre las partes, el debido proceso u otros derechos en los juicios o procedimientos seguidos en forma de juicio, las autoridades deberán privilegiar la solución del conflicto sobre los formalismos procedimentales.\n\nEl Congreso de la Unión expedirá las leyes que regulen las acciones colectivas. Tales leyes determinarán las materias de aplicación, los procedimientos judiciales y los mecanismos de reparación del daño. Los jueces federales conocerán de forma exclusiva sobre estos procedimientos y mecanismos.\n\nLas leyes preverán mecanismos alternativos de solución de controversias. En la materia penal regularán su aplicación, asegurarán la reparación del daño y establecerán los casos en los que se requerirá supervisión judicial.\n\nLas sentencias que pongan fin a los procedimientos orales deberán ser explicadas en audiencia pública previa citación de las partes.\n\nLas leyes federales y locales establecerán los medios necesarios para que se garantice la independencia de los tribunales y la plena ejecución de sus resoluciones.\n\nLa Federación y las entidades federativas garantizarán la existencia de un servicio de defensoría pública de calidad para la población y asegurarán las condiciones para un servicio profesional de carrera para los defensores. Las percepciones de los defensores no podrán ser inferiores a las que correspondan a los agentes del Ministerio Público.\n\nNadie puede ser aprisionado por deudas de carácter puramente civil.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/17.json"},"18":{"numero":"18","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v9","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 18. Sólo por delito que merezca pena privativa de libertad habrá lugar a prisión preventiva. El sitio de ésta será distinto del que se destinare para la extinción de las penas y estarán completamente separados.\n\nEl sistema penitenciario se organizará sobre la base del respeto a los derechos humanos, del trabajo, la capacitación para el mismo, la educación, la salud y el deporte como medios para lograr la reinserción del sentenciado a la sociedad y procurar que no vuelva a delinquir, observando los beneficios que para él prevé la ley. Las mujeres compurgarán sus penas en lugares separados de los destinados a los hombres para tal efecto.\n\nLa Federación y las entidades federativas podrán celebrar convenios para que los sentenciados por delitos del ámbito de su competencia extingan las penas en establecimientos penitenciarios dependientes de una jurisdicción diversa.\n\nLa Federación y las entidades federativas establecerán, en el ámbito de sus respectivas competencias, un sistema integral de justicia para los adolescentes, que será aplicable a quienes se atribuya la comisión o participación en un hecho que la ley señale como delito y tengan entre doce años cumplidos y menos de dieciocho años de edad. Este sistema garantizará los derechos humanos que reconoce la Constitución para toda persona, así como aquellos derechos específicos que por su condición de personas en desarrollo les han sido reconocidos a los adolescentes. Las personas menores de doce años a quienes se atribuya que han cometido o participado en un hecho que la ley señale como delito, sólo podrán ser sujetos de asistencia social.\n\nLa operación del sistema en cada orden de gobierno estará a cargo de instituciones, tribunales y autoridades especializados en la procuración e impartición de justicia para adolescentes. Se podrán aplicar las medidas de orientación, protección y tratamiento que amerite cada caso, atendiendo a la protección integral y el interés superior del adolescente.\n\nLas formas alternativas de justicia deberán observarse en la aplicación de este sistema, siempre que resulte procedente. El proceso en materia de justicia para adolescentes será acusatorio y oral, en el que se observará la garantía del debido proceso legal, así como la independencia de las autoridades que efectúen la remisión y las que impongan las medidas. Éstas deberán ser proporcionales al hecho realizado y tendrán como fin la reinserción y la reintegración social y familiar del adolescente, así como el pleno desarrollo de su persona y capacidades. El internamiento se utilizará sólo como medida extrema y por el tiempo más breve que proceda, y podrá aplicarse únicamente a los adolescentes mayores de catorce años de edad, por la comisión o participación en un hecho que la ley señale como delito.\n\nLos sentenciados de nacionalidad mexicana que se encuentren compurgando penas en países extranjeros, podrán ser trasladados a la República para que cumplan sus condenas con base en los sistemas de reinserción social previstos en este artículo, y los sentenciados de nacionalidad extranjera por delitos del orden federal o del fuero común, podrán ser trasladados al país de su origen o residencia, sujetándose a los Tratados Internacionales que se hayan celebrado para ese efecto. El traslado de los reclusos sólo podrá efectuarse con su consentimiento expreso.\n\nLos sentenciados, en los casos y condiciones que establezca la ley, podrán compurgar sus penas en los centros penitenciarios más cercanos a su domicilio, a fin de propiciar su reintegración a la comunidad como forma de reinserción social. Esta disposición no aplicará en caso de delincuencia organizada y respecto de otros internos que requieran medidas especiales de seguridad.\n\nPara la reclusión preventiva y la ejecución de sentencias en materia de delincuencia organizada se destinarán centros especiales. Las autoridades competentes podrán restringir las comunicaciones de los inculpados y sentenciados por delincuencia organizada con terceros, salvo el acceso a su defensor, e imponer medidas de vigilancia especial a quienes se encuentren internos en estos establecimientos. Lo anterior podrá aplicarse a otros internos que requieran medidas especiales de seguridad, en términos de la ley.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":9,"historial_url":"historial/18.json"},"19":{"numero":"19","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v8","tipo":"vigente","etiqueta":"Vigente (post 01-04-2025)","publicacion":"2025-04-01","vigencia_desde":"2025-04-02","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 19. Ninguna detención ante autoridad judicial podrá exceder del plazo de setenta y dos horas, a partir de que el indiciado sea puesto a su disposición, sin que se justifique con un auto de vinculación a proceso en el que se expresará: el delito que se impute al acusado; el lugar, tiempo y circunstancias de ejecución, así como los datos que establezcan que se ha cometido un hecho que la ley señale como delito y que exista la probabilidad de que el indiciado lo cometió o participó en su comisión.\n\nEl Ministerio Público sólo podrá solicitar al juez la prisión preventiva cuando otras medidas cautelares no sean suficientes para garantizar la comparecencia del imputado en el juicio, el desarrollo de la investigación, la protección de la víctima, de los testigos y de la comunidad, así como cuando el imputado esté siendo procesado o haya sido sentenciado previamente por la comisión de un delito doloso. El juez ordenará la prisión preventiva oficiosamente, en los casos de abuso o violencia sexual contra menores, delincuencia organizada, extorsión, delitos previstos en las leyes aplicables cometidos para la ilegal introducción y desvío, producción, preparación, enajenación, adquisición, importación, exportación, transportación, almacenamiento y distribución de precursores químicos y sustancias químicas esenciales, drogas sintéticas, fentanilo y derivados, homicidio doloso, feminicidio, violación, secuestro, trata de personas, robo de casa habitación, uso de programas sociales con fines electorales, corrupción tratándose de los delitos de enriquecimiento ilícito y ejercicio abusivo de funciones, robo al transporte de carga en cualquiera de sus modalidades, delitos en materia de hidrocarburos, petrolíferos o petroquímicos, delitos en materia de desaparición forzada de personas y desaparición cometida por particulares, delitos cometidos con medios violentos como armas y explosivos, delitos en materia de armas de fuego y explosivos de uso exclusivo del Ejército, la Armada y la Fuerza Aérea, delito de terrorismo y de los delitos graves que determine la ley en contra de la seguridad de la nación, de la salud, del libre desarrollo de la personalidad, contrabando y cualquier actividad relacionada con falsos comprobantes fiscales, en los términos fijados por la ley. A cualquier nacional o extranjero involucrado en la fabricación, distribución, enajenación, traslado o internación al territorio nacional de manera ilícita de armas, y a cualquier extranjero que realice actividades al margen de la ley vinculadas con los párrafos segundo y tercero del artículo 40 de esta Constitución, se le impondrá la pena más severa posible, así como la medida cautelar de prisión preventiva oficiosa. Para la interpretación y aplicación de las normas previstas en este párrafo, los órganos del Estado deberán atenerse a su literalidad, quedando prohibida cualquier interpretación análoga o extensiva que pretenda inaplicar, suspender, modificar o hacer nugatorios sus términos o su vigencia, ya sea de manera total o parcial.\n\nLa ley determinará los casos en los cuales el juez podrá revocar la libertad de los individuos vinculados a proceso.\n\nEl plazo para dictar el auto de vinculación a proceso podrá prorrogarse únicamente a petición del indiciado, en la forma que señale la ley. La prolongación de la detención en su perjuicio será sancionada por la ley penal. La autoridad responsable del establecimiento en el que se encuentre internado el indiciado, que dentro del plazo antes señalado no reciba copia autorizada del auto de vinculación a proceso y del que decrete la prisión preventiva, o de la solicitud de prórroga del plazo constitucional, deberá llamar la atención del juez sobre dicho particular en el acto mismo de concluir el plazo y, si no recibe la constancia mencionada dentro de las tres horas siguientes, pondrá al indiciado en libertad.\n\nTodo proceso se seguirá forzosamente por el hecho o hechos delictivos señalados en el auto de vinculación a proceso. Si en la secuela de un proceso apareciere que se ha cometido un delito distinto del que se persigue, deberá ser objeto de investigación separada, sin perjuicio de que después pueda decretarse la acumulación, si fuere conducente.\n\nSi con posterioridad a la emisión del auto de vinculación a proceso por delincuencia organizada el inculpado evade la acción de la justicia o es puesto a disposición de otro juez que lo reclame en el extranjero, se suspenderá el proceso junto con los plazos para la prescripción de la acción penal.\n\nTodo mal tratamiento en la aprehensión o en las prisiones, toda molestia que se infiera sin motivo legal, toda gabela o contribución, en las cárceles, son abusos que serán corregidos por las leyes y reprimidos por las autoridades.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":8,"historial_url":"historial/19.json"},"20":{"numero":"20","estado":"historial_parcial","nota":"Historial extraído del PDF de la SCJN, pero su última versión NO coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026): puede haber una reforma posterior al PDF o una diferencia de extracción. Se muestra como vigente el texto del consolidado; el historial queda pendiente de cotejo.","versiones":[{"id":"v10","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2024-09-15","vigencia_desde":"2024-09-16","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Texto del consolidado de la Cámara; no procede del PDF de la SCJN. Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 20. El proceso penal será acusatorio y oral. Se regirá por los principios de publicidad, contradicción, concentración, continuidad e inmediación.\n\nA. De los principios generales:\n\nI. El proceso penal tendrá por objeto el esclarecimiento de los hechos, proteger al inocente, procurar que el culpable no quede impune y que los daños causados por el delito se reparen;\n\nII. Toda audiencia se desarrollará en presencia del juez, sin que pueda delegar en ninguna persona el desahogo y la valoración de las pruebas, la cual deberá realizarse de manera libre y lógica;\n\nIII. Para los efectos de la sentencia sólo se considerarán como prueba aquellas que hayan sido desahogadas en la audiencia de juicio. La ley establecerá las excepciones y los requisitos para admitir en juicio la prueba anticipada, que por su naturaleza requiera desahogo previo;\n\nIV. El juicio se celebrará ante un juez que no haya conocido del caso previamente. La presentación de los argumentos y los elementos probatorios se desarrollará de manera pública, contradictoria y oral;\n\nV. La carga de la prueba para demostrar la culpabilidad corresponde a la parte acusadora, conforme lo establezca el tipo penal. Las partes tendrán igualdad procesal para sostener la acusación o la defensa, respectivamente;\n\nVI. Ningún juzgador podrá tratar asuntos que estén sujetos a proceso con cualquiera de las partes sin que esté presente la otra, respetando en todo momento el principio de contradicción, salvo las excepciones que establece esta Constitución;\n\nVII. Una vez iniciado el proceso penal, siempre y cuando no exista oposición del inculpado, se podrá decretar su terminación anticipada en los supuestos y bajo las modalidades que determine la ley. Si el imputado reconoce ante la autoridad judicial, voluntariamente y con conocimiento de las consecuencias, su participación en el delito y existen medios de convicción suficientes para corroborar la imputación, el juez citará a audiencia de sentencia. La ley establecerá los beneficios que se podrán otorgar al inculpado cuando acepte su responsabilidad;\n\nVIII. El juez sólo condenará cuando exista convicción de la culpabilidad del procesado;\n\nIX. Cualquier prueba obtenida con violación de derechos fundamentales será nula;\n\nX. Tratándose de delincuencia organizada, el órgano de administración judicial podrá disponer las medidas necesarias para preservar la seguridad y resguardar la identidad de las personas juzgadoras, conforme al procedimiento que establezca la ley, y\n\nXI. Los principios previstos en este artículo, se observarán también en las audiencias preliminares al juicio.\n\nB. De los derechos de toda persona imputada:\n\nI. A que se presuma su inocencia mientras no se declare su responsabilidad mediante sentencia emitida por el juez de la causa;\n\nII. A declarar o a guardar silencio. Desde el momento de su detención se le harán saber los motivos de la misma y su derecho a guardar silencio, el cual no podrá ser utilizado en su perjuicio. Queda prohibida y será sancionada por la ley penal, toda incomunicación, intimidación o tortura. La confesión rendida sin la asistencia del defensor carecerá de todo valor probatorio;\n\nIII. A que se le informe, tanto en el momento de su detención como en su comparecencia ante el Ministerio Público o el juez, los hechos que se le imputan y los derechos que le asisten. Tratándose de delincuencia organizada, la autoridad judicial podrá autorizar que se mantenga en reserva el nombre y datos del acusador.\n\nLa ley establecerá beneficios a favor del inculpado, procesado o sentenciado que preste ayuda eficaz para la investigación y persecución de delitos en materia de delincuencia organizada;\n\nIV. Se le recibirán los testigos y demás pruebas pertinentes que ofrezca, concediéndosele el tiempo que la ley estime necesario al efecto y auxiliándosele para obtener la comparecencia de las personas cuyo testimonio solicite, en los términos que señale la ley;\n\nV. Será juzgado en audiencia pública por un juez o tribunal. La publicidad sólo podrá restringirse en los casos de excepción que determine la ley, por razones de seguridad nacional, seguridad pública, protección de las víctimas, testigos y menores, cuando se ponga en riesgo la revelación de datos legalmente protegidos, o cuando el tribunal estime que existen razones fundadas para justificarlo.\n\nEn delincuencia organizada, las actuaciones realizadas en la fase de investigación podrán tener valor probatorio, cuando no puedan ser reproducidas en juicio o exista riesgo para testigos o víctimas. Lo anterior sin perjuicio del derecho del inculpado de objetarlas o impugnarlas y aportar pruebas en contra;\n\nVI. Le serán facilitados todos los datos que solicite para su defensa y que consten en el proceso.\n\nEl imputado y su defensor tendrán acceso a los registros de la investigación cuando el primero se encuentre detenido y cuando pretenda recibírsele declaración o entrevistarlo. Asimismo, antes de su primera comparecencia ante juez podrán consultar dichos registros, con la oportunidad debida para preparar la defensa. A partir de este momento no podrán mantenerse en reserva las actuaciones de la investigación, salvo los casos excepcionales expresamente señalados en la ley cuando ello sea imprescindible para salvaguardar el éxito de la investigación y siempre que sean oportunamente revelados para no afectar el derecho de defensa;\n\nVII. Será juzgado antes de cuatro meses si se tratare de delitos cuya pena máxima no exceda de dos años de prisión, y antes de un año si la pena excediere de ese tiempo, salvo que solicite mayor plazo para su defensa;\n\nEn caso de cumplirse con el plazo señalado en el párrafo que antecede y que no se haya dictado sentencia, el órgano jurisdiccional que conozca del asunto deberá dar aviso inmediato al Tribunal de Disciplina Judicial y justificar las razones de dicha demora, en los términos que establezca la ley;\n\nVIII. Tendrá derecho a una defensa adecuada por abogado, al cual elegirá libremente incluso desde el momento de su detención. Si no quiere o no puede nombrar un abogado, después de haber sido requerido para hacerlo, el juez le designará un defensor público. También tendrá derecho a que su defensor comparezca en todos los actos del proceso y éste tendrá obligación de hacerlo cuantas veces se le requiera, y\n\nIX. En ningún caso podrá prolongarse la prisión o detención, por falta de pago de honorarios de defensores o por cualquiera otra prestación de dinero, por causa de responsabilidad civil o algún otro motivo análogo.\n\nLa prisión preventiva no podrá exceder del tiempo que como máximo de pena fije la ley al delito que motivare el proceso y en ningún caso será superior a dos años, salvo que su prolongación se deba al ejercicio del derecho de defensa del imputado. Si cumplido este término no se ha pronunciado sentencia, el imputado será puesto en libertad de inmediato mientras se sigue el proceso, sin que ello obste para imponer otras medidas cautelares.\n\nEn toda pena de prisión que imponga una sentencia, se computará el tiempo de la detención.\n\nC. De los derechos de la víctima o del ofendido:\n\nI. Recibir asesoría jurídica; ser informado de los derechos que en su favor establece la Constitución y, cuando lo solicite, ser informado del desarrollo del procedimiento penal;\n\nII. Coadyuvar con el Ministerio Público; a que se le reciban todos los datos o elementos de prueba con los que cuente, tanto en la investigación como en el proceso, a que se desahoguen las diligencias correspondientes, y a intervenir en el juicio e interponer los recursos en los términos que prevea la ley.\n\nCuando el Ministerio Público considere que no es necesario el desahogo de la diligencia, deberá fundar y motivar su negativa;\n\nIII. Recibir, desde la comisión del delito, atención médica y psicológica de urgencia;\n\nIV. Que se le repare el daño. En los casos en que sea procedente, el Ministerio Público estará obligado a solicitar la reparación del daño, sin menoscabo de que la víctima u ofendido lo pueda solicitar directamente, y el juzgador no podrá absolver al sentenciado de dicha reparación si ha emitido una sentencia condenatoria.\n\nLa ley fijará procedimientos ágiles para ejecutar las sentencias en materia de reparación del daño;\n\nV. Al resguardo de su identidad y otros datos personales en los siguientes casos: cuando sean menores de edad; cuando se trate de delitos de violación, trata de personas, secuestro o delincuencia organizada; y cuando a juicio del juzgador sea necesario para su protección, salvaguardando en todo caso los derechos de la defensa.\n\nEl Ministerio Público deberá garantizar la protección de víctimas, ofendidos, testigos y en general todas los sujetos que intervengan en el proceso. Los jueces deberán vigilar el buen cumplimiento de esta obligación;\n\nVI. Solicitar las medidas cautelares y providencias necesarias para la protección y restitución de sus derechos, y\n\nVII. Impugnar ante autoridad judicial las omisiones del Ministerio Público en la investigación de los delitos, así como las resoluciones de reserva, no ejercicio, desistimiento de la acción penal o suspensión del procedimiento cuando no esté satisfecha la reparación del daño.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":10,"historial_url":"historial/20.json"},"21":{"numero":"21","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v11","tipo":"vigente","etiqueta":"Vigente (post 31-12-2024)","publicacion":"2024-12-31","vigencia_desde":"2025-01-01","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 21. La investigación de los delitos corresponde al Ministerio Público, a la secretaría del ramo de seguridad pública del Ejecutivo Federal, a la Guardia Nacional y a las policías, en el ámbito de su competencia, las cuales actuarán bajo la conducción y mando de aquél en el ejercicio de esta función.\n\nEl ejercicio de la acción penal ante los tribunales corresponde al Ministerio Público. La ley determinará los casos en que los particulares podrán ejercer la acción penal ante la autoridad judicial.\n\nLa imposición de las penas, su modificación y duración son propias y exclusivas de la autoridad judicial.\n\nCompete a la autoridad administrativa la aplicación de sanciones por las infracciones de los reglamentos gubernativos y de policía, las que únicamente consistirán en multa, arresto hasta por treinta y seis horas o en trabajo a favor de la comunidad; pero si el infractor no pagare la multa que se le hubiese impuesto, se permutará esta por el arresto correspondiente, que no excederá en ningún caso de treinta y seis horas.\n\nSi el infractor de los reglamentos gubernativos y de policía fuese jornalero, obrero o trabajador, no podrá ser sancionado con multa mayor del importe de su jornal o salario de un día.\n\nTratándose de trabajadores no asalariados, la multa que se imponga por infracción de los reglamentos gubernativos y de policía, no excederá del equivalente a un día de su ingreso.\n\nEl Ministerio Público podrá considerar criterios de oportunidad para el ejercicio de la acción penal, en los supuestos y condiciones que fije la ley.\n\nEl Ejecutivo Federal podrá, con la aprobación del Senado en cada caso, reconocer la jurisdicción de la Corte Penal Internacional.\n\nLa seguridad pública es una función del Estado a cargo de la Federación, las entidades federativas y los Municipios, cuyos fines son salvaguardar la vida, las libertades, la integridad y el patrimonio de las personas, de conformidad con lo dispuesto en el artículo 4o. de esta Constitución que garantiza los deberes reforzados de protección del Estado con las mujeres, adolescentes, niñas y niños; así como contribuir a la generación y preservación del orden público y la paz social, de conformidad con lo previsto en esta Constitución y las leyes en la materia. La seguridad pública comprende la prevención, investigación y persecución de los delitos, así como la sanción de las infracciones administrativas, en los términos de la ley, en las respectivas competencias que esta Constitución señala. La actuación de las instituciones de seguridad pública se regirá por los principios de legalidad, objetividad, eficiencia, profesionalismo y honradez, así como por la perspectiva de género y el respeto a los derechos humanos reconocidos en esta Constitución.\n\nLas instituciones de seguridad pública serán disciplinadas, profesionales y de carácter civil.\n\nEl Ministerio Público y las instituciones policiales de los tres órdenes de gobierno, incluida la Guardia Nacional, deben coordinarse entre sí para cumplir los fines de la seguridad pública y conformarán el Sistema Nacional de Seguridad Pública, que estará sujeto a las siguientes bases mínimas:\n\na) La regulación de la selección, ingreso, formación, permanencia, evaluación, reconocimiento y certificación de los integrantes de las instituciones de seguridad pública. La operación y desarrollo de estas acciones será competencia de la Federación, las entidades federativas y los Municipios en el ámbito de sus respectivas atribuciones.\n\nb) El establecimiento de un sistema nacional de información en seguridad pública a cargo de la Federación al que ésta, las entidades federativas y los Municipios, a través de las dependencias responsables de la seguridad pública, proporcionarán la información de que dispongan en la materia, conforme a la ley. El sistema contendrá también las bases de datos criminalísticos y de personal para las instituciones de seguridad pública. Ninguna persona podrá ingresar a las instituciones de seguridad pública si no ha sido debidamente certificada y registrada en el sistema.\n\nc) La formulación de políticas públicas tendientes a prevenir la comisión de delitos.\n\nd) Se determinará la participación de la comunidad que coadyuvará, entre otros, en los procesos de evaluación de las políticas de prevención del delito así como de las instituciones de seguridad pública.\n\ne) Los fondos de ayuda federal para la seguridad pública, a nivel nacional serán aportados a las entidades federativas y municipios para ser destinados exclusivamente a estos fines. Estos fondos serán auditados y su debido ejercicio vigilado por el Sistema a través de su Secretariado Ejecutivo.\n\nf) El Sistema contará con un Secretariado Ejecutivo, el cual podrá ampliar las bases, emitir acuerdos y lineamientos, así como realizar las acciones necesarias para lograr la homologación de estándares y criterios, así como una coordinación eficiente, transparente y responsable, en el ejercicio de las atribuciones concurrentes de los tres órdenes de gobierno; en todo momento en atención a los fines del Sistema y los objetivos de la Estrategia Nacional de Seguridad Pública.\n\nLa Federación contará con la Guardia Nacional, fuerza de seguridad pública, profesional, de carácter permanente e integrada por personal militar con formación policial, dependiente de la secretaría del ramo de defensa nacional, para ejecutar la Estrategia Nacional de Seguridad Pública en el ámbito de su competencia. Los fines de la Guardia Nacional son los señalados en el párrafo noveno de este artículo, la coordinación y colaboración con las entidades federativas y Municipios, así como la salvaguarda de los bienes y recursos de la Nación. La ley determinará la estructura orgánica y de dirección de la Guardia Nacional.\n\nLa secretaría del ramo de seguridad pública formulará, coordinará y dirigirá la Estrategia Nacional de Seguridad Pública, así como los programas, las políticas y acciones respectivos; auxiliará a la persona titular de la Presidencia de la República en el ejercicio de las funciones en materia de seguridad nacional; le corresponderá la coordinación del Sistema Nacional de Inteligencia en materia de seguridad pública, en los términos que señale la ley, y podrá coordinar las acciones de colaboración de los tres órdenes de gobierno, a través de las instituciones de seguridad pública, los cuales además deberán de proporcionar la información de que dispongan o que recaben en la materia conforme a la ley. Podrá solicitar información a las instituciones y dependencias del Estado para la identificación y esclarecimiento de los hechos presuntamente constitutivos de delitos.\n\nLa formación y el desempeño de los integrantes de la Guardia Nacional y de las demás instituciones policiales se regirán por una doctrina policial fundada en el servicio a la sociedad, la disciplina, el respeto a los derechos humanos, al imperio de la ley, al mando superior, y en lo conducente a la perspectiva de género.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":11,"historial_url":"historial/21.json"},"22":{"numero":"22","estado":"historial_parcial","nota":"Historial extraído del PDF de la SCJN, pero su última versión NO coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026): puede haber una reforma posterior al PDF o una diferencia de extracción. Se muestra como vigente el texto del consolidado; el historial queda pendiente de cotejo.","versiones":[{"id":"v7","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2019-03-14","vigencia_desde":"2019-03-15","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Texto del consolidado de la Cámara; no procede del PDF de la SCJN. Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 22. Quedan prohibidas las penas de muerte, de mutilación, de infamia, la marca, los azotes, los palos, el tormento de cualquier especie, la multa excesiva, la confiscación de bienes y cualesquiera otras penas inusitadas y trascendentales. Toda pena deberá ser proporcional al delito que sancione y al bien jurídico afectado.\n\nNo se considerará confiscación la aplicación de bienes de una persona cuando sea decretada para el pago de multas o impuestos, ni cuando la decrete la autoridad judicial para el pago de responsabilidad civil derivada de la comisión de un delito. Tampoco se considerará confiscación el decomiso que ordene la autoridad judicial de los bienes en caso de enriquecimiento ilícito en los términos del artículo 109, la aplicación a favor del Estado de bienes asegurados que causen abandono en los términos de las disposiciones aplicables, ni de aquellos bienes cuyo dominio se declare extinto en sentencia.\n\nLa acción de extinción de dominio se ejercitará por el Ministerio Público a través de un procedimiento jurisdiccional de naturaleza civil y autónomo del penal. Las autoridades competentes de los distintos órdenes de gobierno le prestarán auxilio en el cumplimiento de esta función. La ley establecerá los mecanismos para que las autoridades administren los bienes sujetos al proceso de extinción de dominio, incluidos sus productos, rendimientos, frutos y accesorios, para que la autoridad lleve a cabo su disposición, uso, usufructo, enajenación y monetización, atendiendo al interés público, y defina con criterios de oportunidad el destino y, en su caso, la destrucción de los mismos.\n\nSerá procedente sobre bienes de carácter patrimonial cuya legítima procedencia no pueda acreditarse y se encuentren relacionados con las investigaciones derivadas de hechos de corrupción, encubrimiento, delitos cometidos por servidores públicos, delincuencia organizada, robo de vehículos, recursos de procedencia ilícita, delitos contra la salud, secuestro, extorsión, trata de personas y delitos en materia de hidrocarburos, petrolíferos y petroquímicos.\n\nA toda persona que se considere afectada, se le deberá garantizar el acceso a los medios de defensa adecuados para demostrar la procedencia legítima del bien sujeto al procedimiento.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/22.json"},"23":{"numero":"23","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 23. Ningún juicio criminal deberá tener más de tres instancias. Nadie puede ser juzgado dos veces por el mismo delito, ya sea que en el juicio se le absuelva o se le condene. Queda prohibida la práctica de absolver de la instancia.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/23.json"},"24":{"numero":"24","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 19-07-2013)","publicacion":"2013-07-19","vigencia_desde":"2013-07-20","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 24. Toda persona tiene derecho a la libertad de convicciones éticas, de conciencia y de religión, y a tener o adoptar, en su caso, la de su agrado. Esta libertad incluye el derecho de participar, individual o colectivamente, tanto en público como en privado, en las ceremonias, devociones o actos del culto respectivo, siempre que no constituyan un delito o falta penados por la ley. Nadie podrá utilizar los actos públicos de expresión de esta libertad con fines políticos, de proselitismo o de propaganda política.\n\nEl Congreso no puede dictar leyes que establezcan o prohiban religión alguna.\n\nLos actos religiosos de culto público se celebrarán ordinariamente en los templos. Los que extraordinariamente se celebren fuera de éstos se sujetarán a la ley reglamentaria.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/24.json"},"25":{"numero":"25","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v9","tipo":"vigente","etiqueta":"Vigente (post 15-04-2025)","publicacion":"2025-04-15","vigencia_desde":"2025-04-16","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 25. Corresponde al Estado la rectoría del desarrollo nacional para garantizar que éste sea integral y sustentable, que fortalezca la Soberanía de la Nación y su régimen democrático y que, mediante la competitividad, el fomento del crecimiento económico y el empleo y una más justa distribución del ingreso y la riqueza, permita el pleno ejercicio de la libertad y la dignidad de los individuos, grupos y clases sociales, cuya seguridad protege esta Constitución. La competitividad se entenderá como el conjunto de condiciones necesarias para generar un mayor crecimiento económico, promoviendo la inversión y la generación de empleo.\n\nEl Estado velará por la estabilidad de las finanzas públicas y del sistema financiero para coadyuvar a generar condiciones favorables para el crecimiento económico y el empleo. El Plan Nacional de Desarrollo y los planes estatales y municipales deberán observar dicho principio.\n\nEl Estado planeará, conducirá, coordinará y orientará la actividad económica nacional, y llevará al cabo la regulación y fomento de las actividades que demande el interés general en el marco de libertades que otorga esta Constitución.\n\nAl desarrollo económico nacional concurrirán, con responsabilidad social, el sector público, el sector social y el sector privado, sin menoscabo de otras formas de actividad económica que contribuyan al desarrollo de la Nación.\n\nEl sector público tendrá a su cargo, de manera exclusiva, las áreas estratégicas que se señalan en el artículo 28, párrafo cuarto de la Constitución, manteniendo siempre el Gobierno Federal la propiedad y el control sobre los organismos y empresas públicas del Estado que en su caso se establezcan. Tratándose de la planeación y el control del sistema eléctrico nacional, y del servicio público de transmisión y distribución de energía eléctrica, así como de la exploración y extracción de petróleo y demás hidrocarburos, la Nación llevará a cabo dichas actividades en términos de lo dispuesto por los párrafos sexto y séptimo del artículo 27 de esta Constitución. En las actividades citadas la ley establecerá las normas relativas a la administración, organización, funcionamiento, procedimientos de contratación y demás actos jurídicos que celebren las empresas públicas del Estado, así como el régimen de remuneraciones de su personal, para garantizar su eficacia, eficiencia, honestidad, productividad, transparencia y rendición de cuentas, y determinará las demás actividades que podrán realizar.\n\nAsimismo podrá participar por sí o con los sectores social y privado, de acuerdo con la ley, para impulsar y organizar las áreas prioritarias del desarrollo.\n\nBajo criterios de equidad social, productividad y sustentabilidad se apoyará e impulsará a las empresas de los sectores social y privado de la economía, sujetándolos a las modalidades que dicte el interés público y al uso, en beneficio general, de los recursos productivos, cuidando su conservación y el medio ambiente.\n\nLa ley establecerá los mecanismos que faciliten la organización y la expansión de la actividad económica del sector social: de los ejidos, organizaciones de trabajadores, cooperativas, comunidades, empresas que pertenezcan mayoritaria o exclusivamente a los trabajadores y, en general, de todas las formas de organización social para la producción, distribución y consumo de bienes y servicios socialmente necesarios.\n\nLa ley alentará y protegerá la actividad económica que realicen los particulares y proveerá las condiciones para que el desenvolvimiento del sector privado contribuya al desarrollo económico nacional, promoviendo la competitividad e implementando una política nacional para el desarrollo industrial sustentable que incluya vertientes sectoriales y regionales, en los términos que establece esta Constitución.\n\nA fin de contribuir al desarrollo y bienestar de las personas, grupos, comunidades y sectores sociales y económicos, las autoridades de todos los órdenes de gobierno deberán implementar políticas públicas de simplificación administrativa y digitalización de trámites y servicios, buenas prácticas regulatorias, desarrollo y fortalecimiento de capacidades tecnológicas públicas y los demás objetivos que establezca la ley nacional en la materia.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":9,"historial_url":"historial/25.json"},"26":{"numero":"26","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 20-12-2024)","publicacion":"2024-12-20","vigencia_desde":"2024-12-21","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 26.\n\nA. El Estado organizará un sistema de planeación democrática del desarrollo nacional que imprima solidez, dinamismo, competitividad, permanencia y equidad al crecimiento de la economía para la independencia y la democratización política, social y cultural de la nación.\n\nLos fines del proyecto nacional contenidos en esta Constitución determinarán los objetivos de la planeación. La planeación será democrática y deliberativa. Mediante los mecanismos de participación que establezca la ley, recogerá las aspiraciones y demandas de la sociedad para incorporarlas al plan y los programas de desarrollo. Habrá un plan nacional de desarrollo al que se sujetarán obligatoriamente los programas de la Administración Pública Federal.\n\nLa ley facultará al Ejecutivo para que establezca los procedimientos de participación y consulta popular en el sistema nacional de planeación democrática, y los criterios para la formulación, instrumentación, control y evaluación del plan y los programas de desarrollo. Asimismo, determinará los órganos responsables del proceso de planeación y las bases para que el Ejecutivo Federal coordine mediante convenios con los gobiernos de las entidades federativas e induzca y concierte con los particulares las acciones a realizar para su elaboración y ejecución. El plan nacional de desarrollo considerará la continuidad y adaptaciones necesarias de la política nacional para el desarrollo industrial, con vertientes sectoriales y regionales.\n\nEn el sistema de planeación democrática y deliberativa, el Congreso de la Unión tendrá la intervención que señale la ley.\n\nB. El Estado contará con un Sistema Nacional de Información Estadística y Geográfica cuyos datos serán considerados oficiales. Para la Federación, las entidades federativas, los Municipios y las demarcaciones territoriales de la Ciudad de México, los datos contenidos en el Sistema serán de uso obligatorio en los términos que establezca la ley.\n\nLa responsabilidad de normar y coordinar dicho Sistema estará a cargo de un organismo con autonomía técnica y de gestión, personalidad jurídica y patrimonio propios, con las facultades necesarias para regular la captación, procesamiento y publicación de la información que se genere y proveer a su observancia.\n\nEl organismo también estará a cargo de la medición de la pobreza y la evaluación de los programas, objetivos, metas y acciones de la política de desarrollo social, así como de emitir recomendaciones en los términos que disponga la ley, la cual establecerá las formas de coordinación con las autoridades federales, locales y municipales para el ejercicio de estas funciones.\n\nEl organismo tendrá una Junta de Gobierno integrada por cinco miembros, uno de los cuales fungirá como Presidente de ésta y del propio organismo; serán designados por el Presidente de la República con la aprobación de la Cámara de Senadores o en sus recesos por la Comisión Permanente del Congreso de la Unión.\n\nLa ley establecerá las bases de organización y funcionamiento del Sistema Nacional de Información Estadística y Geográfica, de acuerdo con los principios de accesibilidad a la información, transparencia, objetividad e independencia; los requisitos que deberán cumplir los miembros de la Junta de Gobierno, la duración y escalonamiento de su encargo.\n\nLos miembros de la Junta de Gobierno sólo podrán ser removidos por causa grave y no podrán tener ningún otro empleo, cargo o comisión, con excepción de los no remunerados en instituciones docentes, científicas, culturales o de beneficencia; y estarán sujetos a lo dispuesto por el Título Cuarto de esta Constitución.\n\nEl organismo calculará en los términos que señale la ley, el valor de la Unidad de Medida y Actualización que será utilizada como unidad de cuenta, índice, base, medida o referencia para determinar la cuantía del pago de las obligaciones y supuestos previstos en las leyes federales, de las entidades federativas y del Distrito Federal, así como en las disposiciones jurídicas que emanen de todas las anteriores.\n\nLas obligaciones y supuestos denominados en Unidades de Medida y Actualización se considerarán de monto determinado y se solventarán entregando su equivalente en moneda nacional. Al efecto, deberá multiplicarse el monto de la obligación o supuesto, expresado en las citadas unidades, por el valor de dicha unidad a la fecha correspondiente.\n\nC. Se deroga","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/26.json"},"27":{"numero":"27","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v24","tipo":"vigente","etiqueta":"Vigente (post 17-03-2025)","publicacion":"2025-03-17","vigencia_desde":"2025-03-18","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Artículo 27. La propiedad de las tierras y aguas comprendidas dentro de los límites del territorio nacional, corresponde originariamente a la Nación, la cual ha tenido y tiene el derecho de transmitir el dominio de ellas a los particulares, constituyendo la propiedad privada.\n\nLas expropiaciones sólo podrán hacerse por causa de utilidad pública y mediante indemnización.\n\nLa nación tendrá en todo tiempo el derecho de imponer a la propiedad privada las modalidades que dicte el interés público, así como el de regular, en beneficio social, el aprovechamiento de los elementos naturales susceptibles de apropiación, con objeto de hacer una distribución equitativa de la riqueza pública, cuidar de su conservación, lograr el desarrollo equilibrado del país y el mejoramiento de las condiciones de vida de la población rural y urbana. En consecuencia, se dictarán las medidas necesarias para ordenar los asentamientos humanos y establecer adecuadas provisiones, usos, reservas y destinos de tierras, aguas y bosques, a efecto de ejecutar obras públicas y de planear y regular la fundación, conservación, mejoramiento y crecimiento de los centros de población; para preservar y restaurar el equilibrio ecológico; para el fraccionamiento de los latifundios; para disponer, en los términos de la ley reglamentaria, la organización y explotación colectiva de los ejidos y comunidades; para el desarrollo de la pequeña propiedad rural; para el fomento de la agricultura, de la ganadería, de la silvicultura y de las demás actividades económicas en el medio rural, y para evitar la destrucción de los elementos naturales y los daños que la propiedad pueda sufrir en perjuicio de la sociedad.\n\nCorresponde a la Nación el dominio directo de todos los recursos naturales de la plataforma continental y los zócalos submarinos de las islas; de todos los minerales o substancias que en vetas, mantos, masas o yacimientos, constituyan depósitos cuya naturaleza sea distinta de los componentes de los terrenos, tales como los minerales de los que se extraigan metales y metaloides utilizados en la industria; los yacimientos de piedras preciosas, de sal de gema y las salinas formadas directamente por las aguas marinas; los productos derivados de la descomposición de las rocas, cuando su explotación necesite trabajos subterráneos; los yacimientos minerales u orgánicos de materias susceptibles de ser utilizadas como fertilizantes; los combustibles minerales sólidos; el petróleo y todos los carburos de hidrógeno sólidos, líquidos o gaseosos; y el espacio situado sobre el territorio nacional, en la extensión y términos que fije el Derecho Internacional.\n\nSon propiedad de la Nación las aguas de los mares territoriales en la extensión y términos que fije el Derecho Internacional; las aguas marinas interiores; las de las lagunas y esteros que se comuniquen permanente o intermitentemente con el mar; las de los lagos interiores de formación natural que estén ligados directamente a corrientes constantes; las de los ríos y sus afluentes directos o indirectos, desde el punto del cauce en que se inicien las primeras aguas permanentes, intermitentes o torrenciales, hasta su desembocadura en el mar, lagos, lagunas o esteros de propiedad nacional; las de las corrientes constantes o intermitentes y sus afluentes directos o indirectos, cuando el cauce de aquéllas en toda su extensión o en parte de ellas, sirva de límite al territorio nacional o a dos entidades federativas, o cuando pase de una entidad federativa a otra o cruce la línea divisoria de la República; la de los lagos, lagunas o esteros cuyos vasos, zonas o riberas, estén cruzadas por líneas divisorias de dos o más entidades o entre la República y un país vecino, o cuando el límite de las riberas sirva de lindero entre dos entidades federativas o a la República con un país vecino; las de los manantiales que broten en las playas, zonas marítimas, cauces, vasos o riberas de los lagos, lagunas o esteros de propiedad nacional, y las que se extraigan de las minas; y los cauces, lechos o riberas de los lagos y corrientes interiores en la extensión que fija la ley. Las aguas del subsuelo pueden ser libremente alumbradas mediante obras artificiales y apropiarse por el dueño del terreno, pero cuando lo exija el interés público o se afecten otros aprovechamientos, el Ejecutivo Federal podrá reglamentar su extracción y utilización y aún establecer zonas vedadas, al igual que para las demás aguas de propiedad nacional. Cualesquiera otras aguas no incluidas en la enumeración anterior, se considerarán como parte integrante de la propiedad de los terrenos por los que corran o en los que se encuentren sus depósitos, pero si se localizaren en dos o más predios, el aprovechamiento de estas aguas se considerará de utilidad pública, y quedará sujeto a las disposiciones que dicten las entidades federativas.\n\nEn los casos a que se refieren los dos párrafos anteriores, el dominio de la Nación es inalienable e imprescriptible y la explotación, el uso o el aprovechamiento de los recursos de que se trata, por los particulares o por sociedades constituidas conforme a las leyes mexicanas, no podrá realizarse sino mediante concesiones, otorgadas por el Ejecutivo Federal, de acuerdo con las reglas y condiciones que establezcan las leyes. Las normas legales relativas a obras o trabajos de explotación de los minerales y substancias a que se refiere el párrafo cuarto, regularán la ejecución y comprobación de los que se efectúen o deban efectuarse a partir de su vigencia, independientemente de la fecha de otorgamiento de las concesiones, y su inobservancia dará lugar a la cancelación de éstas. El Gobierno Federal tiene la facultad de establecer reservas nacionales y suprimirlas. Las declaratorias correspondientes se harán por el Ejecutivo en los casos y condiciones que las leyes prevean. Tratándose de minerales radiactivos y litio no se otorgarán concesiones. Corresponde exclusivamente a la Nación la planeación y el control del sistema eléctrico nacional en los términos del artículo 28 de esta Constitución, así como el servicio público de transmisión y distribución de energía eléctrica; en estas actividades no se otorgarán concesiones. Las leyes determinarán la forma en
