<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Constitución Política de los Estados Unidos Mexicanos: texto vigente e historial de versiones de cada artículo. Prototipo.">
<meta name="theme-color" content="#0f2a4d">
<title>Constitución Política de los Estados Unidos Mexicanos | Legislación MX</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f2a4d'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia,serif' fill='%23fff' text-anchor='middle'%3E%C2%A7%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --brand: #0f2a4d;
    --brand-2: #163a6a;
    --accent: #1a5fb4;
    --accent-bg: #e8f0fb;
    --gold: #b8862b;
    --bg: #f3f4f6;
    --surface: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e2e6ea;
    --ok: #1f7a4d;   --ok-bg: #e6f4ec;
    --warn: #92400e; --warn-bg: #fff6e5; --warn-border: #f2c879;
    --info: #1e4e8c; --info-bg: #eaf2fc;
    --ins-bg: #dcfce7; --ins-fg: #14532d;
    --del-bg: #fee2e2; --del-fg: #7f1d1d;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: Georgia, "Charter", "Iowan Old Style", "Times New Roman", serif;
    --header-h: 56px;
    --sidebar-w: 320px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  button { font: inherit; }
  :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .skip { position: absolute; left: -9999px; top: 8px; background: #fff; padding: .5rem 1rem; z-index: 100; }
  .skip:focus { left: 8px; }

  /* ---------- Cabecera ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 40; height: var(--header-h);
    background: var(--brand); color: #fff; display: flex; align-items: center; gap: 1rem;
    padding: 0 1rem; box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 2px 8px rgba(0,0,0,.18);
  }
  .brand { display: flex; align-items: baseline; gap: .5rem; color: #fff; text-decoration: none; white-space: nowrap; }
  .brand strong { font-size: 1.1rem; letter-spacing: .01em; }
  .brand .pill { font-size: .65rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--gold); color: #1f1300; padding: .15rem .45rem; border-radius: 999px; }
  .topbar .spacer { flex: 1; }
  .consulta { font-size: .85rem; opacity: .9; white-space: nowrap; }
  .consulta b { font-weight: 600; }
  .menu-btn {
    display: none; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 6px; padding: .35rem .6rem; cursor: pointer; align-items: center; gap: .4rem;
  }
  .menu-btn:hover { background: rgba(255,255,255,.1); }

  /* ---------- Layout ---------- */
  .layout { display: flex; align-items: flex-start; min-height: calc(100vh - var(--header-h)); }
  .sidebar {
    width: var(--sidebar-w); flex: 0 0 var(--sidebar-w); background: var(--surface);
    border-right: 1px solid var(--border); position: sticky; top: var(--header-h);
    height: calc(100vh - var(--header-h)); overflow-y: auto; display: flex; flex-direction: column;
  }
  .sidebar-head { padding: 1rem 1rem .75rem; border-bottom: 1px solid var(--border); }
  .norma-title { font-weight: 700; color: var(--brand); font-size: .95rem; line-height: 1.3; }
  .norma-meta { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
  .search {
    margin-top: .75rem; width: 100%; padding: .5rem .7rem; border: 1px solid #cfd5dc; border-radius: 8px;
    font-size: .9rem; background: #fafbfc;
  }
  .search:focus { border-color: var(--accent); background: #fff; }
  .tree { padding: .5rem .5rem 1rem; font-size: .875rem; flex: 1; }
  .tree details { margin: 0; }
  .tree summary {
    list-style: none; cursor: pointer; display: flex; gap: .4rem; align-items: flex-start;
    padding: .4rem .5rem; border-radius: 6px; color: var(--brand); font-weight: 600; user-select: none;
  }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary:hover { background: #f1f4f8; }
  .tree summary .chev { flex: 0 0 auto; width: 1em; height: 1em; margin-top: .25em; transition: transform .2s; color: var(--muted); }
  .tree details[open] > summary .chev { transform: rotate(90deg); }
  .tree summary .sub { display: block; font-weight: 400; color: var(--muted); font-size: .78rem; line-height: 1.3; }
  .tree .lvl-1 > summary { font-size: .9rem; }
  .tree .lvl-2, .tree .lvl-3, .tree ul.arts { margin-left: .8rem; border-left: 1px solid var(--border); padding-left: .25rem; }
  .tree ul.arts { list-style: none; padding: .15rem 0 .25rem .25rem; margin-top: 0; }
  .tree .art-link {
    display: flex; align-items: baseline; gap: .5rem; padding: .3rem .5rem; border-radius: 6px;
    color: var(--text); text-decoration: none; line-height: 1.3; border-left: 3px solid transparent;
  }
  .tree .art-link:hover { background: #f1f4f8; }
  .tree .art-link[aria-current="page"] { background: var(--accent-bg); border-left-color: var(--accent); color: var(--brand); font-weight: 600; }
  .tree .art-link .num { white-space: nowrap; }
  .tree .art-link .tema { font-size: .75rem; color: var(--muted); font-weight: 400; display: block; }
  .tree .art-link.pendiente { color: #9aa3ae; }
  .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: #c7ced6; flex: 0 0 auto; position: relative; top: -1px; }
  .dot.verificado { background: var(--ok); }
  .dot.prototipo { background: #e3a008; }
  .tree.filtering li.oculto { display: none; }
  .tree.filtering details { display: block; }
  .tree.filtering details.sin-coincidencias { display: none; }
  .sidebar-foot { padding: .6rem 1rem .9rem; border-top: 1px solid var(--border); font-size: .72rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .35rem .8rem; }
  .sidebar-foot span { display: inline-flex; align-items: center; gap: .3rem; }
  .backdrop { display: none; position: fixed; inset: var(--header-h) 0 0 0; background: rgba(15,42,77,.45); z-index: 30; }

  /* ---------- Contenido ---------- */
  .content { flex: 1; min-width: 0; padding: 1.25rem 2rem 3rem; max-width: 980px; }
  .breadcrumb { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
  .breadcrumb a { color: var(--muted); text-decoration: none; }
  .breadcrumb a:hover { color: var(--accent); text-decoration: underline; }
  .breadcrumb .sep { opacity: .6; }
  .breadcrumb b { color: var(--text); font-weight: 600; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin: .9rem 0 1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .6rem .9rem; box-shadow: var(--shadow);
  }
  .toolbar label { font-size: .85rem; color: var(--muted); display: inline-flex; align-items: center; gap: .5rem; }
  .toolbar input[type=date] { font: inherit; font-size: .85rem; padding: .3rem .45rem; border: 1px solid #cfd5dc; border-radius: 6px; color: var(--text); background: #fff; }
  .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; padding: .2rem .3rem; font-size: .85rem; text-decoration: underline; }
  .toolbar .estado { margin-left: auto; font-size: .8rem; color: var(--muted); }

  .article { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.6rem 2rem 1.4rem; scroll-margin-top: calc(var(--header-h) + 12px); }
  .article-head { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; }
  .article h1 { margin: 0; font-size: 1.75rem; color: var(--brand); font-family: var(--serif); font-weight: 700; letter-spacing: .005em; }
  .badge { font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
  .badge.vigente { background: var(--ok-bg); color: var(--ok); border-color: #b7e0c8; }
  .badge.historica { background: var(--info-bg); color: var(--info); border-color: #bfd3ee; }
  .badge.verificado { background: #eef2f7; color: #334155; border-color: #d6dde6; }
  .badge.prototipo { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
  .badge.pendiente { background: #f1f5f9; color: #64748b; border-color: #e2e8f0; }
  .tema { margin: .35rem 0 0; color: var(--muted); font-size: .9rem; }
  .tema-lbl { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-right: .2rem; }
  .meta-line { margin: .8rem 0 0; font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  .meta-line b { color: var(--text); font-weight: 600; }
  .por-cotejar { font-size: .7rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 999px; padding: .05rem .4rem; cursor: help; white-space: nowrap; }
  .dof-link { display: inline-flex; align-items: center; gap: .25rem; color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
  .dof-link:hover { border-bottom-color: var(--accent); }
  .dof-link svg { width: .85em; height: .85em; }
  .aviso { margin: 1rem 0 0; padding: .7rem .9rem; border-radius: 8px; font-size: .85rem; line-height: 1.45; border: 1px solid; }
  .aviso.prototipo { background: var(--warn-bg); border-color: var(--warn-border); color: #5c3a05; }
  .aviso.info { background: var(--info-bg); border-color: #bfd3ee; color: #163a6a; }
  .aviso.pendiente { background: #f8fafc; border-color: #e2e8f0; color: #475569; }
  .aviso a { color: inherit; }

  .texto { font-family: var(--serif); font-size: 1.08rem; line-height: 1.75; margin-top: 1.1rem; color: #111827; }
  .texto p { margin: 0 0 1em; text-align: left; hyphens: manual; }
  .texto p:last-child { margin-bottom: 0; }
  .texto p.apartado { font-weight: 700; margin-top: 1.2em; }
  .texto p.fraccion { padding-left: 2.2em; text-indent: -2.2em; }
  .texto p.inciso { padding-left: 3.6em; text-indent: -1.4em; }
  .texto p.encabezado { font-weight: 700; }
  .texto p.diff-ins, .texto p.diff-del, .texto p.diff-mod { padding-left: .6em; margin-left: -.75em; border-left: 3px solid #cbd5e1; }
  .texto p.diff-ins { border-left-color: #22c55e; }
  .texto p.diff-del { border-left-color: #ef4444; }
  .texto p.diff-mod { border-left-color: #f59e0b; }
  .texto ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; border-radius: 3px; padding: 0 .1em; }
  .texto del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; border-radius: 3px; padding: 0 .1em; }

  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--border); align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: .45rem; background: var(--brand); color: #fff; border: 1px solid var(--brand);
    padding: .55rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .9rem; transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--brand-2); }
  .btn:active { transform: translateY(1px); }
  .btn .count { background: rgba(255,255,255,.18); padding: .05rem .45rem; border-radius: 999px; font-size: .75rem; font-weight: 600; }
  .btn .chev { width: .9em; height: .9em; transition: transform .25s; }
  .btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .btn.secondary { background: #fff; color: var(--brand); border-color: #cfd5dc; font-weight: 500; }
  .btn.secondary:hover { background: #f1f4f8; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Historial (despliegue fluido bajo el artículo) ---------- */
  .historial { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s cubic-bezier(.2,.7,.2,1), opacity .3s, margin-top .4s; opacity: 0; margin-top: 0; scroll-margin-top: calc(var(--header-h) + 12px); }
  .historial.open { grid-template-rows: 1fr; opacity: 1; margin-top: 1.2rem; }
  .historial > .historial-inner { min-height: 0; overflow: hidden; }
  .historial-box { border: 1px solid var(--border); border-radius: var(--radius); background: #fbfcfd; }
  .hist-head { padding: .9rem 1.1rem; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; }
  .hist-head h2 { margin: 0; font-size: 1.05rem; color: var(--brand); }
  .hist-head p { margin: 0; font-size: .82rem; color: var(--muted); }
  .hist-body { display: grid; grid-template-columns: 290px 1fr; }
  .versiones { list-style: none; margin: 0; padding: .6rem; border-right: 1px solid var(--border); background: #f6f8fa; border-radius: 0 0 0 var(--radius); }
  .ver-btn {
    width: 100%; text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: .55rem .7rem .55rem .9rem;
    cursor: pointer; margin: 0 0 .45rem; position: relative; line-height: 1.35; color: var(--text);
  }
  .ver-btn:hover { border-color: #b9c3cf; }
  .ver-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .ver-btn .rango { font-size: .86rem; font-weight: 600; color: var(--brand); display: block; }
  .ver-btn .sub { font-size: .75rem; color: var(--muted); display: block; margin-top: .15rem; }
  .ver-btn .tag { font-size: .66rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; padding: .1rem .4rem; margin-left: .35rem; vertical-align: middle; }
  .ver-btn .tag.vig { background: var(--ok-bg); color: var(--ok); }
  .ver-btn .tag.cons { background: #fff3cd; color: #7a5200; }
  .ver-panel { padding: 1rem 1.3rem 1.3rem; min-width: 0; }
  .ver-panel-head { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: baseline; justify-content: space-between; }
  .ver-panel h3 { margin: 0; font-size: 1rem; color: var(--brand); }
  .ver-meta { margin: .35rem 0 0; font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  .ver-meta b { color: var(--text); font-weight: 600; }
  .diff-toggle { font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; }
  .diff-toggle input { accent-color: var(--accent); }
  .diff-leyenda { font-size: .75rem; color: var(--muted); margin-top: .5rem; }
  .diff-leyenda span { padding: 0 .3em; border-radius: 3px; }
  .ver-panel .texto { font-size: 1.02rem; margin-top: .9rem; padding-top: .9rem; border-top: 1px dashed var(--border); }

  .prevnext { display: flex; justify-content: space-between; gap: 1rem; margin-top: 1.2rem; }
  .prevnext a { text-decoration: none; font-size: .9rem; color: var(--brand); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .55rem .9rem; display: inline-flex; gap: .4rem; align-items: center; }
  .prevnext a:hover { background: #f1f4f8; }
  .prevnext .next { margin-left: auto; }
  .prevnext a.disabled { opacity: .4; pointer-events: none; }
  .legal { margin-top: 2rem; font-size: .78rem; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 1rem; }
  .legal p { margin: .3rem 0; }

  .toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 20px); background: #111827; color: #fff; padding: .6rem 1rem; border-radius: 8px; font-size: .85rem; opacity: 0; transition: opacity .25s, transform .25s; z-index: 60; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 960px) {
    .menu-btn { display: inline-flex; }
    .consulta { font-size: .75rem; }
    .consulta .lbl { display: none; }
    .sidebar {
      position: fixed; left: 0; top: var(--header-h); bottom: 0; height: auto; z-index: 35;
      transform: translateX(-100%); transition: transform .25s ease; box-shadow: 4px 0 20px rgba(0,0,0,.15); width: min(var(--sidebar-w), 88vw); flex-basis: auto;
    }
    body.menu-open .sidebar { transform: none; }
    body.menu-open .backdrop { display: block; }
    body.menu-open { overflow: hidden; }
    .content { padding: 1rem 1rem 2.5rem; }
    .article { padding: 1.2rem 1.1rem 1.1rem; }
    .article h1 { font-size: 1.45rem; }
    .texto { font-size: 1.02rem; line-height: 1.7; }
    .hist-body { grid-template-columns: 1fr; }
    .versiones { border-right: none; border-bottom: 1px solid var(--border); border-radius: 0; }
    .ver-panel { padding: .9rem 1rem 1.1rem; }
    .toolbar .estado { margin-left: 0; }
  }
  @media (max-width: 480px) {
    .brand strong { font-size: 1rem; }
    .consulta { display: none; }
    .prevnext { flex-direction: column; }
    .prevnext .next { margin-left: 0; }
  }
  @media print {
    .topbar, .sidebar, .backdrop, .toolbar, .actions, .prevnext, .toast, .menu-btn { display: none !important; }
    .layout { display: block; }
    .content { max-width: none; padding: 0; }
    .article { border: none; box-shadow: none; padding: 0; }
    .historial { display: block; opacity: 1; }
    .historial:not(.open) { display: none; }
    .historial > .historial-inner { overflow: visible; }
    .hist-body { grid-template-columns: 1fr; }
    .versiones { display: none; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>

<a class="skip" href="#articulo">Ir al contenido</a>

<header class="topbar">
  <button class="menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir índice">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    Índice
  </button>
  <a class="brand" href="#/art/1"><strong>Legislación MX</strong><span class="pill">Prototipo</span></a>
  <span class="spacer"></span>
  <span class="consulta"><span class="lbl">Fecha de consulta: </span><b id="consulta-fecha"></b></span>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Índice de la norma">
    <div class="sidebar-head">
      <div class="norma-title" id="norma-title"></div>
      <div class="norma-meta" id="norma-meta"></div>
      <input class="search" id="buscar" type="search" placeholder="Ir al artículo… (p. ej. 123)" aria-label="Buscar artículo por número o tema" autocomplete="off">
    </div>
    <nav class="tree" id="tree" aria-label="Estructura de la Constitución"></nav>
    <div class="sidebar-foot">
      <span><i class="dot verificado"></i> verificado</span>
      <span><i class="dot prototipo"></i> prototipo (texto simulado)</span>
      <span><i class="dot"></i> pendiente de carga</span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="content" id="contenido">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Ubicación"></nav>

    <div class="toolbar">
      <label for="fecha-al">Versión vigente al
        <input type="date" id="fecha-al" min="1917-02-05">
      </label>
      <button class="btn-link" id="btn-hoy" type="button">Hoy</button>
      <span class="estado" id="estado-vigencia"></span>
    </div>

    <article class="article" id="articulo"></article>

    <nav class="prevnext" id="prevnext" aria-label="Navegación entre artículos"></nav>

    <footer class="legal" id="legal"></footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

:{"desde":50,"hasta":50},"hijos":[{"tipo":"seccion","id":"t3-c2-s1","nombre":"Sección I","subtitulo":"De la Elección e Instalación del Congreso","articulos":{"desde":51,"hasta":70}},{"tipo":"seccion","id":"t3-c2-s2","nombre":"Sección II","subtitulo":"De la Iniciativa y Formación de las Leyes","articulos":{"desde":71,"hasta":72}},{"tipo":"seccion","id":"t3-c2-s3","nombre":"Sección III","subtitulo":"De las Facultades del Congreso","articulos":{"desde":73,"hasta":77}},{"tipo":"seccion","id":"t3-c2-s4","nombre":"Sección IV","subtitulo":"De la Comisión Permanente","articulos":{"desde":78,"hasta":78}},{"tipo":"seccion","id":"t3-c2-s5","nombre":"Sección V","subtitulo":"De la Fiscalización Superior de la Federación","articulos":{"desde":79,"hasta":79}}]},{"tipo":"capitulo","id":"t3-c3","nombre":"Capítulo III","subtitulo":"Del Poder Ejecutivo","articulos":{"desde":80,"hasta":93}},{"tipo":"capitulo","id":"t3-c4","nombre":"Capítulo IV","subtitulo":"Del Poder Judicial","articulos":{"desde":94,"hasta":107}}]},{"tipo":"titulo","id":"t4","nombre":"Título Cuarto","subtitulo":"De las Responsabilidades de los Servidores Públicos, Particulares Vinculados con Faltas Administrativas Graves o Hechos de Corrupción, y Patrimonial del Estado","articulos":{"desde":108,"hasta":114}},{"tipo":"titulo","id":"t5","nombre":"Título Quinto","subtitulo":"De los Estados de la Federación y de la Ciudad de México","articulos":{"desde":115,"hasta":122}},{"tipo":"titulo","id":"t6","nombre":"Título Sexto","subtitulo":"Del Trabajo y de la Previsión Social","articulos":{"desde":123,"hasta":123}},{"tipo":"titulo","id":"t7","nombre":"Título Séptimo","subtitulo":"Prevenciones Generales","articulos":{"desde":124,"hasta":134}},{"tipo":"titulo","id":"t8","nombre":"Título Octavo","subtitulo":"De las Reformas de la Constitución","articulos":{"desde":135,"hasta":135}},{"tipo":"titulo","id":"t9","nombre":"Título Noveno","subtitulo":"De la Inviolabilidad de la Constitución","articulos":{"desde":136,"hasta":136}}],"articulos":{"1":{"numero":"1o.","tema":"Derechos humanos y sus garantías; prohibición de la esclavitud y de la discriminación","estado":"verificado","nota":"Golden case. Textos reconstruidos a partir de fuentes oficiales (DOF y SCJN); véase cpeum-art-1.json.","versiones":[{"id":"v1","etiqueta":"Original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":"2001-08-13","capitulo":"De las Garantías Individuales","texto":"Art. 1o.- En los Estados Unidos Mexicanos todo individuo gozará de las garantías que otorga esta Constitución, las cuales no podrán restringirse ni suspenderse, sino en los casos y con las condiciones que ella misma establece.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver decreto en el DOF"},{"id":"v2","etiqueta":"Post 14-08-2001","publicacion":"2001-08-14","vigencia_desde":"2001-08-15","vigencia_hasta":"2006-12-04","capitulo":"De las Garantías Individuales","texto":"Artículo 1o.\nEn los Estados Unidos Mexicanos todo individuo gozará de las garantías que otorga esta Constitución, las cuales no podrán restringirse ni suspenderse, sino en los casos y con las condiciones que ella misma establece.\n\nEstá prohibida la esclavitud en los Estados Unidos Mexicanos. Los esclavos del extranjero que entren al territorio nacional alcanzarán, por este solo hecho, su libertad y la protección de las leyes.\n\nQueda prohibida toda discriminación motivada por origen étnico o nacional, el género, la edad, las capacidades diferentes, la condición social, las condiciones de salud, la religión, las opiniones, las preferencias, el estado civil o cualquier otra que atente contra la dignidad humana y tenga por objeto anular o menoscabar los derechos y libertades de las personas.","dof_url":"https://dof.gob.mx/nota_detalle.php?codigo=762221&fecha=14/08/2001","dof_etiqueta":"Ver decreto en el DOF"},{"id":"v3","etiqueta":"Post 04-12-2006","publicacion":"2006-12-04","vigencia_desde":"2006-12-05","vigencia_hasta":"2011-06-10","capitulo":"De las Garantías Individuales","texto":"Artículo 1o.\nEn los Estados Unidos Mexicanos todo individuo gozará de las garantías que otorga esta Constitución, las cuales no podrán restringirse ni suspenderse, sino en los casos y con las condiciones que ella misma establece.\n\nEstá prohibida la esclavitud en los Estados Unidos Mexicanos. Los esclavos del extranjero que entren al territorio nacional alcanzarán, por este solo hecho, su libertad y la protección de las leyes.\n\nQueda prohibida toda discriminación motivada por origen étnico o nacional, el género, la edad, las discapacidades, la condición social, las condiciones de salud, la religión, las opiniones, las preferencias, el estado civil o cualquier otra que atente contra la dignidad humana y tenga por objeto anular o menoscabar los derechos y libertades de las personas.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_169_04dic06.pdf","dof_etiqueta":"Ver decreto en el DOF"},{"id":"v4","etiqueta":"Vigente (post 10-06-2011)","publicacion":"2011-06-10","vigencia_desde":"2011-06-11","vigencia_hasta":null,"capitulo":"De los Derechos Humanos y sus Garantías","texto":"En los Estados Unidos Mexicanos todas las personas gozarán de los derechos humanos reconocidos en esta Constitución y en los tratados internacionales de los que el Estado Mexicano sea parte, así como de las garantías para su protección, cuyo ejercicio no podrá restringirse ni suspenderse, salvo en los casos y bajo las condiciones que esta Constitución establece.\n\nLas normas relativas a los derechos humanos se interpretarán de conformidad con esta Constitución y con los tratados internacionales de la materia favoreciendo en todo tiempo a las personas la protección más amplia.\n\nTodas las autoridades, en el ámbito de sus competencias, tienen la obligación de promover, respetar, proteger y garantizar los derechos humanos de conformidad con los principios de universalidad, interdependencia, indivisibilidad y progresividad. En consecuencia, el Estado deberá prevenir, investigar, sancionar y reparar las violaciones a los derechos humanos, en los términos que establezca la ley.\n\nEstá prohibida la esclavitud en los Estados Unidos Mexicanos. Los esclavos del extranjero que entren al territorio nacional alcanzarán, por este solo hecho, su libertad y la protección de las leyes.\n\nQueda prohibida toda discriminación motivada por origen étnico o nacional, el género, la edad, las discapacidades, la condición social, las condiciones de salud, la religión, las opiniones, las preferencias sexuales, el estado civil o cualquier otra que atente contra la dignidad humana y tenga por objeto anular o menoscabar los derechos y libertades de las personas.","dof_url":"https://dof.gob.mx/nota_detalle.php?codigo=5194486&fecha=10/06/2011","dof_etiqueta":"Ver decreto en el DOF"}]},"2":{"numero":"2o.","tema":"Pueblos y comunidades indígenas","estado":"prototipo","nota":"Artículo de prototipo: texto simulado y fechas ilustrativas. El texto oficial se cargará desde el DOF.","versiones":[{"id":"p1","etiqueta":"Simulada A","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":"2001-08-13","capitulo":"De las Garantías Individuales","texto":"Este artículo, en su redacción anterior, era muy breve. Texto simulado del prototipo: no reproduce el texto constitucional.\n\nLa Nación tiene una composición de prueba para la maqueta. Este segundo párrafo simulado existe únicamente para comprobar la lectura de párrafos cortos en el historial."},{"id":"p2","etiqueta":"Simulada B (vigente)","publicacion":"2001-08-14","vigencia_desde":"2001-08-15","vigencia_hasta":null,"capitulo":"De los Derechos Humanos y sus Garantías","texto":"Este artículo, en su redacción vigente, es extenso y se divide en apartados. Texto simulado del prototipo: no reproduce el texto constitucional.\n\nLa Nación tiene una composición de prueba para la maqueta. Este segundo párrafo simulado existe únicamente para comprobar la lectura de párrafos largos y el salto de línea en pantallas estrechas, por lo que se extiende un poco más de lo habitual.\n\nA. Este apartado simulado ilustra la estructura de apartados del artículo y sirve para probar el diseño:\n\nI. Primera fracción simulada, con la extensión aproximada de una fracción breve;\n\nII. Segunda fracción simulada, un poco más larga, para comprobar el sangrado, el interlineado y la alineación del texto tanto en escritorio como en móvil;\n\nIII. Tercera fracción simulada.\n\nB. Segundo apartado simulado. La Federación, las entidades federativas y los municipios aparecen aquí únicamente como ejemplo de redacción institucional para la maqueta."}]},"3":{"numero":"3o.","tema":"Derecho a la educación","estado":"prototipo","nota":"Artículo de prototipo: texto simulado y fechas ilustrativas. El texto oficial se cargará desde el DOF.","versiones":[{"id":"p1","etiqueta":"Simulada A","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":"2019-05-15","capitulo":"De las Garantías Individuales","texto":"Toda persona de prueba tiene derecho a recibir un texto simulado. Texto simulado del prototipo: no reproduce el texto constitucional.\n\nLa educación simulada que imparta la maqueta será de prueba.\n\nI. Primera fracción simulada de la versión anterior;\n\nII. Segunda fracción simulada de la versión anterior."},{"id":"p2","etiqueta":"Simulada B (vigente)","publicacion":"2019-05-15","vigencia_desde":"2019-05-16","vigencia_hasta":null,"capitulo":"De los Derechos Humanos y sus Garantías","texto":"Toda persona de prueba tiene derecho a recibir un texto simulado, universal y de interfaz. Texto simulado del prototipo: no reproduce el texto constitucional.\n\nLa educación simulada que imparta la maqueta será de prueba, gratuita para el lector y laica en su diseño.\n\nI. Primera fracción simulada de la versión vigente, reformada para mostrar cambios en el comparador;\n\nII. Segunda fracción simulada de la versión vigente;\n\nIII. Tercera fracción simulada, añadida en esta versión para probar el resaltado de texto nuevo."}]},"4":{"numero":"4o.","tema":"Igualdad entre mujeres y hombres, familia, salud, alimentación, medio ambiente, agua, vivienda, niñez, cultura, deporte y bienestar","estado":"verificado","nota":"Golden case. Textos extraídos del PDF «Historia del texto del artículo» de la SCJN y cotejados con el texto consolidado de la Cámara de Diputados; véase cpeum-art-4.json.","versiones":[{"id":"v1","etiqueta":"Original","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":"1974-12-31","vigencia_verificada":true,"vigencia_nota":"Artículo 1o. transitorio de la Constitución de 1917: entró en vigor el 1o. de mayo de 1917.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- A ninguna persona podrá impedirse que se dedique a la profesión, industria, comercio o trabajo que le acomode, siendo lícitos. El ejercicio de esta libertad sólo podrá vedarse por determinación judicial, cuando se ataquen los derechos de tercero o por resolución gubernativa, dictada en los términos que marque la ley, cuando se ofendan los derechos de la sociedad. Nadie puede ser privado del producto de su trabajo, sino por resolución judicial.\n\nLa ley deerminará (sic) en cada Estado cuáles son las profesiones que necesitan título para su ejercicio, las condiciones que deban llenarse para obtenerlo, y las autoridades que han de expedirlo.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF","notas_scjn":[]},{"id":"v2","etiqueta":"Reforma DOF 31-12-1974","tipo":"reforma","publicacion":"1974-12-31","vigencia_desde":"1975-01-01","vigencia_hasta":"1980-03-18","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_079_31dic74_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130100_0.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)"]},{"id":"v3","etiqueta":"Reforma DOF 18-03-1980","tipo":"reforma","publicacion":"1980-03-18","vigencia_desde":"1980-03-19","vigencia_hasta":"1983-02-03","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nEs deber de los padres preservar el derecho de los menores a la satisfacción de sus necesidades y a la salud física y mental. La Ley determinará los apoyos a la protección de los menores, a cargo de las instituciones públicas.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_091_18mar80_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130113.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 18 DE MARZO DE 1980)"]},{"id":"v4","etiqueta":"Reforma DOF 03-02-1983","tipo":"reforma","publicacion":"1983-02-03","vigencia_desde":"1983-02-04","vigencia_hasta":"1983-02-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nEs deber de los padres preservar el derecho de los menores a la satisfacción de sus necesidades y a la salud física y mental. La Ley determinará los apoyos a la protección de los menores, a cargo de las instituciones públicas.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_100_03feb83_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130125.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 18 DE MARZO DE 1980)"]},{"id":"v5","etiqueta":"Reforma DOF 07-02-1983","tipo":"reforma","publicacion":"1983-02-07","vigencia_desde":"1983-02-08","vigencia_hasta":"1992-01-28","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nEs deber de los padres preservar el derecho de los menores a la satisfacción de sus necesidades y a la salud física y mental. La Ley determinará los apoyos a la protección de los menores, a cargo de las instituciones públicas.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_104_07feb83_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130127.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 18 DE MARZO DE 1980)"]},{"id":"v6","etiqueta":"Reforma DOF 28-01-1992","tipo":"reforma","publicacion":"1992-01-28","vigencia_desde":"1992-01-29","vigencia_hasta":"1999-06-28","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- La Nación mexicana tiene una composición pluricultural sustentada originalmente en sus pueblos indígenas. La Ley protegerá y promoverá el desarrollo de sus lenguas, culturas, usos, costumbres, recursos y formas específicas de organización social, y garantizará a sus integrantes el efectivo acceso a la jurisdicción del Estado. En los juicios y procedimientos agrarios en que aquellos sean parte, se tomarán en cuenta sus prácticas y costumbres jurídicas en los términos que establezca la ley.\n\nEl varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nEs deber de los padres preservar el derecho de los menores a la satisfacción de sus necesidades y a la salud física y mental. La Ley determinará los apoyos a la protección de los menores, a cargo de las instituciones públicas.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_122_28ene92_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130016.pdf","notas_scjn":["(ADICIONADO PRIMER PARRAFO, D.O.F. 28 DE ENERO DE 1992)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 18 DE MARZO DE 1980)"]},{"id":"v7","etiqueta":"Reforma DOF 28-06-1999","tipo":"reforma","publicacion":"1999-06-28","vigencia_desde":"1999-06-29","vigencia_hasta":"2000-04-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- La Nación mexicana tiene una composición pluricultural sustentada originalmente en sus pueblos indígenas. La Ley protegerá y promoverá el desarrollo de sus lenguas, c a DOF 07-04-2000","tipo":"reforma","publicacion":"2000-04-07","vigencia_desde":"2000-04-08","vigencia_hasta":"2000-04-12","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); el decreto sólo está disponible como imagen escaneada, pendiente de cotejo.","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- La Nación mexicana tiene una composición pluricultural sustentada originalmente en sus pueblos indígenas. La Ley protegerá y promoverá el desarrollo de sus lenguas, culturas, usos, costumbres, recursos y formas específicas de organización social, y garantizará a sus integrantes el efectivo acceso a la jurisdicción del Estado. En los juicios y procedimientos agrarios en que aquellos sean parte, se tomarán en cuenta sus prácticas y costumbres jurídicas en los términos que establezca la ley.\n\nEl varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda persona tiene derecho a un medio ambiente adecuado para su desarrollo y bienestar.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nLos niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral.\n\nLos ascendientes, tutores y custodios tienen el deber de preservar estos derechos. El Estado proveerá lo necesario para propiciar el respeto a la dignidad de la niñez y el ejercicio pleno de sus derechos.\n\nEl Estado otorgará facilidades a los particulares para que se coadyuven al cumplimiento de los derechos de la niñez.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_148_07abr00_ima.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130164.pdf","notas_scjn":["N. DE E. PARA CONSULTAR LA VERSIÓN CORREGIDA DE ESTE ORDENAMIENTO, DE CONFORMIDAD CON LA FE DE ERRATAS PUBLICADA EL 12 DE ABRIL DE 2000 EN EL DIARIO OFICIAL DE LA FEDERACIÓN, SE RECOMIENDA ACUDIR AL TEXTO QUE SE VISUALIZA DENTRO DE LA CRONOLOGÍA CORRESPONDIENTE A DICHA FECHA, EN EL ÍNDICE RESPECTIVO DE SU HISTORIA LEGISLATIVA.","(ADICIONADO PRIMER PARRAFO, D.O.F. 28 DE ENERO DE 1992)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 28 DE JUNIO DE 1999)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(REFORMADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000)"]},{"id":"v9","etiqueta":"Fe de erratas DOF 12-04-2000","tipo":"fe_de_erratas","publicacion":"2000-04-12","vigencia_desde":"2000-04-13","vigencia_hasta":"2001-08-14","vigencia_verificada":false,"vigencia_nota":"Fe de erratas al decreto publicado el 07-04-2000; el texto corregido se presenta como versión a partir del día siguiente a su publicación (regla general; decreto escaneado, pendiente de cotejo).","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- La Nación mexicana tiene una composición pluricultural sustentada originalmente en sus pueblos indígenas. La Ley protegerá y promoverá el desarrollo de sus lenguas, culturas, usos, costumbres, recursos y formas específicas de organización social, y garantizará a sus integrantes el efectivo acceso a la jurisdicción del Estado. En los juicios y procedimientos agrario .scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130168_2.pdf","notas_scjn":["(DEROGADO PRIMER PARRAFO, D.O.F. 14 DE AGOSTO DE 2001)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 28 DE JUNIO DE 1999)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(REFORMADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)"]},{"id":"v11","etiqueta":"Reforma DOF 30-04-2009","tipo":"reforma","publicacion":"2009-04-30","vigencia_desde":"2009-05-01","vigencia_hasta":"2011-10-12","vigencia_verificada":true,"vigencia_nota":"Transitorio primero del decreto: entra en vigor al día siguiente de su publicación en el DOF (cotejado en el texto del decreto).","capitulo":"De las Garantías Individuales","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda persona tiene derecho a un medio ambiente adecuado para su desarrollo y bienestar.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nLos niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral.\n\nLos ascendientes, tutores y custodios tienen el deber de preservar estos derechos. El Estado proveerá lo necesario para propiciar el respeto a la dignidad de la niñez y el ejercicio pleno de sus derechos.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_184_30abr09.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130201_0.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 28 DE JUNIO DE 1999)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(REFORMADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 30 DE ABRIL DE 2009)"]},{"id":"v12","etiqueta":"Reforma DOF 12-10-2011 (decreto 1)","tipo":"reforma","publicacion":"2011-10-12","vigencia_desde":"2011-10-13","vigencia_hasta":"2011-10-13","vigencia_verificada":true,"vigencia_nota":"Transitorio primero del decreto: entra en vigor al día siguiente de su publicación en el DOF (cotejado en el texto del decreto). Texto intermedio: el siguiente decreto se publicó el mismo día y entró en vigor en la misma fecha, por lo que esta versión no rigió por sí sola.","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Art. 4o.- El varón y la mujer son iguales ante la ley. Esta protegerá la organización y el desarrollo de la familia.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda persona tiene derecho a un medio ambiente adecuado para su desarrollo y bienestar.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nLos niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral.\n\nLos ascendientes, tutores y custodios tienen el deber de preservar estos derechos. El Estado proveerá lo necesario para propiciar el respeto a la dignidad de la niñez y el ejercicio pleno de sus derechos.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.\n\nToda persona tiene derecho a la cultura física y a la práctica del deporte. Corresponde al Estado su promoción, fomento y estímulo conforme a las leyes en la materia.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_re anera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la alimentación nutritiva, suficiente y de calidad. El Estado lo garantizará.\n\nToda persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución.\n\nToda persona tiene derecho a un medio ambiente sano para su desarrollo y bienestar. El Estado garantizará el respeto a este derecho. El daño y deterioro ambiental generará responsabilidad para quien lo provoque en términos de lo dispuesto por la ley.\n\nToda persona tiene derecho al acceso, disposición y saneamiento de agua para consumo personal y doméstico en forma suficiente, salubre, aceptable y asequible. El Estado garantizará este derecho y la ley definirá las bases, apoyos y modalidades para el acceso y uso equitativo y sustentable de los recursos hídricos, estableciendo la participación de la Federación, las entidades federativas y los municipios, así como la participación de la ciudadanía para la consecución de dichos fines.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nEn todas las decisiones y actuaciones del Estado se velará y cumplirá con el principio del interés superior de la niñez, garantizando de manera plena sus derechos. Los niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral. Este principio deberá guiar el diseño, ejecución, seguimiento y evaluación de las políticas públicas dirigidas a la niñez.\n\nLos ascendientes, tutores y custodios tienen la obligación de preservar y exigir el cumplimiento de estos derechos y principios.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.\n\nToda persona tiene derecho a la cultura física y a la práctica del deporte. Corresponde al Estado su promoción, fomento y estímulo conforme a las leyes en la materia.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_200_08feb12.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2016-12/00130218.pdf","notas_scjn":["(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 13 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 3 DE FEBRERO DE 1983)","(REFORMADO, D.O.F. 8 DE FEBRERO DE 2012)","(ADICIONADO, D.O.F. 8 DE FEBRERO DE 2012)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 30 DE ABRIL DE 2009)","(ADICIONADO, D.O.F. 12 DE OCTUBRE DE 2011)"]},{"id":"v16","etiqueta":"Reforma DOF 17-06-2014","tipo":"reforma","publicacion":"2014-06-17","vigencia_desde":"2014-06-18","vigencia_hasta":"2019-06-06","vigencia_verificada":true,"vigencia_nota":"Transitorio primero del decreto: entra en vigor al día siguiente de su publicación en el DOF (cotejado en el texto del decreto).","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Art eto a este derecho. El daño y deterioro ambiental generará responsabilidad para quien lo provoque en términos de lo dispuesto por la ley.\n\nToda persona tiene derecho al acceso, disposición y saneamiento de agua para consumo personal y doméstico en forma suficiente, salubre, aceptable y asequible. El Estado garantizará este derecho y la ley definirá las bases, apoyos y modalidades para el acceso y uso equitativo y sustentable de los recursos hídricos, estableciendo la participación de la Federación, las entidades federativas y los municipios, así como la participación de la ciudadanía para la consecución de dichos fines.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nToda persona tiene derecho a la identidad y a ser registrado de manera inmediata a su nacimiento. El Estado garantizará el cumplimiento de estos derechos. La autoridad competente expedirá gratuitamente la primera copia certificada del acta de registro de nacimiento.\n\nEn todas las decisiones y actuaciones del Estado se velará y cumplirá con el principio del interés superior de la niñez, garantizando de manera plena sus derechos. Los niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral. Este principio deberá guiar el diseño, ejecución, seguimiento y evaluación de las políticas públicas dirigidas a la niñez.\n\nLos ascendientes, tutores y custodios tienen la obligación de preservar y exigir el cumplimiento de estos derechos y principios.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.\n\nToda persona tiene derecho a la cultura física y a la práctica del deporte. Corresponde al Estado su promoción, fomento y estímulo conforme a las leyes en la materia.\n\nEl Estado garantizará la entrega de un apoyo económico a las personas que tengan discapacidad permanente en los términos que fije la Ley. Para recibir esta prestación tendrán prioridad las y los menores de dieciocho años, las y los indígenas y las y los afromexicanos hasta la edad de sesenta y cuatro años y las personas que se encuentren en condición de pobreza.\n\nLas personas mayores de sesenta y ocho años tienen derecho a recibir por parte del Estado una pensión no contributiva en los términos que fije la Ley. En el caso de las y los indígenas y las y los afromexicanos esta prestación se otorgará a partir de los sesenta y cinco años de edad.\n\nEl Estado establecerá un sistema de becas para las y los estudiantes de todos los niveles escolares del sistema de educación pública, con prioridad a las y los pertenecientes a las familias que se encuentren en condición de pobreza, para garantizar con equidad el derecho a la educación.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_242_08may20.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2020-05/08052020.pdf","notas_scjn":["(REFORMADO PRIMER PÁRRAFO, D.O.F. 6 DE JUNIO DE 2019)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 13 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 8 DE MAYO DE 2020)","(REFORMADO, D.O.F. 8 DE FEBRERO DE 2012)","(ADICIONADO, D.O.F. 8 DE FEBRERO DE 2012)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 17 DE JUNIO DE 2014)","(REFORMADO, D.O.F. 12 D star, con el fin de garantizar la extensión progresiva, cuantitativa y cualitativa de los servicios de salud para la atención integral y gratuita de las personas que no cuenten con seguridad social.\n\nToda persona tiene derecho a un medio ambiente sano para su desarrollo y bienestar. El Estado garantizará el respeto a este derecho. El daño y deterioro ambiental generará responsabilidad para quien lo provoque en términos de lo dispuesto por la ley.\n\nToda persona tiene derecho al acceso, disposición y saneamiento de agua para consumo personal y doméstico en forma suficiente, salubre, aceptable y asequible. El Estado garantizará este derecho y la ley definirá las bases, apoyos y modalidades para el acceso y uso equitativo y sustentable de los recursos hídricos, estableciendo la participación de la Federación, las entidades federativas y los municipios, así como la participación de la ciudadanía para la consecución de dichos fines.\n\nToda familia tiene derecho a disfrutar de vivienda digna y decorosa. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nToda persona tiene derecho a la identidad y a ser registrado de manera inmediata a su nacimiento. El Estado garantizará el cumplimiento de estos derechos. La autoridad competente expedirá gratuitamente la primera copia certificada del acta de registro de nacimiento.\n\nEn todas las decisiones y actuaciones del Estado se velará y cumplirá con el principio del interés superior de la niñez, garantizando de manera plena sus derechos. Los niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral. Este principio deberá guiar el diseño, ejecución, seguimiento y evaluación de las políticas públicas dirigidas a la niñez.\n\nLos ascendientes, tutores y custodios tienen la obligación de preservar y exigir el cumplimiento de estos derechos y principios.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.\n\nToda persona tiene derecho a la cultura física y a la práctica del deporte. Corresponde al Estado su promoción, fomento y estímulo conforme a las leyes en la materia.\n\nEl Estado garantizará la entrega de un apoyo económico a las personas que tengan discapacidad permanente en los términos que fije la Ley. Para recibir esta prestación tendrán prioridad las y los menores de dieciocho años, las y los indígenas y las y los afromexicanos hasta la edad de sesenta y cuatro años y las personas que se encuentren en condición de pobreza.\n\nLas personas mayores de sesenta y ocho años tienen derecho a recibir por parte del Estado una pensión no contributiva en los términos que fije la Ley. En el caso de las y los indígenas y las y los afromexicanos esta prestación se otorgará a partir de los sesenta y cinco años de edad.\n\nEl Estado establecerá un sistema de becas para las y los estudiantes de todos los niveles escolares del sistema de educación pública, con prioridad a las y los pertenecientes a las familias que se encuentren en condición de pobreza, para garantizar con equidad el derecho a la educación.\n\nToda persona tiene derecho a la movilidad en condiciones de seguridad vial, accesibilidad, eficiencia, sostenibilidad, calidad, inclusión e igualdad.\n\nEl Estado promoverá el desarrollo integral de las personas jóvenes, a través de políticas públicas con enfoque multidisciplinario, que propicien su inclusión en el ámbito político, social, económico y cultural del país. La Ley establecerá la concurrencia de la Federación, entidades federativas, Municipios y demarcaciones territoriales de la Ciudad de México, para esos efectos.\n\nToda persona tiene derecho a vivir una vida libre de violencias, el Estado tiene deberes reforzados de protección con las mujeres, adolescentes, niñas y niños. La ley definirá las bases y modalidades para garantizar su realización de conformidad con lo previsto en los artículos 21, párrafo noveno y 73, fracción XXI, penúltimo párrafo de esta Constitución.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_264_15nov24.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2024-11/15112024.pdf","notas_scjn":["(REFORMADO PRIMER PÁRRAFO, D.O.F. 15 DE NOVIEMBRE DE 2024)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 13 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 8 DE MAYO DE 2020)","(REFORMADO, D.O.F. 8 DE FEBRERO DE 2012)","(ADICIONADO, D.O.F. 8 DE FEBRERO DE 2012)","(REFORMADO [N. DE E. ADICIONADO], D.O.F. 7 DE FEBRERO DE 1983)","(ADICIONADO, D.O.F. 17 DE JUNIO DE 2014)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 30 DE ABRIL DE 2009)","(ADICIONADO, D.O.F. 12 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 18 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 24 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 15 DE NOVIEMBRE DE 2024)"]},{"id":"v22","etiqueta":"Reforma DOF 02-12-2024 (decreto 1)","tipo":"reforma","publicacion":"2024-12-02","vigencia_desde":"2024-12-03","vigencia_hasta":"2024-12-03","vigencia_verificada":true,"vigencia_nota":"Transitorio primero del decreto: entra en vigor al día siguiente de su publi ados no podrá ser disminuido, en términos reales, respecto del que se haya asignado en el ejercicio fiscal inmediato anterior.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_267_02dic24.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2024-12/0002122024_3.pdf","notas_scjn":["(REFORMADO PRIMER PÁRRAFO, D.O.F. 15 DE NOVIEMBRE DE 2024)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 13 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 8 DE MAYO DE 2020)","(REFORMADO, D.O.F. 8 DE FEBRERO DE 2012)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 8 DE FEBRERO DE 2012)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 17 DE JUNIO DE 2014)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 30 DE ABRIL DE 2009)","(ADICIONADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 18 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 24 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 15 DE NOVIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)"]},{"id":"v24","etiqueta":"Reforma DOF 17-01-2025","tipo":"reforma","publicacion":"2025-01-17","vigencia_desde":"2025-01-18","vigencia_hasta":"2025-03-17","vigencia_verificada":true,"vigencia_nota":"Transitorio primero del decreto: entra en vigor al día siguiente de su publicación en el DOF (cotejado en el texto del decreto).","capitulo":"De los Derechos Humanos y sus Garantías","texto":"Art. 4o.- La mujer y el hombre son iguales ante la ley. Ésta protegerá la organización y el desarrollo de las familias. El Estado garantizará el goce y ejercicio del derecho a la igualdad sustantiva de las mujeres.\n\nToda persona tiene derecho a decidir de manera libre, responsable e informada sobre el número y el espaciamiento de sus hijos.\n\nToda persona tiene derecho a la alimentación nutritiva, suficiente y de calidad. El Estado lo garantizará.\n\nToda Persona tiene derecho a la protección de la salud. La Ley definirá las bases y modalidades para el acceso a los servicios de salud y establecerá la concurrencia de la Federación y las entidades federativas en materia de salubridad general, conforme a lo que dispone la fracción XVI del artículo 73 de esta Constitución. La Ley definirá un sistema de salud para el bienestar, con el fin de garantizar la extensión progresiva, cuantitativa y cualitativa de los servicios de salud para la atención integral y gratuita de las personas que no cuenten con seguridad social.\n\nPara garantizar el derecho de protección a la salud de las personas, la ley sancionará toda actividad relacionada con cigarrillos electrónicos, vapeadores y demás sistemas o dispositivos análogos que señale la ley; así como la producción, distribución y enajenación de sustancias tóxicas, precursores químicos, el uso ilícito del fentanilo y demás drogas sintéticas no autorizadas.\n\nToda persona tiene derecho a un medio ambiente sano para su desarrollo y bienestar. El Estado garantizará el respeto a este derecho. El daño y deterioro ambiental generará responsabilidad para quien lo provoque en términos de lo dispuesto por la ley.\n\nQueda prohibido el maltrato a los animales. El Estado mexicano debe garantizar la protección, el trato adecuado, la conservación y el cuidado de los animales, en los términos que señalen las leyes respectivas.\n\nToda persona tiene derecho al acceso, disposición y saneamiento de agua para consumo personal y doméstico en forma suficiente, salubre, aceptable y asequible. El Estado garantizará este derecho y la ley definirá las bases, apoyos y modalidades para el acceso y uso equitativo y sustentable de los recursos hídricos, estableciendo la participación de la Federación, las entidades federativas y los municipios, así como la participación de la ciudadanía para la consecución de dichos fines.\n\nToda persona tiene derecho a disfrutar de vivienda adecuada. La Ley establecerá los instrumentos y apoyos necesarios a fin de alcanzar tal objetivo.\n\nToda persona tiene derecho a la identidad y a ser registrado de manera inmediata a su nacimiento. El Estado garantizará el cumplimiento de estos derechos. La autoridad competente expedirá gratuitamente la primera copia certificada del acta de registro de nacimiento.\n\nEn todas las decisiones y actuaciones del Estado se velará y cumplirá con el principio del interés superior de la niñez, garantizando de manera plena sus derechos. Los niños y las niñas tienen derecho a la satisfacción de sus necesidades de alimentación, salud, educación y sano esparcimiento para su desarrollo integral. Este principio deberá guiar el diseño, ejecución, seguimiento y evaluación de las políticas públicas dirigidas a la niñez.\n\nLos ascendientes, tutores y custodios tienen la obligación de preservar y exigir el cumplimiento de estos derechos y principios.\n\nEl Estado otorgará facilidades a los particulares para que coadyuven al cumplimiento de los derechos de la niñez.\n\nToda persona tiene derecho al acceso a la cultura y al disfrute de los bienes y servicios que presta el Estado en la materia, así como el ejercicio de sus derechos culturales. El Estado promoverá los medios para la difusión y desarrollo de la cultura, atendiendo a la diversidad cultural en todas sus manifestaciones y expresiones con pleno respeto a la libertad creativa. La ley establecerá los mecanismos para el acceso y participación a cualquier manifestación cultural.\n\nToda persona tiene derecho a la cultura física y a la práctica del deporte. Corresponde al Estado su promoción, fomento y estímulo conforme a las leyes en la materia.\n\nLa Federación y las entidades federativas garantizarán la entrega de una pensión no contributiva a las personas con discapacidad permanente menores de sesenta y cinco años, en los términos que fije la ley.\n\nEl Estado garantizará la rehabilitación y habilitación de las personas que viven con discapacidad permanente, dando prioridad a las personas menores de dieciocho años de edad, en términos que fije la ley.\n\nLas personas adultas mayores de sesenta y cinco años tienen derecho a recibir por parte del Estado una pensión no contributiva en los términos que fije la ley.\n\nA las personas con discapacidad permanente menores de sesenta y cinco años les corresponde la pensión no contributiva por discapacidad, y a todas las personas mayores de esa edad les corresponde la pensión no contributiva de adultos mayores.\n\nEl Estado establecerá un sistema de becas para las y los estudiantes de todos los niveles escolares del sistema de educación pública, con prioridad a las y los pertenecientes a las familias que se encuentren en condición de pobreza, para garantizar con equidad el derecho a la educación.\n\nToda persona tiene derecho a la movilidad en condiciones de seguridad vial, accesibilidad, eficiencia, sostenibilidad, calidad, inclusión e igualdad.\n\nEl Estado promoverá el desarrollo integral de las personas jóvenes, a través de políticas públicas con enfoque multidisciplinario, que propicien su inclusión en el ámbito político, social, económico y cultural del país. La Ley establecerá la concurrencia de la Federación, entidades federativas, Municipios y demarcaciones territoriales de la Ciudad de México, para esos efectos.\n\nToda persona tiene derecho a vivir una vida libre de violencias, el Estado tiene deberes reforzados de protección con las mujeres, adolescentes, niñas y niños. La ley definirá las bases y modalidades para garantizar su realización de conformidad con lo previsto en los artículos 21, párrafo noveno y 73, fracción XXI, penúltimo párrafo de esta Constitución.\n\nEl Estado destinará anualmente los recursos presupuestarios suficientes y oportunos, conforme al principio de progresividad, para garantizar los derechos establecidos en este artículo que impliquen la transferencia de recursos directos hacia la población destinataria. El monto de los recursos asignados no podrá ser disminuido, en términos reales, respecto del que se haya asignado en el ejercicio fiscal inmediato anterior.","dof_url":"https://www.diputados.gob.mx/LeyesBiblio/ref/dof/CPEUM_ref_271_17ene25.pdf","dof_etiqueta":"Ver decreto en el DOF","scjn_url":"https://www.scjn.gob.mx/sites/default/files/cpeum/decretos_reformas/2025-01/0017012025.pdf","notas_scjn":["(REFORMADO PRIMER PÁRRAFO, D.O.F. 15 DE NOVIEMBRE DE 2024)","(REFORMADO, D.O.F. 31 DE DICIEMBRE DE 1974)","(ADICIONADO, D.O.F. 13 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 17 DE ENERO DE 2025)","(REFORMADO, D.O.F. 8 DE FEBRERO DE 2012)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 8 DE FEBRERO DE 2012)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 17 DE JUNIO DE 2014)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 12 DE OCTUBRE DE 2011)","(ADICIONADO, D.O.F. 7 DE ABRIL DE 2000) (F. DE E., D.O.F. 12 DE ABRIL DE 2000)","(ADICIONADO, D.O.F. 30 DE ABRIL DE 2009)","(ADICIONADO, D.O.F. 12 DE OCTUBRE DE 2011)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(REFORMADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)","(ADICIONADO, D.O.F. 8 DE MAYO DE 2020)","(ADICIONADO, D.O.F. 18 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 24 DE DICIEMBRE DE 2020)","(ADICIONADO, D.O.F. 15 DE NOVIEMBRE DE 2024)","(ADICIONADO, D.O.F. 2 DE DICIEMBRE DE 2024)"]},{"id":"v25","etiqueta":"Vigente (post 17-03-2025)","tipo":"reforma","publicacion":"2025-03-17","vigencia_desde":"2025-03-18","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Transitorio
