ncia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"Prevenciones Generales","texto":"Artículo 132. Los fuertes, los cuarteles, almacenes de depósito y demás bienes inmuebles destinados por el Gobierno de la Unión al servicio público o al uso común, estarán sujetos a la jurisdicción de los Poderes Federales en los términos que establezca la ley que expedirá el Congreso de la Unión; mas para que lo estén igualmente los que en lo sucesivo adquiera dentro del territorio de algún Estado, será necesario el consentimiento de la legislatura respectiva.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/132.json"},"133":{"numero":"133","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"Prevenciones Generales","texto":"Artículo 133. Esta Constitución, las leyes del Congreso de la Unión que emanen de ella y todos los tratados que estén de acuerdo con la misma, celebrados y que se celebren por el Presidente de la República, con aprobación del Senado, serán la Ley Suprema de toda la Unión. Los jueces de cada entidad federativa se arreglarán a dicha Constitución, leyes y tratados, a pesar de las disposiciones en contrario que pueda haber en las Constituciones o leyes de las entidades federativas.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/133.json"},"134":{"numero":"134","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 23-04-2026)","publicacion":"2026-04-23","vigencia_desde":"2026-04-24","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"Prevenciones Generales","texto":"Artículo 134. Los recursos económicos de que dispongan la Federación, las entidades federativas, los Municipios y las demarcaciones territoriales de la Ciudad de México, se administrarán con eficiencia, eficacia, economía, transparencia y honradez para satisfacer los objetivos a los que estén destinados.\n\nLos resultados del ejercicio de dichos recursos serán evaluados por las instancias técnicas que establezcan, respectivamente, la Federación y las entidades federativas, con el objeto de propiciar que los recursos económicos se asignen en los respectivos presupuestos en los términos del párrafo precedente. Lo anterior, sin menoscabo de lo dispuesto en los artículos 26, Apartado C, 74, fracción VI y 79 de esta Constitución.\n\nLos entes públicos ajustarán sus estructuras orgánicas y ocupacionales de conformidad con los principios de racionalidad y austeridad republicana, eliminando todo tipo de duplicidades funcionales u organizacionales, atendiendo a las necesidades de mejora y modernización de la gestión pública.\n\nLas remuneraciones de las personas consejeras electorales, las magistradas y magistrados electorales, titulares de las secretarías de órganos administrativos y titulares de áreas ejecutivas y técnicas u homólogos del Instituto Nacional Electoral, los organismos públicos locales electorales y los tribunales electorales de las entidades federativas, no excederán el límite establecido en el artículo 127 de esta Constitución y no podrán adquirir o contratar con recursos públicos seguros de gastos médicos, de vida o de pensiones privadas, seguros de separación individualizados, cajas de ahorro especiales, regímenes especiales de retiro u otras prestaciones que no estén previstas por la ley, decreto, disposición general, contrato colectivo o condiciones generales de trabajo.\n\nLas adquisiciones, arrendamientos y enajenaciones de todo tipo de bienes, prestación de servicios de cualquier naturaleza y la contratación de obra que realicen, se adjudicarán o llevarán a cabo a través de licitaciones públicas mediante convocatoria pública para que libremente se presenten proposiciones solventes en sobre cerrado, que será abierto públicamente, a fin de asegurar al Estado las mejores condiciones disponibles en cuanto a precio, calidad, financiamiento, oportunidad y demás circunstancias pertinentes.\n\nCuando las licitaciones a que hace referencia el párrafo anterior no sean idóneas para asegurar dichas condiciones, las leyes establecerán las bases, procedimientos, reglas, requisitos y demás elementos para acreditar la economía, eficacia, eficiencia, imparcialidad y honradez que aseguren las mejores condiciones para el Estado.\n\nEl manejo de recursos económicos federales por parte de las entidades federativas, los municipios y las demarcaciones territoriales de la Ciudad de México, se sujetará a las bases de este artículo y a las leyes reglamentarias. La evaluación sobre el ejercicio de dichos recursos se realizará por las instancias técnicas de las entidades federativas a que se refiere el párrafo segundo de este artículo.\n\nLos servidores públicos serán responsables del cumplimiento de estas bases en los términos del Título Cuarto de esta Constitución.\n\nLos servidores públicos de la Federación, las entidades federativas, los Municipios y las demarcaciones territoriales de la Ciudad de México, tienen en todo tiempo la obligación de aplicar con imparcialidad los recursos públicos que están bajo su responsabilidad, sin influir en la equidad de la competencia entre los partidos políticos.\n\nLa propaganda, bajo cualquier modalidad de comunicación social, que difundan como tales, los poderes públicos, los órganos autónomos, las dependencias y entidades de la administración pública y cualquier otro ente de los tres órdenes de gobierno, deberá tener carácter institucional y fines informativos, educativos o de orientación social. En ningún caso esta propaganda incluirá nombres, imágenes, voces o símbolos que impliquen promoción personalizada de cualquier servidor público.\n\nLas leyes, en sus respectivos ámbitos de aplicación, garantizarán el estricto cumplimiento de lo previsto en los dos párrafos anteriores, incluyendo el régimen de sanciones a que haya lugar.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/134.json"},"135":{"numero":"135","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Reformas de la Constitución","texto":"Artículo 135. La presente Constitución puede ser adicionada o reformada. Para que las adiciones o reformas lleguen a ser parte de la misma, se requiere que el Congreso de la Unión, por el voto de las dos terceras partes de los individuos presentes, acuerden las reformas o adiciones, y que éstas sean aprobadas por la mayoría de las legislaturas de los Estados y de la Ciudad de México.\n\nEl Congreso de la Unión o la Comisión Permanente en su caso, harán el cómputo de los votos de las Legislaturas y la declaración de haber sido aprobadas las adiciones o reformas.","vigencia_hasta":null}],"tema":"Reformas a la Constitución","fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/135.json"},"136":{"numero":"136","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De la Inviolabilidad de la Constitución","texto":"Artículo 136. Esta Constitución no perderá su fuerza y vigor, aun cuando por alguna rebelión se interrumpa su observancia. En caso de que por cualquier trastorno público, se establezca un gobierno contrario a los principios que ella sanciona, tan luego como el pueblo recobre su libertad, se restablecerá su observancia, y con arreglo a ella y a las leyes que en su virtud se hubieren expedido, serán juzgados, así los que hubieren figurado en el gobierno emanado de la rebelión, como los que hubieren cooperado a ésta.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/136.json"}}}

<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('cpeum-data').textContent);
  var NORMA = DATA.norma;
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  // ---------- utilidades ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hoyISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtFecha(iso, corto) {
    if (!iso) return '';
    var p = iso.split('-'); var y = +p[0], m = +p[1], d = +p[2];
    return corto ? (d + ' ' + MESES_CORTOS[m - 1] + ' ' + y) : (d + ' de ' + MESES[m - 1] + ' de ' + y);
  }
  function fmtHoyLargo() { var d = new Date(); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear(); }
  function numeroArt(n) { n = +n; return n <= 9 ? n + 'o.' : String(n); }
  function cmpVersiones(a, b) { return 0; }  // cpeum.json ya está en orden cronológico (incluye versiones sin fecha, que no se pueden ordenar por sí solas)

  // ---------- índice plano de artículos (a partir de la estructura) ----------
  var ARTS = [];          // orden de lectura
  var ART_BY_NUM = {};    // "1" -> {num, path:[nodos], ...}
  function expandir(nodo, path) {
    var p = path.concat([nodo]);
    if (nodo.articulos) {
      for (var n = nodo.articulos.desde; n <= nodo.articulos.hasta; n++) {
        var a = { num: String(n), path: p, data: DATA.articulos[String(n)] || null };
        ARTS.push(a); ART_BY_NUM[a.num] = a;
      }
    }
    (nodo.hijos || []).forEach(function (h) { expandir(h, p); });
  }
  DATA.estructura.forEach(function (t) { expandir(t, []); });
  ARTS.sort(function (a, b) { return (+a.num) - (+b.num); });
  ARTS.forEach(function (a, i) { a.idx = i; });

  // ---------- estado ----------
  var state = { art: null, fechaAl: hoyISO(), histOpen: false, versionSel: null, diff: false };

  // ---------- árbol lateral ----------
  var CHEV = '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l6 6-6 6"/></svg>';
  function treeHtml(nodo, lvl) {
    var h = '<details class="lvl-' + lvl + '" data-node="' + esc(nodo.id) + '"' + (lvl === 1 ? ' open' : '') + '><summary>' + CHEV + '<span><span class="nombre">' + esc(nodo.nombre) + '</span>';
    if (nodo.subtitulo) h += '<span class="sub">' + esc(nodo.subtitulo) + '</span>';
    h += '</span></summary>';
    if (nodo.articulos) {
      h += '<ul class="arts">';
      for (var n = nodo.articulos.desde; n <= nodo.articulos.hasta; n++) {
        var d = DATA.articulos[String(n)];
        var estado = d ? d.estado : 'pendiente';
        h += '<li data-num="' + n + '" data-texto="' + esc((d && d.tema ? d.tema : '') + ' artículo ' + n).toLowerCase() + '">' +
          '<a class="art-link ' + estado + '" href="#/art/' + n + '" data-num="' + n + '"' + (d ? '' : ' title="Pendiente de carga"') + '>' +
          '<i class="dot ' + estado + '"></i><span><span class="num">Artículo ' + numeroArt(n) + '</span>' +
          (d && d.tema ? '<span class="tema">' + esc(d.tema) + '</span>' : '') + '</span></a></li>';
      }
      h += '</ul>';
    }
    (nodo.hijos || []).forEach(function (c) { h += treeHtml(c, lvl + 1); });
    return h + '</details>';
  }
  function renderTree() {
    var tree = document.getElementById('tree');
    tree.innerHTML = DATA.estructura.map(function (t) { return treeHtml(t, 1); }).join('');
    document.getElementById('norma-title').textContent = NORMA.nombre;
    document.getElementById('norma-meta').textContent = 'Publicada en el DOF el ' + fmtFecha(NORMA.publicacion) + ' · en vigor desde el ' + fmtFecha(NORMA.vigencia_desde);
  }
  function marcarActivo(num) {
    var tree = document.getElementById('tree');
    tree.querySelectorAll('.art-link[aria-current]').forEach(function (a) { a.removeAttribute('aria-current'); });
    var link = tree.querySelector('.art-link[data-num="' + num + '"]');
    if (!link) return;
    link.setAttribute('aria-current', 'page');
    var det = link.closest('details');
    while (det) { det.open = true; det = det.parentElement.closest('details'); }
    if (!tree.classList.contains('filtering')) {
      var sb = document.getElementById('sidebar');
      var r = link.getBoundingClientRect(), s = sb.getBoundingClientRect();
      if (r.top < s.top || r.bottom > s.bottom) sb.scrollTop += (r.top - s.top) - s.height / 2;
    }
  }
  function filtrarArbol(q) {
    var tree = document.getElementById('tree');
    q = q.trim().toLowerCase();
    if (!q) {
      tree.classList.remove('filtering');
      tree.querySelectorAll('li.oculto').forEach(function (li) { li.classList.remove('oculto'); });
      tree.querySelectorAll('details.sin-coincidencias').forEach(function (d) { d.classList.remove('sin-coincidencias'); });
      if (state.art) marcarActivo(state.art);
      return;
    }
    tree.classList.add('filtering');
    var esNum = /^\d+$/.test(q);
    tree.querySelectorAll('li[data-num]').forEach(function (li) {
      var ok = esNum ? li.getAttribute('data-num').indexOf(q) === 0 : li.getAttribute('data-texto').indexOf(q) !== -1;
      li.classList.toggle('oculto', !ok);
    });
    tree.querySelectorAll('details').forEach(function (d) { d.open = true; });
    // oculta las ramas sin coincidencias (de dentro hacia fuera)
    var dets = Array.prototype.slice.call(tree.querySelectorAll('details')).reverse();
    dets.forEach(function (d) {
      var vivo = d.querySelector('li[data-num]:not(.oculto)');
      d.classList.toggle('sin-coincidencias', !vivo);
    });
  }

  // ---------- vigencia ----------
  function versionesDe(art) { return (art.data ? art.data.versiones.slice() : []).sort(cmpVersiones); }
  function versionVigenteAl(vers, fecha) {
    var sel = null;
    vers.forEach(function (v) { if (v.vigencia_desde && v.vigencia_desde <= fecha) sel = v; });
    return sel;
  }
  function rangoVigencia(v, corto) {
    if (!v.vigencia_desde) return 'Fecha de publicación pendiente de cotejo' + (v.fecha_sugerida ? ' (pista: DOF ' + fmtFecha(v.fecha_sugerida, corto) + ')' : '');
    if (!v.vigencia_hasta) return 'Vigente desde el ' + fmtFecha(v.vigencia_desde, corto);
    return 'Del ' + fmtFecha(v.vigencia_desde, corto) + ' al ' + fmtFecha(v.vigencia_hasta, corto);
  }
  // Marca discreta cuando la fecha de entrada en vigor no se ha cotejado con el decreto.
  function vigenciaMarca(v) {
    if (v.vigencia_verificada !== false) return '';
    return ' <span class="por-cotejar" title="' + esc(v.vigencia_nota || 'Entrada en vigor pendiente de cotejo con el decreto') + '">vigencia por cotejar</span>';
  }

  // ---------- render del texto ----------
  var ROMANOS = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  function valorRomano(s) {
    var t = 0;
    for (var i = 0; i < s.length; i++) { var v = ROMANOS[s[i]], w = ROMANOS[s[i + 1]] || 0; t += v < w ? -v : v; }
    return t;
  }
  // Clasifica cada párrafo (apartado A./B., fracción I./II., inciso a)/b)) de forma secuencial,
  // para distinguir "C." / "D." (apartados) de los numerales romanos.
  function clasificarParrafos(parrafos) {
    var sigFrac = 1, sigAp = 'A';
    return parrafos.map(function (p) {
      var rom = p.match(/^([IVXLCDM]+)\.\s/), ap = p.match(/^([A-Z])\.\s/);
      if (rom && valorRomano(rom[1]) === sigFrac) { sigFrac++; return 'fraccion'; }
      if (ap && ap[1] === sigAp) { sigAp = String.fromCharCode(sigAp.charCodeAt(0) + 1); sigFrac = 1; return 'apartado'; }
      if (rom) { sigFrac = valorRomano(rom[1]) + 1; return 'fraccion'; }
      if (ap) { sigAp = String.fromCharCode(ap[1].charCodeAt(0) + 1); sigFrac = 1; return 'apartado'; }
      if (/^[a-z]\)\s/.test(p)) return 'inciso';
      if (/^(Art(ículo|\.)\s+\d+)/.test(p) && p.length < 40) return 'encabezado';
      return '';
    });
  }
  function textoHtml(texto) {
    var parrafos = texto.split(/\n\s*\n/), clases = clasificarParrafos(parrafos);
    return parrafos.map(function (p, i) {
      return '<p' + (clases[i] ? ' class="' + clases[i] + '"' : '') + '>' + esc(p).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  // ---------- diff palabra por palabra (LCS) ----------
  function tokens(t) { return t.split(/(\s+)/).filter(Boolean); }
  function claveTok(t) { return /^\s+$/.test(t) ? (t.indexOf('\n\n') !== -1 ? '¶' : ' ') : t; }
  function diffTokens(a, b) {
    var ta = tokens(a), tb = tokens(b), n = ta.length, m = tb.length;
    if (n * m > 4000000) return null;
    var ka = ta.map(claveTok), kb = tb.map(claveTok);
    var W = m + 1, L = new Uint16Array((n + 1) * W);
    for (var i = n - 1; i >= 0; i--) {
      for (var j = m - 1; j >= 0; j--) {
        L[i * W + j] = ka[i] === kb[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
      }
    }
    var ops = []; i = 0; var jj = 0;
    function push(tipo, txt) {
      var last = ops[ops.length - 1];
      if (last && last[0] === tipo) last[1] += txt; else ops.push([tipo, txt]);
    }
    while (i < n && jj < m) {
      if (ka[i] === kb[jj]) { push('=', tb[jj]); i++; jj++; }
      else if (L[(i + 1) * W + jj] >= L[i * W + jj + 1]) { push('-', ta[i]); i++; }
      else { push('+', tb[jj]); jj++; }
    }
    while (i < n) { push('-', ta[i++]); }
    while (jj < m) { push('+', tb[jj++]); }
    return ops;
  }
  function diffInlineHtml(anterior, actual) {
    var ops = diffTokens(anterior, actual);
    if (!ops) return null;
    return ops.map(function (op) {
      var t = esc(op[1]);
      return op[0] === '=' ? t : op[0] === '+' ? '<ins>' + t + '</ins>' : '<del>' + t + '</del>';
    }).join('');
  }
  // Comparación por párrafos (alineación LCS) y, dentro de cada párrafo modificado, palabra por palabra.
  // Mantiene la estructura de párrafos y escala a artículos largos.
  function diffHtml(anterior, actual) {
    var pa = anterior.split(/\n\s*\n/), pb = actual.split(/\n\s*\n/);
    var normP = function (p) { return p.replace(/\s+/g, ' ').trim(); };
    var ka = pa.map(normP), kb = pb.map(normP);
    var n = pa.length, m = pb.length, W = m + 1, L = new Uint16Array((n + 1) * W);
    for (var i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) {
      L[i * W + j] = ka[i] === kb[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
    }
    var ops = []; i = 0; var jj = 0;
    while (i < n && jj < m) {
      if (ka[i] === kb[jj]) { ops.push({ t: '=', b: jj }); i++; jj++; }
      else if (L[(i + 1) * W + jj] >= L[i * W + jj + 1]) { ops.push({ t: '-', a: i }); i++; }
      else { ops.push({ t: '+', b: jj }); jj++; }
    }
    while (i < n) ops.push({ t: '-', a: i++ });
    while (jj < m) ops.push({ t: '+', b: jj++ });
    // Empareja borrados e inserciones contiguos como párrafos modificados.
    var items = [], k = 0;
    while (k < ops.length) {
      if (ops[k].t === '=') { items.push(ops[k]); k++; continue; }
      var dels = [], ins = [];
      while (k < ops.length && ops[k].t !== '=') { (ops[k].t === '-' ? dels : ins).push(ops[k]); k++; }
      var pares = Math.min(dels.length, ins.length);
      for (var q = 0; q < pares; q++) items.push({ t: '~', a: dels[q].a, b: ins[q].b });
      for (q = pares; q < dels.length; q++) items.push(dels[q]);
      for (q = pares; q < ins.length; q++) items.push(ins[q]);
    }
    var clA = clasificarParrafos(pa), clB = clasificarParrafos(pb);
    var br = function (s) { return s.replace(/\n/g, '<br>'); };
    return items.map(function (it) {
      if (it.t === '=') return '<p' + (clB[it.b] ? ' class="' + clB[it.b] + '"' : '') + '>' + br(esc(pb[it.b])) + '</p>';
      if (it.t === '+') return '<p class="diff-ins ' + clB[it.b] + '"><ins>' + br(esc(pb[it.b])) + '</ins></p>';
      if (it.t === '-') return '<p class="diff-del ' + clA[it.a] + '"><del>' + br(esc(pa[it.a])) + '</del></p>';
      var inner = diffInlineHtml(pa[it.a], pb[it.b]);
      if (inner === null) inner = '<del>' + br(esc(pa[it.a])) + '</del> <ins>' + br(esc(pb[it.b])) + '</ins>';
      return '<p class="diff-mod ' + clB[it.b] + '">' + br(inner) + '</p>';
    }).join('');
  }

  // ---------- enlace al decreto en el DOF (si la versión lo trae) ----------
  function dofLinkHtml(v) {
    if (v && typeof v.dof_url !== 'string' && typeof v.fuente_url === 'string' && /^https?:\/\//i.test(v.fuente_url)) {
      return '<span><a class="dof-link" href="' + esc(v.fuente_url) + '" target="_blank" rel="noopener noreferrer" title="Abre el texto consolidado oficial en una pestaña nueva">' + esc(v.fuente_etiqueta || 'Ver fuente oficial') + '</a></span>';
    }
    if (!v || typeof v.dof_url !== 'string' || !/^https?:\/\//i.test(v.dof_url)) return '';
    var texto = v.dof_etiqueta || 'Ver decreto en el DOF';
    return '<span><a class="dof-link" href="' + esc(v.dof_url) + '" target="_blank" rel="noopener noreferrer" title="Abre la publicación oficial en una pestaña nueva">' + esc(texto) +
      '<svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h5v5M16 4l-7 7M14 11v4a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4"/></svg></a></span>';
  }

  // ---------- render del artículo ----------
  function breadcrumbHtml(art) {
    var h = '<a href="#/art/1">' + esc(NORMA.siglas) + '</a>';
    art.path.forEach(function (n) {
      h += '<span class="sep">›</span><span title="' + esc(n.subtitulo || '') + '">' + esc(n.nombre) + (n.tipo !== 'titulo' && n.subtitulo ? ' — ' + esc(n.subtitulo) : '') + '</span>';
    });
    return h + '<span class="sep">›</span><b>Artículo ' + numeroArt(art.num) + '</b>';
  }

  function renderArticle() {
    var art = ART_BY_NUM[state.art];
    var box = document.getElementById('articulo');
    document.getElementById('breadcrumb').innerHTML = breadcrumbHtml(art);
    marcarActivo(art.num);
    document.title = 'Artículo ' + numeroArt(art.num) + ' — ' + NORMA.siglas + ' | Legislación MX';

    var capNode = art.path[art.path.length - 1];
    var hoy = hoyISO();
    var esHoy = state.fechaAl === hoy;

    if (!art.data) {
      box.innerHTML =
        '<div class="article-head"><h1>Artículo ' + numeroArt(art.num) + '</h1><span class="badge pendiente">Pendiente de carga</span></div>' +
        '<p class="tema">' + esc(capNode.nombre) + (capNode.subtitulo ? ' — ' + esc(capNode.subtitulo) : '') + '</p>' +
        '<div class="aviso pendiente">El texto de este artículo todavía no se ha cargado en el prototipo. La estructura de la Constitución es completa para poder navegar; el texto vigente y su historial se incorporarán desde las publicaciones del Diario Oficial de la Federación.</div>';
      document.getElementById('estado-vigencia').textContent = '';
      renderPrevNext(art);
      return;
    }

    var vers = versionesDe(art);
    var vig = versionVigenteAl(vers, state.fechaAl);
    var actual = vers[vers.length - 1];
    var mostrada = vig || actual;
    var esActual = mostrada === actual;
    var estadoBadge = art.data.estado === 'verificado'
      ? '<span class="badge verificado" title="Texto cotejado con fuentes oficiales">Verificado</span>'
      : art.data.estado === 'vigente'
      ? '<span class="badge historica" title="Las versiones anteriores se cargarán desde el DOF">Historial en construcción</span>'
      : art.data.estado === 'historial_parcial'
      ? '<span class="badge prototipo" title="El historial de la SCJN no coincide todavía con el texto vigente del consolidado">Historial por cotejar</span>'
      : '<span class="badge prototipo" title="Texto simulado, sólo para demostración">Prototipo</span>';
    var vigBadge = esActual
      ? '<span class="badge vigente">Vigente</span>'
      : '<span class="badge historica">Versión histórica</span>';

    var h = '<div class="article-head"><h1>Artículo ' + numeroArt(art.num) + '</h1>' + vigBadge + estadoBadge + '</div>';
    if (art.data.tema) h += '<p class="tema"><span class="tema-lbl" title="Etiqueta editorial, no forma parte del texto">Tema</span> ' + esc(art.data.tema) + '</p>';

    if (art.data.estado === 'historial_parcial') {
      h += '<div class="aviso prototipo"><b>Historial por cotejar.</b> ' + esc(art.data.nota || '') + '</div>';
    }
    if (art.data.estado === 'vigente') {
      h += '<div class="aviso info"><b>Texto vigente.</b> Historial en construcción: por ahora se muestra el texto del consolidado de la Cámara de Diputados; las versiones anteriores y los enlaces a cada decreto se cargarán desde el DOF.</div>';
    }
    if (art.data.estado === 'prototipo') {
      h += '<div class="aviso prototipo"><b>Artículo de prototipo.</b> El texto que sigue es <b>simulado</b> y las fechas de sus versiones son ilustrativas: sirven únicamente para probar la navegación, el historial y el diseño. No reproduce el texto constitucional.</div>';
    }
    if (!vig) {
      h += '<div class="aviso info">En la fecha consultada (' + fmtFecha(state.fechaAl) + ') este artículo no tenía vigencia. Se muestra la versión vigente actual; la Constitución entró en vigor el ' + fmtFecha(NORMA.vigencia_desde) + '.</div>';
    } else if (!esActual) {
      h += '<div class="aviso info">Estás leyendo el texto vigente al <b>' + fmtFecha(state.fechaAl) + '</b> (' + rangoVigencia(mostrada).toLowerCase() + '). <a href="#" data-accion="hoy">Ver la versión vigente hoy</a>.</div>';
    } else if (!esHoy) {
      h += '<div class="aviso info">Al ' + fmtFecha(state.fechaAl) + ' estaba vigente la misma versión que hoy.</div>';
    }

    h += '<div class="meta-line">' +
      '<span><b>' + esc(rangoVigencia(mostrada)) + '</b>' + vigenciaMarca(mostrada) + '</span>' +
      (mostrada.publicacion ? '<span>Publicación en el DOF: <b>' + fmtFecha(mostrada.publicacion) + '</b></span>' : '<span>Publicación en el DOF: <b>pendiente</b></span>') +
      (mostrada.capitulo ? '<span>Capítulo: <b>' + esc(mostrada.capitulo) + '</b></span>' : '') +
      '<span>' + (art.data.total_versiones || vers.length) + ' ' + ((art.data.total_versiones || vers.length) === 1 ? 'versión' : 'versiones') + '</span>' +
      dofLinkHtml(mostrada) +
      '</div>';
    h += '<div class="texto" id="texto-vigente">' + textoHtml(mostrada.texto) + '</div>';

    h += '<div class="actions">' +
      '<button class="btn" id="btn-historial" type="button" aria-expanded="' + (state.histOpen ? 'true' : 'false') + '" aria-controls="historial">' +
      '<svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l6 6 6-6"/></svg>' +
      '<span id="btn-historial-txt">' + (state.histOpen ? 'Ocultar historial' : 'Ver historial') + '</span><span class="count">' + (art.data.total_versiones || vers.length) + ' ' + ((art.data.total_versiones || vers.length) === 1 ? 'versión' : 'versiones') + '</span></button>' +
      '<button class="btn secondary" type="button" data-accion="copiar">Copiar enlace</button>' +
      '<button class="btn secondary" type="button" data-accion="imprimir">Imprimir</button>' +
      '</div>';

    h += '<section class="historial' + (state.histOpen ? ' open' : '') + '" id="historial" aria-label="Historial del artículo"><div class="historial-inner"><div class="historial-box">' +
      '<div class="hist-head"><h2>Historial del Artículo ' + numeroArt(art.num) + '</h2><p>' + (art.data.total_versiones || vers.length) + ' ' + ((art.data.total_versiones || vers.length) === 1 ? 'versión' : 'versiones') + ' · elige una para leer su texto íntegro</p></div>' +
      '<div class="hist-body"><ol class="versiones" id="lista-versiones"></ol><div class="ver-panel" id="ver-panel"></div></div>' +
      '</div></div></section>';

    box.innerHTML = h;
    document.getElementById('estado-vigencia').textContent = esActual
      ? (esHoy ? 'Mostrando el texto vigente hoy' : 'Vigente también al ' + fmtFecha(state.fechaAl, true))
      : 'Mostrando versión histórica';

    // estado del historial
    var historialPendiente = art.data.historial_url && vers.length < (art.data.total_versiones || 0);
    if (!state.versionSel || (!historialPendiente && !vers.some(function (v) { return v.id === state.versionSel; }))) {
      var idx = vers.indexOf(mostrada);
      state.versionSel = (idx > 0 ? vers[idx - 1] : mostrada).id;
    }
    renderVersiones(art, vers, mostrada);
    renderPrevNext(art);
  }

  function renderVersiones(art, vers, mostrada) {
    var ol = document.getElementById('lista-versiones');
    var actual = vers[vers.length - 1];
    ol.innerHTML = vers.slice().reverse().map(function (v, i, arr) {
      var esOriginal = v === vers[0];
      var tags = (v === actual ? '<span class="tag vig">Vigente</span>' : '') + (v === mostrada && v !== actual ? '<span class="tag cons">Consultada</span>' : '');
      return '<li><button class="ver-btn" type="button" data-version="' + esc(v.id) + '" aria-pressed="' + (v.id === state.versionSel ? 'true' : 'false') + '">' +
        '<span class="rango">' + esc(rangoVigencia(v, true)) + '</span>' +
        '<span class="sub">' + (v.tipo === 'fe_de_erratas' ? 'Fe de erratas · ' : v.tipo === 'aclaracion' ? 'Aclaración · ' : esOriginal ? 'Texto original · ' : 'Reforma · ') + (v.publicacion ? 'DOF ' + fmtFecha(v.publicacion, true) : 'fecha pendiente') + tags + '</span>' +
        '</button></li>';
    }).join('');
    renderVersionPanel(art, vers);
  }

  function renderVersionPanel(art, vers) {
    var panel = document.getElementById('ver-panel');
    var idx = -1;
    vers.forEach(function (v, i) { if (v.id === state.versionSel) idx = i; });
    if (idx < 0) { panel.innerHTML = ''; return; }
    var v = vers[idx], prev = idx > 0 ? vers[idx - 1] : null, actual = vers[vers.length - 1];
    var titulo = v === actual ? 'Versión vigente' : (idx === 0 ? 'Texto original' : 'Versión histórica');
    var rango = rangoVigencia(v).replace(/^Vigente desde el /, 'desde el ').replace(/^Del /, 'del ');
    var h = '<div class="ver-panel-head"><div><h3>' + titulo + ' — ' + esc(rango) + '</h3>' +
      '<div class="ver-meta"><span>Publicación en el DOF: <b>' + (v.publicacion ? fmtFecha(v.publicacion) : 'pendiente de cotejo') + '</b></span>' +
      '<span>Vigencia: <b>' + esc(rangoVigencia(v)) + '</b>' + vigenciaMarca(v) + '</span>' +
      (v.capitulo ? '<span>Capítulo: <b>' + esc(v.capitulo) + '</b></span>' : '') +
      (v.etiqueta ? '<span>Etiqueta: <b>' + esc(v.etiqueta) + '</b></span>' : '') +
      dofLinkHtml(v) + '</div></div>' +
      '<label class="diff-toggle"><input type="checkbox" id="diff-toggle"' + (state.diff && prev ? ' checked' : '') + (prev ? '' : ' disabled') + '> Resaltar cambios respecto a la versión anterior' + (prev ? '' : ' (no hay)') + '</label></div>';
    var cuerpo;
    if (state.diff && prev) {
      var d = diffHtml(prev.texto, v.texto);
      if (d) {
        cuerpo = '<div class="diff-leyenda"><span style="background:var(--ins-bg);color:var(--ins-fg)">texto añadido</span> · <span style="background:var(--del-bg);color:var(--del-fg)">texto suprimido</span> respecto a la versión ' + esc(rangoVigencia(prev, true).toLowerCase()) + '</div>' +
          '<div class="texto diff">' + d + '</div>';
      } else {
        cuerpo = '<div class="aviso info">El comparador no está disponible para textos tan extensos en este prototipo.</div><div class="texto">' + textoHtml(v.texto) + '</div>';
      }
    } else {
      cuerpo = '<div class="texto">' + textoHtml(v.texto) + '</div>';
    }
    panel.innerHTML = h + cuerpo;
  }

  function renderPrevNext(art) {
    var prev = ARTS[art.idx - 1], next = ARTS[art.idx + 1];
    document.getElementById('prevnext').innerHTML =
      (prev ? '<a class="prev" href="#/art/' + prev.num + '" rel="prev">‹ Artículo ' + numeroArt(prev.num) + '</a>' : '<span></span>') +
      (next ? '<a class="next" href="#/art/' + next.num + '" rel="next">Artículo ' + numeroArt(next.num) + ' ›</a>' : '<span></span>');
  }

  function renderLegal() {
    var f = (NORMA.fuentes || []).map(function (s) { return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.nombre) + '</a>'; }).join(' · ');
    document.getElementById('legal').innerHTML =
      '<p><b>Aviso.</b> ' + esc(NORMA.aviso) + '</p>' +
      (f ? '<p>Fuentes oficiales de referencia: ' + f + '.</p>' : '') +
      '<p>Fecha de consulta: ' + fmtHoyLargo() + '.</p>';
  }

  // ---------- historial ----------
  // Historial completo: se carga de historial/N.json al abrirlo (el embebido sólo trae la versión vigente).
  var HIST_CACHE = {};
  function cargarHistorial(art, cb) {
    var d = art.data;
    if (!d || !d.historial_url || d.versiones.length >= (d.total_versiones || 0)) { cb(true); return; }
    if (HIST_CACHE[art.num]) { d.versiones = HIST_CACHE[art.num]; cb(true); return; }
    if (location.protocol === 'file:' || typeof fetch !== 'function') { cb(false); return; }
    fetch(d.historial_url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { HIST_CACHE[art.num] = j.versiones; d.versiones = j.versiones; cb(true); })
      .catch(function () { cb(false); });
  }
  function setHistorial(open) {
    state.histOpen = open;
    var sec = document.getElementById('historial'), btn = document.getElementById('btn-historial');
    if (!sec || !btn) return;
    var art = ART_BY_NUM[state.art];
    if (open && art.data && art.data.historial_url && art.data.versiones.length < (art.data.total_versiones || 0)) {
      var ol = document.getElementById('lista-versiones');
      if (ol) ol.innerHTML = '<li class="cargando">Cargando historial…</li>';
      cargarHistorial(art, function (ok) {
        if (!state.histOpen || state.art !== art.num) return;
        if (ok) {
          // sin versión pedida en la URL, abre en la versión anterior a la mostrada (como antes de la carga perezosa)
          if (!state.versionPedida) state.versionSel = null;
          renderArticle(); setHistorial(true); escribirHash();
        }
        else if (ol) ol.innerHTML = '<li class="cargando">El historial completo se carga desde historial/' + esc(art.num) + '.json y requiere abrir el sitio desde un servidor web (por ejemplo, GitHub Pages).</li>';
      });
    }
    sec.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    document.getElementById('btn-historial-txt').textContent = open ? 'Ocultar historial' : 'Ver historial';
    if (open) {
      setTimeout(function () { sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 120);
    }
  }
  function seleccionarVersion(id) {
    state.versionSel = id;
    var art = ART_BY_NUM[state.art], vers = versionesDe(art);
    document.querySelectorAll('.ver-btn').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-version') === id ? 'true' : 'false'); });
    renderVersionPanel(art, vers);
    escribirHash();
  }

  // ---------- rutas (#/art/1, #/art/1/v/v2, ?al=AAAA-MM-DD) ----------
  function leerHash() {
    var hash = location.hash.replace(/^#\/?/, '');
    var q = {}, qi = hash.indexOf('?');
    if (qi !== -1) {
      hash.slice(qi + 1).split('&').forEach(function (kv) { var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); });
      hash = hash.slice(0, qi);
    }
    var m = hash.match(/^art\/(\d+)(?:\/v\/([\w-]+))?/);
    var num = m && ART_BY_NUM[m[1]] ? m[1] : (m ? null : ARTS[0].num);
    return { num: num, version: m ? m[2] : null, al: /^\d{4}-\d{2}-\d{2}$/.test(q.al || '') ? q.al : null, raw: hash };
  }
  var escribiendo = false, escribiendoPropio = false;
  function escribirHash() {
    var h = '#/art/' + state.art;
    if (state.histOpen && state.versionSel) h += '/v/' + state.versionSel;
    if (state.fechaAl !== hoyISO()) h += '?al=' + state.fechaAl;
    if (location.hash !== h) { escribiendo = true; escribiendoPropio = true; location.hash = h; setTimeout(function () { escribiendoPropio = false; }, 0); }
  }
  function aplicarRuta() {
    var r = leerHash();
    if (!r.num) { // ruta desconocida -> primer artículo
      location.replace('#/art/' + ARTS[0].num); return;
    }
    var cambioArt = r.num !== state.art;
    state.art = r.num;
    state.fechaAl = r.al || hoyISO();
    document.getElementById('fecha-al').value = state.fechaAl;
    state.versionPedida = !!r.version && !escribiendoPropio;
    if (r.version) { state.versionSel = r.version; state.histOpen = true; }
    else if (cambioArt) { state.versionSel = null; state.histOpen = false; state.diff = false; }
    var artActual = ART_BY_NUM[state.art];
    if ((r.version || state.fechaAl !== hoyISO()) && artActual.data && artActual.data.historial_url && artActual.data.versiones.length < (artActual.data.total_versiones || 0)) {
      cargarHistorial(artActual, function () { if (state.art === artActual.num) renderArticle(); });
    }
    renderArticle();
    if (cambioArt) {
      cerrarMenu();
      if (!r.version) window.scrollTo({ top: 0 });
    }
    if (r.version) setTimeout(function () { var s = document.getElementById('historial'); if (s) s.scrollIntoView({ block: 'start' }); }, 50);
  }

  // ---------- menú móvil ----------
  function abrirMenu() { document.body.classList.add('menu-open'); document.getElementById('menu-btn').setAttribute('aria-expanded', 'true'); }
  function cerrarMenu() { document.body.classList.remove('menu-open'); document.getElementById('menu-btn').setAttribute('aria-expanded', 'false'); }

  // ---------- toast ----------
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // ---------- eventos ----------
  document.getElementById('menu-btn').addEventListener('click', function () { document.body.classList.contains('menu-open') ? cerrarMenu() : abrirMenu(); });
  document.getElementById('backdrop').addEventListener('click', cerrarMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarMenu(); });

  document.getElementById('buscar').addEventListener('input', function (e) { filtrarArbol(e.target.value); });
  document.getElementById('buscar').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var q = e.target.value.trim(), destino = null;
    if (/^\d+$/.test(q) && ART_BY_NUM[q]) destino = q;
    else { var first = document.querySelector('#tree li[data-num]:not(.oculto) .art-link'); if (first) destino = first.getAttribute('data-num'); }
    if (destino) { e.target.value = ''; filtrarArbol(''); irA(destino); }
  });

  function cambiarFecha(iso) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    state.fechaAl = iso; state.versionSel = null;
    document.getElementById('fecha-al').value = iso;
    var artF = ART_BY_NUM[state.art];
    if (artF.data && artF.data.historial_url && artF.data.versiones.length < (artF.data.total_versiones || 0)) {
      cargarHistorial(artF, function () { if (state.art === artF.num) renderArticle(); });
    }
    renderArticle(); escribirHash();
    document.getElementById('articulo').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('fecha-al').addEventListener('change', function (e) { cambiarFecha(e.target.value); });
  document.getElementById('btn-hoy').addEventListener('click', function () { cambiarFecha(hoyISO()); });

  document.getElementById('articulo').addEventListener('click', function (e) {
    var btn = e.target.closest('#btn-historial');
    if (btn) { state.versionPedida = false; setHistorial(!state.histOpen); escribirHash(); return; }
    var vb = e.target.closest('.ver-btn');
    if (vb) { seleccionarVersion(vb.getAttribute('data-version')); return; }
    var acc = e.target.closest('[data-accion]');
    if (!acc) return;
    var a = acc.getAttribute('data-accion');
    if (a === 'copiar') {
      var url = location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { toast('Enlace copiado'); }, function () { toast(url); });
      else toast(url);
    } else if (a === 'imprimir') {
      window.print();
    } else if (a === 'hoy') {
      e.preventDefault();
      cambiarFecha(hoyISO());
    }
  });
  document.getElementById('articulo').addEventListener('change', function (e) {
    if (e.target.id === 'diff-toggle') { state.diff = e.target.checked; renderVersionPanel(ART_BY_NUM[state.art], versionesDe(ART_BY_NUM[state.art])); }
  });

  // Los enlaces internos a artículos conservan la fecha "vigente al" elegida.
  function irA(num) {
    var h = '#/art/' + num + (state.fechaAl !== hoyISO() ? '?al=' + state.fechaAl : '');
    if (location.hash === h) { aplicarRuta(); } else { location.hash = h; }
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#/art/"]');
    if (!a || a.classList.contains('disabled')) return;
    var m = a.getAttribute('href').match(/^#\/art\/(\d+)/);
    if (!m) return;
    e.preventDefault();
    irA(m[1]);
  });

  window.addEventListener('hashchange', function () {
    if (escribiendo) { escribiendo = false; return; }
    aplicarRuta();
  });

  // ---------- arranque ----------
  document.getElementById('consulta-fecha').textContent = fmtHoyLargo();
  document.getElementById('fecha-al').max = hoyISO();
  renderTree();
  renderLegal();
  aplicarRuta();
})();
</script>
</body>
</html>
