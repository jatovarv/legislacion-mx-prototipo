blicidad y objetividad serán principios rectores.\n\nEl Instituto Nacional Electoral será autoridad en la materia, independiente en sus decisiones y funcionamiento, y profesional en su desempeño; contará en su estructura con órganos de dirección, ejecutivos, técnicos y de vigilancia. El Consejo General será su órgano superior de dirección y se integrará por un consejero Presidente y diez consejeros electorales, y concurrirán, con voz pero sin voto, los consejeros del Poder Legislativo, los representantes de los partidos políticos y un Secretario Ejecutivo; la ley determinará las reglas para la organización y funcionamiento de los órganos, las relaciones de mando entre éstos, así como la relación con los organismos públicos locales. Los órganos ejecutivos y técnicos dispondrán del personal calificado necesario para el ejercicio de sus atribuciones. Un órgano interno de control tendrá a su cargo, con autonomía técnica y de gestión, la fiscalización de todos los ingresos y egresos del Instituto. Las disposiciones de la ley electoral y del Estatuto que con base en ella apruebe el Consejo General, regirán las relaciones de trabajo con los servidores del organismo público. Los órganos de vigilancia del padrón electoral se integrarán mayoritariamente por representantes de los partidos políticos nacionales. Las mesas directivas de casilla estarán integradas por ciudadanos.\n\nLas sesiones de todos los órganos colegiados de dirección serán públicas en los términos que señale la ley.\n\nEl Instituto contará con una oficialía electoral investida de fé pública para actos de naturaleza electoral, cuyas atribuciones y funcionamiento serán reguladas por la ley.\n\nEl consejero Presidente y los consejeros electorales durarán en su cargo nueve años y no podrán ser reelectos. Serán electos por el voto de las dos terceras partes de los miembros presentes de la Cámara de Diputados, mediante el siguiente procedimiento:\n\na) La Cámara de Diputados emitirá el acuerdo para la elección del consejero Presidente y los consejeros electorales, que contendrá la convocatoria pública, las etapas completas para el procedimiento, sus fechas límites y plazos improrrogables, así como el proceso para la designación de un comité técnico de evaluación, integrado por cinco personas de reconocido prestigio, de las cuales tres serán nombradas por el órgano de dirección política de la Cámara de Diputados y dos por la Comisión Nacional de los Derechos Humanos;\n\nb) El comité recibirá la lista completa de los aspirantes que concurran a la convocatoria pública, evaluará el cumplimiento de los requisitos constitucionales y legales, así como su idoneidad para desempeñar el cargo; seleccionará a los mejor evaluados en una proporción de cinco personas por cada cargo vacante, y remitirá la relación correspondiente al órgano de dirección política de la Cámara de Diputados;\n\nc) El órgano de dirección política impulsará la construcción de los acuerdos para la elección del consejero Presidente y los consejeros electorales, a fin de que una vez realizada la votación por este órgano en los términos de la ley, se remita al Pleno de la Cámara la propuesta con las designaciones correspondientes;\n\nd) Vencido el plazo que para el efecto se establezca en el acuerdo a que se refiere el inciso a), sin que el órgano de dirección política de la Cámara haya realizado la votación o remisión previstas en el inciso anterior, o habiéndolo hecho, no se alcance la votación requerida en el Pleno, se deberá convocar a éste a una sesión en la que se realizará la elección mediante insaculación de la lista conformada por el comité de evaluación;\n\ne) Al vencimiento del plazo fijado en el acuerdo referido en el inciso a), sin que se hubiere concretado la elección en los términos de los incisos c) y d), el Pleno de la Suprema Corte de Justicia de la Nación realizará, en sesión pública, la designación mediante insaculación de la lista conformada por el comité de evaluación.\n\nDe darse la falta absoluta del consejero Presidente o de cualquiera de los consejeros electorales durante los primeros seis años de su encargo, se elegirá un sustituto para concluir el período de la vacante. Si la falta ocurriese dentro de los últimos tres años, se elegirá a un consejero para un nuevo periodo.\n\nEl consejero Presidente y los consejeros electorales no podrán tener otro empleo, cargo o comisión, con excepción de aquellos en que actúen en representación del Consejo General y los no remunerados que desempeñen en asociaciones docentes, científicas, culturales, de investigación o de beneficencia.\n\nEl titular del órgano interno de control del Instituto será designado por la Cámara de Diputados con el voto de las dos terceras partes de sus miembros presentes a propuesta de instituciones públicas de educación superior, en la forma y términos que determine la ley. Durará seis años en el cargo y podrá ser reelecto por una sola vez. Estará adscrito administrativamente a la presidencia del Consejo General y mantendrá la coordinación técnica necesaria con la Auditoría Superior de la Federación.\n\nEl Secretario Ejecutivo será nombrado con el voto de las dos terceras partes del Consejo General a propuesta de su Presidente.\n\nLa ley establecerá los requisitos que deberán reunir para su designación el consejero Presidente del Consejo General, los consejeros electorales, el titular del órgano interno de control y el Secretario Ejecutivo del Instituto Nacional Electoral. Quienes hayan fungido como consejero Presidente, consejeros electorales y Secretario Ejecutivo no podrán desempeñar cargos en los poderes públicos en cuya elección hayan participado, de dirigencia partidista, ni ser postulados a cargos de elección popular, durante los dos años siguientes a la fecha de conclusión de su encargo.\n\nLos consejeros del Poder Legislativo serán propuestos por los grupos parlamentarios con afiliación de partido en alguna de las Cámaras. Sólo habrá un consejero por cada grupo parlamentario no obstante su reconocimiento en ambas Cámaras del Congreso de la Unión.\n\nApartado B. Corresponde al Instituto Nacional Electoral en los términos que establecen esta Constitución y las leyes:\n\na) Para los procesos electorales federales y locales:\n\n1. La capacitación electoral;\n\n2. La geografía electoral, así como el diseño y determinación de los distritos electorales y división del territorio en secciones electorales;\n\n3. El padrón y la lista de electores;\n\n4. La ubicación de las casillas y la designación de los funcionarios de sus mesas directivas;\n\n5. Las reglas, lineamientos, criterios y formatos en materia de resultados preliminares; encuestas o sondeos de opinión; observación electoral; conteos rápidos; impresión de documentos y producción de materiales electorales;\n\n6. La fiscalización de los ingresos y egresos de los partidos políticos y candidatos, y\n\n7. Las demás que determine la ley.\n\nb) Para los procesos electorales federales:\n\n1. Los derechos y el acceso a las prerrogativas de los candidatos y partidos políticos;\n\n2. La preparación de la jornada electoral;\n\n3. La impresión de documentos y la producción de materiales electorales;\n\n4. Los escrutinios y cómputos en los términos que señale la ley;\n\n5. La declaración de validez y el otorgamiento de constancias en las elecciones de diputados y senadores;\n\n6. El cómputo de la elección de Presidente de los Estados Unidos Mexicanos en cada uno de los distritos electorales uninominales, y\n\n7. Las demás que determine la ley.\n\nc) Para los procesos de revocación de mandato, en los términos del artículo 35, fracción IX, el Instituto Nacional Electoral deberá realizar aquellas funciones que correspondan para su debida implementación.\n\nEl Instituto Nacional Electoral asumirá mediante convenio con las autoridades competentes de las entidades federativas que así lo soliciten la organización de procesos electorales, de consulta popular y de revocación de mandato en el ámbito de aquéllas, en los términos que disponga su Constitución y la legislación aplicable. A petición de los partidos políticos y con cargo a sus prerrogativas, en los términos que establezca la ley, podrá organizar las elecciones de sus dirigentes.\n\nLa fiscalización de las finanzas de los partidos políticos y de las campañas de los candidatos estará a cargo del Consejo General del Instituto Nacional Electoral. La ley desarrollará las atribuciones del Consejo para la realización de dicha función, así como la definición de los órganos técnicos dependientes del mismo, responsables de realizar las revisiones e instruir los procedimientos para la aplicación de las sanciones correspondientes. En el cumplimiento de sus atribuciones, el Consejo General no estará limitado por los secretos bancario, fiduciario y fiscal, y contará con el apoyo de las autoridades federales y locales.\n\nEn caso de que el Instituto Nacional Electoral delegue la función de fiscalización, su órgano técnico será el conducto para superar la limitación a que se refiere el párrafo anterior.\n\nApartado C. En las entidades federativas, las elecciones locales y, en su caso, las consultas populares y los procesos de revocación de mandato, estarán a cargo de organismos públicos locales en los términos de esta Constitución, que ejercerán funciones en las siguientes materias:\n\n1. Derechos y el acceso a las prerrogativas de los candidatos y partidos políticos;\n\n2. Educación cívica;\n\n3. Preparación de la jornada electoral;\n\n4. Impresión de documentos y la producción de materiales electorales;\n\n5. Escrutinios y cómputos en los términos que señale la ley;\n\n6. Declaración de validez y el otorgamiento de constancias en las elecciones locales;\n\n7. Cómputo de la elección del titular del poder ejecutivo;\n\n8. Resultados preliminares; encuestas o sondeos de opinión; observación electoral, y conteos rápidos, conforme a los lineamientos establecidos en el Apartado anterior;\n\n9. Organización, desarrollo, cómputo y declaración de resultados en los mecanismos de participación ciudadana que prevea la legislación local;\n\n10. Todas las no reservadas al Instituto Nacional Electoral, y\n\n11. Las que determine la ley.\n\nEn los supuestos que establezca la ley y con la aprobación de una mayoría de cuando menos ocho votos del Consejo General, el Instituto Nacional Electoral podrá:\n\na) Asumir directamente la realización de las actividades propias de la función electoral que corresponden a los órganos electorales locales;\n\nb) Delegar en dichos órganos electorales las atribuciones a que se refiere el inciso a) del Apartado B de esta Base, sin perjuicio de reasumir su ejercicio directo en cualquier momento, o\n\nc) Atraer a su conocimiento cualquier asunto de la competencia de los órganos electorales locales, cuando su trascendencia así lo amerite o para sentar un criterio de interpretación.\n\nCorresponde al Instituto Nacional Electoral designar y remover a los integrantes del órgano superior de dirección de los organismos públicos locales, en los términos de esta Constitución.\n\nApartado D. El Servicio Profesional Electoral Nacional comprende la selección, ingreso, capacitación, profesionalización, promoción, evaluación, rotación, permanencia y disciplina, de los servidores públicos de los órganos ejecutivos y técnicos del Instituto Nacional Electoral y de los organismos públicos locales de las entidades federativas en materia electoral. El Instituto Nacional Electoral regulará la organización y funcionamiento de este Servicio.\n\nVI. Para garantizar los principios de constitucionalidad y legalidad de los actos y resoluciones electorales, incluidos los relativos a los procesos de consulta popular y de revocación de mandato, se establecerá un sistema de medios de impugnación en los términos que señalen esta Constitución y la ley. Dicho sistema dará definitividad a las distintas etapas de los procesos electorales, de consulta popular y de revocación de mandato, y garantizará la protección de los derechos políticos de los ciudadanos de votar, ser votados y de asociación, en los términos del artículo 99 de esta Constitución.\n\nEn materia electoral la interposición de los medios de impugnación, constitucionales o legales, no producirá efectos suspensivos sobre la resolución o el acto impugnado.\n\nLa ley establecerá el sistema de nulidades de las elecciones federales o locales por violaciones graves, dolosas y determinantes en los siguientes casos:\n\na) Se exceda el gasto de campaña en un cinco por ciento del monto total autorizado;\n\nb) Se compre o adquiera cobertura informativa o tiempos en radio y televisión, fuera de los supuestos previstos en la ley;\n\nc) Se reciban o utilicen recursos de procedencia ilícita o recursos públicos en las campañas.\n\nd) Se acrediten actos de intervención o injerencia extranjera que influyan en los resultados electorales.\n\nDichas violaciones deberán acreditarse de manera objetiva y material. Se presumirá que las violaciones son determinantes cuando la diferencia entre la votación obtenida entre el primero y el segundo lugar sea menor al cinco por ciento.\n\nEn caso de nulidad de la elección, se convocará a una elección extraordinaria, en la que no podrá participar la persona sancionada.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":17,"historial_url":"historial/41.json"},"42":{"numero":"42","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 20-01-1960)","publicacion":"1960-01-20","vigencia_desde":"1960-01-21","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 42. El territorio nacional comprende:\n\nI. El de las partes integrantes de la Federación;\n\nII. El de las islas, incluyendo los arrecifes y cayos en los mares adyacentes;\n\nIII. El de las islas de Guadalupe y las de Revillagigedo situadas en el Océano Pacífico;\n\nIV. La plataforma continental y los zócalos submarinos de las islas, cayos y arrecifes;\n\nV. Las aguas de los mares territoriales en la extensión y términos que fija el Derecho Internacional y las marítimas interiores;\n\nVI. El espacio situado sobre el territorio nacional, con la extensión y modalidades que establezca el propio Derecho Internacional.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/42.json"},"43":{"numero":"43","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v10","tipo":"vigente","etiqueta":"Vigente (post 17-05-2021)","publicacion":"2021-05-17","vigencia_desde":"2021-05-18","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 43. Las partes integrantes de la Federación son los Estados de Aguascalientes, Baja California, Baja California Sur, Campeche, Coahuila de Zaragoza, Colima, Chiapas, Chihuahua, Durango, Guanajuato, Guerrero, Hidalgo, Jalisco, México, Michoacán de Ocampo, Morelos, Nayarit, Nuevo León, Oaxaca, Puebla, Querétaro, Quintana Roo, San Luis Potosí, Sinaloa, Sonora, Tabasco, Tamaulipas, Tlaxcala, Veracruz de Ignacio de la Llave, Yucatán y Zacatecas; así como la Ciudad de México.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":10,"historial_url":"historial/43.json"},"44":{"numero":"44","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 44. La Ciudad de México es la entidad federativa sede de los Poderes de la Unión y Capital de los Estados Unidos Mexicanos; se compondrá del territorio que actualmente tiene y, en caso de que los poderes federales se trasladen a otro lugar, se erigirá en un Estado de la Unión con la denominación de Ciudad de México.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/44.json"},"45":{"numero":"45","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 08-10-1974)","publicacion":"1974-10-08","vigencia_desde":"1974-10-09","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 45. Los Estados de la Federación conservan la extensión y límites que hasta hoy han tenido, siempre que no haya dificultad en cuanto a éstos.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/45.json"},"46":{"numero":"46","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v4","tipo":"vigente","etiqueta":"Vigente (post 15-10-2012)","publicacion":"2012-10-15","vigencia_desde":"2012-10-16","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 46. Las entidades federativas pueden arreglar entre sí y en cualquier momento, por convenios amistosos, sus respectivos límites; pero no se llevarán a efecto esos arreglos sin la aprobación de la Cámara de Senadores.\n\nDe no existir el convenio a que se refiere el párrafo anterior, y a instancia de alguna de las partes en conflicto, la Suprema Corte de Justicia de la Nación conocerá, sustanciará y resolverá con carácter de inatacable, las controversias sobre límites territoriales que se susciten entre las entidades federativas, en los términos de la fracción I del artículo 105 de esta Constitución.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/46.json"},"47":{"numero":"47","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 47. El Estado del (sic DOF 05-02-1917) Nayarit tendrá la extensión territorial y límites que comprende actualmente el Territorio de Tepic.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/47.json"},"48":{"numero":"48","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 20-01-1960)","publicacion":"1960-01-20","vigencia_desde":"1960-01-21","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De las Partes Integrantes de la Federación y del Territorio Nacional","texto":"Artículo 48. Las islas, los cayos y arrecifes de los mares adyacentes que pertenezcan al territorio nacional, la plataforma continental, los zócalos submarinos de las islas, de los cayos y arrecifes, los mares territoriales, las aguas marítimas interiores y el espacio situado sobre el territorio nacional, dependerán directamente del Gobierno de la Federación, con excepción de aquellas islas sobre las que hasta la fecha hayan ejercido jurisdicción los Estados.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/48.json"},"49":{"numero":"49","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 28-03-1951)","publicacion":"1951-03-28","vigencia_desde":"1951-03-29","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la División de Poderes","texto":"Artículo 49. El Supremo Poder de la Federación se divide para su ejercicio en Legislativo, Ejecutivo y Judicial.\n\nNo podrán reunirse dos o más de estos Poderes en una sola persona o corporación, ni depositarse el Legislativo en un individuo, salvo el caso de facultades extraordinarias al Ejecutivo de la Unión, conforme a lo dispuesto en el artículo 29. En ningún otro caso, salvo lo dispuesto en el segundo párrafo del artículo 131, se otorgarán facultades extraordinarias para legislar.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/49.json"},"50":{"numero":"50","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"Del Poder Legislativo","texto":"Artículo 50. El poder legislativo de los Estados Unidos Mexicanos se deposita en un Congreso general, que se dividirá en dos Cámaras, una de diputados y otra de senadores.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/50.json"},"51":{"numero":"51","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 06-12-1977)","publicacion":"1977-12-06","vigencia_desde":"1977-12-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 51. La Cámara de Diputados se compondrá de representantes de la Nación, electos en su totalidad cada tres años. Por cada diputado propietario, se elegirá un suplente.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/51.json"},"52":{"numero":"52","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v10","tipo":"vigente","etiqueta":"Vigente (post 06-06-2019)","publicacion":"2019-06-06","vigencia_desde":"2019-06-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 52. La Cámara de Diputados estará integrada por 300 diputadas y diputados electos según el principio de votación mayoritaria relativa, mediante el sistema de distritos electorales uninominales, así como por 200 diputadas y diputados que serán electos según el principio de representación proporcional, mediante el Sistema de Listas Regionales, votadas en circunscripciones plurinominales.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":10,"historial_url":"historial/52.json"},"53":{"numero":"53","estado":"historial_parcial","nota":"El PDF «Historia del texto» de la SCJN de este artículo está organizado por fragmentos (fracciones o apartados), no por versiones íntegras del artículo: 3 de 5 cortes no empiezan con «Artículo 53». El historial requiere un separador específico; por ahora se muestra sólo el texto vigente del consolidado de la Cámara de Diputados.","versiones":[{"id":"vig","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2019-06-06","vigencia_desde":"2019-06-07","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 53. La demarcación territorial de los 300 distritos electorales uninominales será la que resulte de dividir la población total del país entre los distritos señalados. La distribución de los distritos electorales uninominales entre las entidades federativas se hará teniendo en cuenta el último censo general de población, sin que en ningún caso la representación de una entidad federativa pueda ser menor de dos diputados o diputadas de mayoría.\n\nPara la elección de los 200 diputados y diputadas según el principio de representación proporcional y el Sistema de Listas Regionales, se constituirán cinco circunscripciones electorales plurinominales en el país conformadas de acuerdo con el principio de paridad, y encabezadas alternadamente entre mujeres y hombres cada periodo electivo. La Ley determinará la forma de establecer la demarcación territorial de estas circunscripciones.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN (00_historia.pdf) — estructura por fragmentos; pendiente","total_versiones":1,"historial_url":"historial/53.json"},"54":{"numero":"54","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v9","tipo":"vigente","etiqueta":"Vigente (post 10-02-2014)","publicacion":"2014-02-10","vigencia_desde":"2014-02-11","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 54. La elección de los 200 diputados según el principio de representación proporcional y el sistema de asignación por listas regionales, se sujetará a las siguientes bases y a lo que disponga la ley:\n\nI. Un partido político, para obtener el registro de sus listas regionales, deberá acreditar que participa con candidatos a diputados por mayoría relativa en por lo menos doscientos distritos uninominales;\n\nII. Todo partido político que alcance por lo menos el tres por ciento del total de la votación válida emitida para las listas regionales de las circunscripciones plurinominales, tendrá derecho a que le sean atribuidos diputados según el principio de representación proporcional;\n\nIII. Al partido político que cumpla con las dos bases anteriores, independiente y adicionalmente a las constancias de mayoría relativa que hubiesen obtenido sus candidatos, le serán asignados por el principio de representación proporcional, de acuerdo con su votación nacional emitida, el número de diputados de su lista regional que le corresponda en cada circunscripción plurinominal. En la asignación se seguirá el orden que tuviesen los candidatos en las listas correspondientes.\n\nIV. Ningún partido político podrá contar con más de 300 diputados por ambos principios.\n\nV. En ningún caso, un partido político podrá contar con un número de diputados por ambos principios que representen un porcentaje del total de la Cámara que exceda en ocho puntos a su porcentaje de votación nacional emitida. Esta base no se aplicará al partido político que, por sus triunfos en distritos uninominales, obtenga un porcentaje de curules del total de la Cámara, superior a la suma del porcentaje de su votación nacional emitida más el ocho por ciento; y\n\nVI. En los términos de lo establecido en las fracciones III, IV y V anteriores, las diputaciones de representación proporcional que resten después de asignar las que correspondan al partido político que se halle en los supuestos de las fracciones IV o V, se adjudicarán a los demás partidos políticos con derecho a ello en cada una de las circunscripciones plurinominales, en proporción directa con las respectivas votaciones nacionales efectivas de estos últimos. La ley desarrollará las reglas y fórmulas para estos efectos.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":9,"historial_url":"historial/54.json"},"55":{"numero":"55","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v12","tipo":"vigente","etiqueta":"Vigente (post 01-04-2025)","publicacion":"2025-04-01","vigencia_desde":"2025-04-02","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 55. Para ser diputado se requiere:\n\nI. Ser ciudadano mexicano, por nacimiento, en el ejercicio de sus derechos.\n\nII. Tener dieciocho años cumplidos el día de la elección;\n\nIII. Ser originario de la entidad federativa en que se haga la elección o vecino de esta con residencia efectiva de más de seis meses anteriores a la fecha de ella.\n\nPara poder figurar en las listas de las circunscripciones electorales plurinominales como candidato a diputado, se requiere ser originario de alguna de las entidades federativas que comprenda la circunscripción en la que se realice la elección, o vecino de ella con residencia efectiva de más de seis meses anteriores a la fecha en que la misma se celebre.\n\nLa vecindad no se pierde por ausencia en el desempeño de cargos públicos de elección popular.\n\nIV. No estar en servicio activo en el Ejército, Fuerza Aérea, Armada o Guardia Nacional, ni tener mando en la policía o gendarmería rural en el Distrito donde se haga la elección, cuando menos noventa días antes de ella.\n\nV. No ser titular de alguno de los organismos a los que esta Constitución otorga autonomía, ni ser Secretario o Subsecretario de Estado, ni titular de alguno de los organismos descentralizados o desconcentrados de la administración pública federal, a menos que se separe definitivamente de sus funciones 90 días antes del día de la elección.\n\nNo ser Ministro de la Suprema Corte de Justicia de la Nación, ni Magistrado, ni Secretario del Tribunal Electoral del Poder Judicial de la Federación, ni Consejero Presidente o consejero electoral en los consejos General, locales o distritales del Instituto Nacional Electoral, ni Secretario Ejecutivo, Director Ejecutivo o personal profesional directivo del propio Instituto, salvo que se hubiere separado de su encargo, de manera definitiva, tres años antes del día de la elección.\n\nLos Gobernadores de los Estados y el Jefe de Gobierno de la Ciudad de México no podrán ser electos en las entidades de sus respectivas jurisdicciones durante el periodo de su encargo, aun cuando se separen definitivamente de sus puestos.\n\nLos Secretarios del Gobierno de las entidades federativas, los Magistrados y Jueces Federales y locales, así como los Presidentes Municipales y Alcaldes en el caso de la Ciudad de México, no podrán ser electos en las entidades de sus respectivas jurisdicciones, si no se separan definitivamente de sus cargos noventa días antes del día de la elección;\n\nVI. No ser persona ministra de algún culto religioso;\n\nVII. No estar comprendido en alguno de los impedimentos que señala el artículo 59 de esta Constitución, y\n\nVIII. No tener o haber tenido en los últimos tres años anteriores al día de la elección un vínculo de matrimonio o concubinato o unión de hecho, o de parentesco por consanguinidad o civil en línea recta sin limitación de grado y en línea colateral hasta el cuarto grado o de afinidad hasta el segundo grado, con la persona que está ejerciendo la titularidad de la diputación.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":12,"historial_url":"historial/55.json"},"56":{"numero":"56","estado":"historial_parcial","nota":"El PDF «Historia del texto» de la SCJN de este artículo está organizado por fragmentos (fracciones o apartados), no por versiones íntegras del artículo: 3 de 7 cortes no empiezan con «Artículo 56». El historial requiere un separador específico; por ahora se muestra sólo el texto vigente del consolidado de la Cámara de Diputados.","versiones":[{"id":"vig","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2019-06-06","vigencia_desde":"2019-06-07","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 56. La Cámara de Senadores se integrará por ciento veintiocho senadoras y senadores, de los cuales, en cada Estado y en la Ciudad de México, dos serán elegidos según el principio de votación mayoritaria relativa y uno será asignado a la primera minoría. Para estos efectos, los partidos políticos deberán registrar una lista con dos fórmulas de candidatos. La senaduría de primera minoría le será asignada a la fórmula de candidaturas que encabece la lista del partido político que, por sí mismo, haya ocupado el segundo lugar en número de votos en la entidad de que se trate.\n\nLas treinta y dos senadurías restantes serán elegidas según el principio de representación proporcional, mediante el sistema de listas votadas en una sola circunscripción plurinominal nacional, conformadas de acuerdo con el principio de paridad, y encabezadas alternadamente entre mujeres y hombres cada periodo electivo. La ley establecerá las reglas y fórmulas para estos efectos.\n\nLa Cámara de Senadores se renovará en su totalidad cada seis años.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN (00_historia.pdf) — estructura por fragmentos; pendiente","total_versiones":1,"historial_url":"historial/56.json"},"57":{"numero":"57","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 57. Por cada senador propietario se elegirá un suplente.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/57.json"},"58":{"numero":"58","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v4","tipo":"vigente","etiqueta":"Vigente (post 29-07-1999)","publicacion":"1999-07-29","vigencia_desde":"1999-07-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 58. Para ser senador se requieren los mismos requisitos que para ser diputado, excepto el de la edad, que será la de 25 años cumplidos el día de la elección.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/58.json"},"59":{"numero":"59","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v4","tipo":"vigente","etiqueta":"Vigente (post 01-04-2025)","publicacion":"2025-04-01","vigencia_desde":"2025-04-02","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 59. Las personas senadoras y diputadas al Congreso de la Unión no podrán ser reelectas para el periodo inmediato posterior al ejercicio de su mandato.\n\nLas personas senadoras y diputadas suplentes podrán ser electas para el período inmediato con el carácter de propietarias, siempre que no hubieren estado en ejercicio; pero las personas senadoras y diputadas propietarias no podrán ser electas para el período inmediato con el carácter de suplentes.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/59.json"},"60":{"numero":"60","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 22-08-1996)","publicacion":"1996-08-22","vigencia_desde":"1996-08-23","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 60. El organismo público previsto en el artículo 41 de esta Constitución, de acuerdo con lo que disponga la ley, declarará la validez de las elecciones de diputados y senadores en cada uno de los distritos electorales uninominales y en cada una de las entidades federativas; otorgará las constancias respectivas a las fórmulas de candidatos que hubiesen obtenido mayoría de votos y hará la asignación de senadores de primera minoría de conformidad con lo dispuesto en el artículo 56 de esta Constitución y en la ley. Asimismo, hará la declaración de validez y la asignación de diputados según el principio de representación proporcional de conformidad con el artículo 54 de esta Constitución y la ley.\n\nLas determinaciones sobre la declaración de validez, el otorgamiento de las constancias y la asignación de diputados o senadores podrán ser impugnadas ante las salas regionales del Tribunal Electoral del Poder Judicial de la Federación, en los términos que señale la ley.\n\nLas resoluciones de las salas a que se refiere el párrafo anterior, podrán ser revisadas exclusivamente por la Sala Superior del propio Tribunal, a través del medio de impugnación que los partidos políticos podrán interponer únicamente cuando por los agravios esgrimidos se pueda modificar el resultado de la elección. Los fallos de la Sala serán definitivos e inatacables. La ley establecerá los presupuestos, requisitos de procedencia y el trámite para este medio de impugnación.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/60.json"},"61":{"numero":"61","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 06-12-1977)","publicacion":"1977-12-06","vigencia_desde":"1977-12-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 61. Los diputados y senadores son inviolables por las opiniones que manifiesten en el desempeño de sus cargos, y jamás podrán ser reconvenidos por ellas.\n\nEl Presidente de cada Cámara velará por el respeto al fuero constitucional de los miembros de la misma y por la inviolabilidad del recinto donde se reúnan a sesionar.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/61.json"},"62":{"numero":"62","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 62. Los diputados y senadores propietarios durante el período de su encargo, no podrán desempeñar ninguna otra comisión o empleo de la Federación o de las entidades federativas por los cuales se disfrute sueldo, sin licencia previa de la Cámara respectiva; pero entonces cesarán en sus funciones representativas, mientras dure la nueva ocupación. La misma regla se observará con los diputados y senadores suplentes, cuando estuviesen en ejercicio. La infracción de esta disposición será castigada con la pérdida del carácter de diputado o senador.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/62.json"},"63":{"numero":"63","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v4","tipo":"vigente","etiqueta":"Vigente (post 29-10-2003)","publicacion":"2003-10-29","vigencia_desde":"2003-10-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 63. Las Cámaras no pueden abrir sus sesiones ni ejercer su cargo sin la concurrencia, en cada una de ellas, de más de la mitad del número total de sus miembros; pero los presentes de una y otra deberán reunirse el día señalado por la ley y compeler a los ausentes a que concurran dentro de los treinta días siguientes, con la advertencia de que si no lo hiciesen se entenderá por ese solo hecho, que no aceptan su encargo, llamándose luego a los suplentes, los que deberán presentarse en un plazo igual, y si tampoco lo hiciesen, se declarará vacante el puesto. Tanto las vacantes de diputados y senadores del Congreso de la Unión que se presenten al inicio de la legislatura, como las que ocurran durante su ejercicio, se cubrirán: la vacante de diputados y senadores del Congreso de la Unión por el principio de mayoría relativa, la Cámara respectiva convocará a elecciones extraordinarias de conformidad con lo que dispone la fracción IV del artículo 77 de esta Constitución; la vacante de miembros de la Cámara de Diputados electos por el principio de representación proporcional, será cubierta por la fórmula de candidatos del mismo partido que siga en el orden de la lista regional respectiva, después de habérsele asignado los diputados que le hubieren correspondido; la vacante de miembros de la Cámara de Senadores electos por el principio de representación proporcional, será cubierta por aquella fórmula de candidatos del mismo partido que siga en el orden de lista nacional, después de habérsele asignado los senadores que le hubieren correspondido; y la vacante de miembros de la Cámara de Senadores electos por el principio de primera minoría, será cubierta por la fórmula de candidatos del mismo partido que para la entidad federativa de que se trate se haya registrado en segundo lugar de la lista correspondiente.\n\nSe entiende también que los diputados o senadores que falten diez días consecutivos, sin causa justificada o sin previa licencia del presidente de su respectiva Cámara, con la cual se dará conocimiento a ésta, renuncian a concurrir hasta el período inmediato, llamándose desde luego a los suplentes.\n\nSi no hubiese quórum para instalar cualquiera de las Cámaras o para que ejerzan sus funciones una vez instaladas, se convocará inmediatamente a los suplentes para que se presenten a la mayor brevedad a desempeñar su cargo, entre tanto transcurren los treinta días de que antes se habla.\n\nIncurrirán en responsabilidad, y se harán acreedores a las sanciones que la ley señale, quienes habiendo sido electos diputados o senadores, no se presenten, sin causa justificada a juicio de la Cámara respectiva, a desempeñar el cargo dentro del plazo señalado en el primer párrafo de este artículo. También incurrirán en responsabilidad, que la misma ley sancionará, los Partidos Políticos Nacionales que habiendo postulado candidatos en una elección para diputados o senadores, acuerden que sus miembros que resultaren electos no se presenten a desempeñar sus funciones.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/63.json"},"64":{"numero":"64","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 64. Los diputados y senadores que no concurran a una sesión, sin causa justificada o sin permiso de la Cámara respectiva, no tendrán derecho a la dieta correspondiente al día en que falten.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/64.json"},"65":{"numero":"65","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v7","tipo":"vigente","etiqueta":"Vigente (post 24-01-2024)","publicacion":"2024-01-24","vigencia_desde":"2024-01-25","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 65. El Congreso se reunirá a partir del 1o. de septiembre de cada año para celebrar un primer periodo de sesiones ordinarias, y a partir del 1o. de febrero para celebrar un segundo periodo de sesiones ordinarias.\n\nEn ambos Períodos de Sesiones el Congreso se ocupará del estudio, discusión y votación de las Iniciativas de Ley que se le presenten y de la resolución de los demás asuntos que le correspondan conforme a esta Constitución.\n\nEn cada Período de Sesiones Ordinarias el Congreso se ocupará de manera preferente de los asuntos que señale su Ley Orgánica.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":7,"historial_url":"historial/65.json"},"66":{"numero":"66","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v3","tipo":"vigente","etiqueta":"Vigente (post 03-09-1993)","publicacion":"1993-09-03","vigencia_desde":"1993-09-04","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 66. Cada período de sesiones ordinarias durará el tiempo necesario para tratar todos los asuntos mencionados en el artículo anterior. El primer período no podrá prolongarse sino hasta el 15 de diciembre del mismo año, excepto cuando el Presidente de la República inicie su encargo en la fecha prevista por el artículo 83, en cuyo caso las sesiones podrán extenderse hasta el 31 de diciembre de ese mismo año. El segundo período no podrá prolongarse más allá del 30 de abril del mismo año.\n\nSi las dos Cámaras no estuvieren de acuerdo para poner término a las Sesiones antes de las fechas indicadas, resolverá el Presidente de la República.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":3,"historial_url":"historial/66.json"},"67":{"numero":"67","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 24-11-1923)","publicacion":"1923-11-24","vigencia_desde":"1923-11-25","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 67. El Congreso o una sola de las Cámaras, cuando se trate de asunto exclusivo de ella, se reunirán en sesiones extraordinarias cada vez que los convoque para ese objeto la Comisión Permanente; pero en ambos casos sólo se ocuparán del asunto o asuntos que la propia Comisión sometiese a su conocimiento, los cuales se expresarán en la convocatoria respectiva.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/67.json"},"68":{"numero":"68","estado":"verificado","nota":"Artículo sin reformas desde 1917: texto original = texto vigente, cotejado con el consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026).","versiones":[{"id":"v1","etiqueta":"Original (vigente)","tipo":"original","publicacion":"1917-02-05","vigencia_desde":"1917-05-01","vigencia_hasta":null,"vigencia_verificada":true,"vigencia_nota":"Texto original de 1917 sin reformas (la SCJN no publica cronología para este artículo; el consolidado de la Cámara lo marca «Artículo original DOF 05-02-1917»). En vigor desde el 1o. de mayo de 1917.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 68. Las dos Cámaras residirán en un mismo lugar y no podrán trasladarse a otro sin que antes convengan en la traslación y en el tiempo y modo de verificarla, designando un mismo punto para la reunión de ambas. Pero si conviniendo las dos en la traslación, difieren en cuanto al tiempo, modo y lugar, el Ejecutivo terminará la diferencia, eligiendo uno de los dos extremos en cuestión. Ninguna Cámara podrá suspender sus sesiones por más de tres días, sin consentimiento de la otra.","dof_url":"https://www.dof.gob.mx/Constitucion1917/constitucion_1917.pdf","dof_etiqueta":"Ver texto original en el DOF"}],"total_versiones":1,"historial_url":"historial/68.json"},"69":{"numero":"69","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v5","tipo":"vigente","etiqueta":"Vigente (post 10-02-2014)","publicacion":"2014-02-10","vigencia_desde":"2014-02-11","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 69.- En la apertura de Sesiones Ordinarias del Primer Periodo de cada año de ejercicio del Congreso, el Presidente de la República presentará un informe por escrito, en el que manifieste el estado general que guarda la administración pública del país. En la apertura de las sesiones extraordinarias del Congreso de la Unión, o de una sola de sus cámaras, el Presidente de la Comisión Permanente informará acerca de los motivos o razones que originaron la convocatoria.\n\nCada una de las Cámaras realizará el análisis del informe y podrá solicitar al Presidente de la República ampliar la información mediante pregunta por escrito y citar a los Secretarios de Estado y a los directores de las entidades paraestatales, quienes comparecerán y rendirán informes bajo protesta de decir verdad. La Ley del Congreso y sus reglamentos regularán el ejercicio de esta facultad.\n\nEn el primer año de su mandato, en la apertura del segundo periodo de sesiones ordinarias del Congreso, el Presidente de la República presentará ante la Cámara de Senadores, para su aprobación, la Estrategia Nacional de Seguridad Pública e informará anualmente sobre el estado que guarde.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":5,"historial_url":"historial/69.json"},"70":{"numero":"70","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v2","tipo":"vigente","etiqueta":"Vigente (post 06-12-1977)","publicacion":"1977-12-06","vigencia_desde":"1977-12-07","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Elección e Instalación del Congreso","texto":"Artículo 70. Toda resolución del Congreso tendrá el carácter de ley o decreto. Las leyes o decretos se comunicarán al Ejecutivo firmados por los presidentes de ambas Cámaras y por un secretario de cada una de ellas, y se promulgarán en esta forma: \"El Congreso de los Estados Unidos Mexicanos decreta: (texto de la ley o decreto)\".\n\nEl Congreso expedirá la Ley que regulará su estructura y funcionamiento internos.\n\nLa ley determinará, las formas y procedimientos para la agrupación de los diputados, según su afiliación de partido, a efecto de garantizar la libre expresión de las corrientes ideológicas representadas en la Cámara de Diputados.\n\nEsta ley no podrá ser vetada ni necesitará de promulgación del Ejecutivo Federal para tener vigencia.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":2,"historial_url":"historial/70.json"},"71":{"numero":"71","estado":"verificado","nota":"Historial extraído del PDF «Historia del texto del artículo» de la SCJN; la versión vigente coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026). Fechas de entrada en vigor por regla general, pendientes de cotejo con cada decreto.","versiones":[{"id":"v4","tipo":"vigente","etiqueta":"Vigente (post 29-01-2016)","publicacion":"2016-01-29","vigencia_desde":"2016-01-30","vigencia_verificada":false,"vigencia_nota":"Regla general (al día siguiente de su publicación); pendiente de cotejo con los transitorios del decreto.","capitulo":"De la Iniciativa y Formación de las Leyes","texto":"Artículo 71. El derecho de iniciar leyes o decretos compete:\n\nI. Al Presidente de la República;\n\nII. A los Diputados y Senadores al Congreso de la Unión;\n\nIII. A las Legislaturas de los Estados y de la Ciudad de México; y\n\nIV. A los ciudadanos en un número equivalente, por lo menos, al cero punto trece por ciento de la lista nominal de electores, en los términos que señalen las leyes.\n\nLa Ley del Congreso determinará el trámite que deba darse a las iniciativas.\n\nEl día de la apertura de cada periodo ordinario de sesiones el Presidente de la República podrá presentar hasta dos iniciativas para trámite preferente, o señalar con tal carácter hasta dos que hubiere presentado en periodos anteriores, cuando estén pendientes de dictamen. Cada iniciativa deberá ser discutida y votada por el Pleno de la Cámara de su origen en un plazo máximo de treinta días naturales. Si no fuere así, la iniciativa, en sus términos y sin mayor trámite, será el primer asunto que deberá ser discutido y votado en la siguiente sesión del Pleno. En caso de ser aprobado o modificado por la Cámara de su origen, el respectivo proyecto de ley o decreto pasará de inmediato a la Cámara revisora, la cual deberá discutirlo y votarlo en el mismo plazo y bajo las condiciones antes señaladas.\n\nNo podrán tener carácter preferente las iniciativas de adición o reforma a esta Constitución.","vigencia_hasta":null}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/71.json"},"72":{"numero":"72","estado":"historial_parcial","nota":"Historial extraído del PDF de la SCJN, pero su última versión NO coincide con el texto consolidado de la Cámara de Diputados (última reforma DOF 07-10-2026): puede haber una reforma posterior al PDF o una diferencia de extracción. Se muestra como vigente el texto del consolidado; el historial queda pendiente de cotejo.","versiones":[{"id":"v4","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2011-08-17","vigencia_desde":"2011-08-18","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Texto del consolidado de la Cámara; no procede del PDF de la SCJN. Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De la Iniciativa y Formación de las Leyes","texto":"Artículo 72. Todo proyecto de ley o decreto, cuya resolución no sea exclusiva de alguna de las Cámaras, se discutirá sucesivamente en ambas, observándose la Ley del Congreso y sus reglamentos respectivos, sobre la forma, intervalos y modo de proceder en las discusiones y votaciones:\n\nA. Aprobado un proyecto en la Cámara de su origen, pasará para su discusión a la otra. Si ésta lo aprobare, se remitirá al Ejecutivo, quien, si no tuviere observaciones que hacer, lo publicará inmediatamente.\n\nB. Se reputará aprobado por el Poder Ejecutivo todo proyecto no devuelto con observaciones a la Cámara de su origen dentro de los treinta días naturales siguientes a su recepción; vencido este plazo el Ejecutivo dispondrá de diez días naturales para promulgar y publicar la ley o decreto. Transcurrido este segundo plazo, la ley o decreto será considerado promulgado y el Presidente de la Cámara de origen ordenará dentro de los diez días naturales siguientes su publicación en el Diario Oficial de la Federación, sin que se requiera refrendo. Los plazos a que se refiere esta fracción no se interrumpirán si el Congreso cierra o suspende sus sesiones, en cuyo caso la devolución deberá hacerse a la Comisión Permanente.\n\nC. El proyecto de ley o decreto desechado en todo o en parte por el Ejecutivo, será devuelto, con sus observaciones, a la Cámara de su origen. Deberá ser discutido de nuevo por ésta,, (sic DOF 05-02-1917) y si fuese confirmado por las dos terceras partes del número total de votos, pasará otra vez a la Cámara revisora. Si por esta fuese sancionado por la misma mayoría, el proyecto será ley o decreto y volverá al Ejecutivo para su promulgación.\n\nLas votaciones de ley o decreto, serán nominales.\n\nD. Si algún proyecto de ley o decreto, fuese desechado en su totalidad por la Cámara de revisión, volverá a la de su origen con las observaciones que aquella le hubiese hecho. Si examinado de nuevo fuese aprobado por la mayoría absoluta de los miembros presentes, volverá a la Cámara que lo desechó, la cual lo tomará otra vez en consideración, y si lo aprobare por la misma mayoría, pasará al Ejecutivo para los efectos de la fracción A; pero si lo reprobase, no podrá volver a presentarse en el mismo período de sesiones.\n\nE. Si un proyecto de ley o decreto fuese desechado en parte, o modificado, o adicionado por la Cámara revisora, la nueva discusión de la Cámara de su origen versará únicamente sobre lo desechado o sobre las reformas o adiciones, sin poder alterarse en manera alguna los artículos aprobados. Si las adiciones o reformas hechas por la Cámara revisora fuesen aprobadas por la mayoría absoluta de los votos presentes en la Cámara de su origen, se pasará todo el proyecto al Ejecutivo, para los efectos de la fracción A. Si las adiciones o reformas hechas por la Cámara revisora fueren reprobadas por la mayoría de votos en la Cámara de su origen, volverán a aquella para que tome en consideración las razones de ésta, y si por mayoría absoluta de votos presentes se desecharen en esta segunda revisión dichas adiciones o reformas, el proyecto, en lo que haya sido aprobado por ambas Cámaras, se pasará al Ejecutivo para los efectos de la fracción A. Si la Cámara revisora insistiere, por la mayoría absoluta de votos presentes, en dichas adiciones o reformas, todo el proyecto no volverá a presentarse sino hasta el siguiente período de sesiones, a no ser que ambas Cámaras acuerden, por la mayoría absoluta de sus miembros presentes, que se expida la ley o decreto sólo con los artículos aprobados, y que se reserven los adicionados o reformados para su examen y votación en las sesiones siguientes.\n\nF. En la interpretación, reforma o derogación de las leyes o decretos, se observarán los mismos trámites establecidos para su formación.\n\nG. Todo proyecto de ley o decreto que fuere desechado en la Cámara de su origen, no podrá volver a presentarse en las sesiones del año.\n\nH. La formación de las leyes o decretos puede comenzar indistintamente en cualquiera de las dos Cámaras, con excepción de los proyectos que versaren sobre empréstitos, contribuciones o impuestos, o sobre reclutamiento de tropas, todos los cuales deberán discutirse primero en la Cámara de Diputados.\n\nI. Las iniciativas de leyes o decretos se discutirán preferentemente en la Cámara en que se presenten, a menos que transcurra un mes desde que se pasen a la Comisión dictaminadora sin que ésta rinda dictamen, pues en tal caso el mismo proyecto de ley o decreto puede presentarse y discutirse en la otra Cámara.\n\nI (sic DOF 24-11-1923). El Ejecutivo de la Unión no puede hacer observaciones a las resoluciones del Congreso o de alguna de las Cámaras, cuando ejerzan funciones de cuerpo electoral o de jurado, lo mismo que cuando la Cámara de Diputados declare que debe acusarse a uno de los altos funcionarios de la Federación por delitos oficiales.\n\nTampoco podrá hacerlas al Decreto de convocatoria a sesiones extraordinarias que expida la Comisión Permanente.","fuente_url":"https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf","fuente_etiqueta":"Ver texto consolidado (Cámara de Diputados)"}],"fuente_historial":"SCJN, Historia del texto del artículo (00_historia.pdf), separado con separar_versiones_scjn.py (PR #7) en Colab; Drive: /MyDrive/CPEUM_SCJN_Historial/versiones_separadas.json","total_versiones":4,"historial_url":"historial/72.json"},"73":{"numero":"73","estado":"historial_parcial","nota":"El PDF «Historia del texto» de la SCJN de este artículo está organizado por fragmentos (fracciones o apartados), no por versiones íntegras del artículo: 83 de 84 cortes no empiezan con «Artículo 73». El historial requiere un separador específico; por ahora se muestra sólo el texto vigente del consolidado de la Cámara de Diputados.","versiones":[{"id":"vig","etiqueta":"Vigente (consolidado Cámara de Diputados)","tipo":"vigente","publicacion":"2026-05-06","vigencia_desde":"2026-05-07","vigencia_hasta":null,"vigencia_verificada":false,"vigencia_nota":"Fecha de la última reforma según las notas de la Cámara de Diputados al texto consolidado; entrada en vigor asumida al día siguiente (regla general), pendiente de cotejo con el decreto.","capitulo":"De las Facultades del Congreso","texto":"Artículo 73. El Congreso tiene facultad:\n\nI. Para admitir nuevos Estados a la Unión Federal;\n\nII. Derogada.\n\nIII. Para formar nuevos Estados dentro de los límites de los existentes, siendo necesario al efecto:\n\n1o. Que la fracción o fracciones que pidan erigirse en Estados, cuenten con una población de ciento veinte mil habitantes, por lo menos.\n\n2o. Que se compruebe ante el Congreso que tiene los elementos bastantes para proveer a su existencia política.\n\n3o. Que sean oídas las Legislaturas de las entidades federativas de cuyo territorio se trate, sobre la conveniencia o inconveniencia de la erección del nuevo Estado, quedando obligadas a dar su informe dentro de seis meses, contados desde el día en que se les remita la comunicación respectiva.\n\n4o. Que igualmente se oiga al Ejecutivo de la Federación, el cual enviará su informe dentro de siete días contados desde la fecha en que le sea pedido.\n\n5o. Que sea votada la erección del nuevo Estado por dos terceras partes de los diputados y senadores presentes en sus respectivas Cámaras.\n\n6o. Que la resolución del Congreso sea ratificada por la mayoría de las Legislaturas de las entidades federativas, previo examen de la copia del expediente, siempre que hayan dado su consentimiento las Legislaturas de las entidades federativas de cuyo territorio se trate.\n\n7o. Si las Legislaturas de las entidades federativas de cuyo territorio se trate, no hubieren dado su consentimiento, la ratificación de que habla la fracción anterior, deberá ser hecha por las dos terceras partes del total de Legislaturas de las demás entidades federativas.\n\nIV. Derogada.\n\nV. Para cambiar la residencia de los Supremos Poderes de la Federación.\n\nVI. Derogada;\n\nVII. Para imponer las contribuciones necesarias a cubrir el Presupuesto.\n\nVIII. En materia de deuda pública, para:\n\n1o. Dar bases sobre las cuales el Ejecutivo pueda celebrar empréstitos y otorgar garantías sobre el crédito de la Nación, para aprobar esos mismos empréstitos y para reconocer y mandar pagar la deuda nacional. Ningún empréstito podrá celebrarse sino para la ejecución de obras que directamente produzcan un incremento en los ingresos públicos o, en términos de la ley de la materia, los que se realicen con propósitos de regulación monetaria, las operaciones de refinanciamiento o reestructura de deuda que deberán realizarse bajo las mejores condiciones de mercado; así como los que se contraten durante alguna emergencia declarada por el Presidente de la República en los términos del artículo 29.\n\n2o. Aprobar anualmente los montos de endeudamiento que deberán incluirse en la ley de ingresos, que en su caso requiera el Gobierno del Distrito Federal y las entidades de su sector público, conforme a las bases de la ley correspondiente. El Ejecutivo Federal informará anualmente al Congreso de la Unión sobre el ejercicio de dicha deuda a cuyo efecto el Jefe de Gobierno le hará llegar el informe que sobre el ejercicio de los recursos correspondientes hubiere realizado. El Jefe de Gobierno informará igualmente a la Asamblea Legislativa del Distrito Federal, al rendir la cuenta pública.\n\n3o. Establecer en las leyes las bases generales, para que los Estados, el Distrito Federal y los Municipios puedan incurrir en endeudamiento; los límites y modalidades bajo los cuales dichos órdenes de gobierno podrán afectar sus respectivas participaciones para cubrir los empréstitos y obligaciones de pago que contraigan; la obligación de dichos órdenes de gobierno de inscribir y publicar la totalidad de sus empréstitos y obligaciones de pago en un registro público único, de manera oportuna y transparente; un sistema de alertas sobre el manejo de la deuda; así como las sanciones aplicables a los servidores públicos que no cumplan sus disposiciones. Dichas leyes deberán discutirse primero en la Cámara de Diputados conforme a lo dispuesto por la fracción H del artículo 72 de esta Constitución.\n\n4o. El Congreso de la Unión, a través de la comisión legislativa bicameral competente, analizará la estrategia de ajuste para fortalecer las finanzas públicas de los Estados, planteada en los convenios que pretendan celebrar con el Gobierno Federal para obtener garantías y, en su caso, emitirá las observaciones que estime pertinentes en un plazo máximo de quince días hábiles, inclusive durante los períodos de receso del Congreso de la Unión. Lo anterior aplicará en el caso de los Estados que tengan niveles elevados de deuda en los términos de la ley. Asimismo, de manera inmediata a la suscripción del convenio correspondiente, será informado de la estrategia de ajuste para los Municipios que se encuentren en el mismo supuesto, así como de los convenios que, en su caso, celebren los Estados que no tengan un nivel elevado de deuda;\n\nIX. Para impedir que en el comercio entre entidades federativas se establezcan restricciones.\n\nX. Para legislar en toda la República sobre hidrocarburos, minería, sustancias químicas, explosivos, pirotecnia, industria cinematográfica, comercio, juegos con apuestas y sorteos, intermediación y servicios financieros, energía eléctrica y nuclear y para expedir las leyes del trabajo reglamentarias del artículo 123;\n\nXI. Para crear y suprimir empleos públicos de la Federación y señalar, aumentar o disminuir sus dotaciones.\n\nXII. Para declarar la guerra, en vista de los datos que le presente el Ejecutivo.\n\nXIII. Para dictar leyes según las cuales deben declararse buenas o malas las presas de mar y tierra, y para expedir leyes relativas al derecho marítimo de paz y guerra.\n\nXIV. Para levantar y sostener a las instituciones armadas de la Unión, a saber: Ejército, Marina de Guerra y Fuerza Aérea Nacionales, y para reglamentar su organización y servicio.\n\nXV. Derogada.\n\nXVI. Para dictar leyes sobre nacionalidad, condición jurídica de los extranjeros, ciudadanía, naturalización, colonización, emigración e inmigración y salubridad general de la República.\n\n1a. El Consejo de Salubridad General dependerá directamente del Presidente de la República, sin intervención de ninguna Secretaría de Estado, y sus disposiciones generales serán obligatorias en el país.\n\n2a. En caso de epidemias de carácter grave o peligro de invasión de enfermedades exóticas en el país, la Secretaría de Salud tendrá obligación de dictar inmediatamente las medidas preventivas indispensables, a reserva de ser después sancionadas por el Presidente de la República.\n\n3a. La autoridad sanitaria será ejecutiva y sus disposiciones serán obedecidas por las autoridades administrativas del País.\n\n4a. Las medidas que el Consejo haya puesto en vigor en la Campaña contra el alcoholismo y la venta de sustancias que envenenan al individuo o degeneran la especie humana, así como las adoptadas para prevenir y combatir la contaminación ambiental, serán después revisadas por el Congreso de la Unión en los casos que le competan.\n\nXVII. Para dictar leyes sobre vías generales de comunicación, tecnologías de la información y la comunicación, radiodifusión, telecomunicaciones, incluida la banda ancha e Internet, postas y correos, y sobre el uso y aprovechamiento de las aguas de jurisdicción federal.\n\nXVIII. Para establecer casas de moneda, fijar las condiciones que ésta deba tener, dictar reglas para determinar el valor relativo de la moneda extranjera y adoptar un sistema general de pesas y medidas;\n\nXIX. Para fijar las reglas a que debe sujetarse la ocupación y enajenación de terrenos baldíos y el precio de estos.\n\nXX. Para expedir las leyes de organización del Cuerpo Diplomático y del Cuerpo Consular mexicano.\n\nXXI. Para expedir:\n\na) Las leyes generales que establezcan como mínimo, los tipos penales y sus sanciones en las materias de feminicidio
